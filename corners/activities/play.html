<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساحة الأنشطة | Activities</title>
<meta name="description" content="ساحة الأنشطة: ألعاب أنوس التفاعلية، وساحة المسابقات، وورشة الصانع الصغير — في مكانٍ واحد.">
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../treasures/tr.css">
<style>
  .pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
  .pl-door{display:flex;flex-direction:column;gap:.4rem;background:#fff;border:2px solid var(--line);border-radius:22px;padding:1.1rem;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
  .pl-door:hover,.pl-door:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none}
  .pl-door .top{display:flex;align-items:center;gap:.7rem}
  .pl-door .ic{flex:0 0 58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--c) 14%,#fff)}
  .pl-door .t{font-weight:900;font-size:1.12rem;line-height:1.35}
  .pl-door .tag{font-size:.76rem;font-weight:800;color:var(--c)}
  .pl-door ul{margin:.2rem 0 0;padding-inline-start:1.1rem;color:var(--muted);font-size:.9rem;line-height:1.7}
  .pl-door .go{align-self:flex-start;margin-top:.4rem;background:var(--c);color:#fff;border-radius:999px;padding:.4rem 1rem;font-weight:800;font-size:.88rem}
  html.calm .pl-door{transition:none}
</style>
</head>
<body>
<div id="tr-root"></div>
<script>
/* ساحة الأنشطة — ONE home-page door for the three "doing" places (they keep their own pages & progress). */
(function () {
  var R = '../';
  var DOORS = [
    { href: R + 'skills/index.html', ic: '🛠️', c: '#7A3FB0',
      t: { ar: 'صانع المهارات', en: 'Skills Maker' }, tag: { ar: 'رحلات لتعلّم مهاراتٍ حقيقية + بودكاست', en: 'Journeys to learn real skills + podcast' },
      li: { ar: ['التاجر الصغير · مستكشف التاريخ · العالِم · الطبيب · المهندس · المزارع', 'مهمّةٌ عملية وحلقة بودكاست في كلّ محطّة'], en: ['Merchant · History explorer · Scientist · Doctor · Engineer · Farmer', 'A hands-on mission and a podcast episode at every station'] } },
    { href: R + 'activities/dashboard.html', ic: '🎲', c: '#C9A961',
      t: { ar: 'أنشطة أنوس', en: "Anos' Activities" }, tag: { ar: 'ألعابٌ وتحدّيات من كلّ الأركان', en: 'Games & challenges from every corner' },
      li: { ar: ['ألعابٌ تفاعلية تجمع ما تعلّمته في الأركان', 'اجمع النقاط والأوسمة وأنت تلعب'], en: ['Interactive games built on what you learned', 'Collect points and medals as you play'] } },
    { href: R + 'competitions/competitions.html', ic: '🏆', c: '#7A3FB0',
      t: { ar: 'ساحة المسابقات', en: 'Competitions Arena' }, tag: { ar: 'كوِّن اختبارك وتسابق', en: 'Build your quiz and race' },
      li: { ar: ['بنك أسئلة في العقيدة والقرآن والسيرة والعبادة والأخلاق', 'مؤقّت ونجوم وشهادة تميّز'], en: ['Questions on Aqeeda, Quran, Seerah, worship & manners', 'Timer, stars and a certificate'] } },
    { href: R + 'workshop/workshop.html', ic: '🧰', c: '#5E8C31',
      t: { ar: 'ورشة الصانع الصغير', en: "Little Maker's Workshop" }, tag: { ar: 'اعمل بيديك', en: 'Make it with your hands' },
      li: { ar: ['أشغالٌ يدوية وزراعة وتجارب في البيت', 'مهمّات في الطبيعة ودفتر إنجاز'], en: ['Crafts, planting and experiments at home', 'Nature missions and a maker journal'] } }
  ];
  window.TR_PAGE = {
    id: 'play', icon: '🎲', color: '#7A3FB0',
    back: { href: '../../index.html', label: { ar: 'المدينة', en: 'City' } },
    title: { ar: 'ساحة الأنشطة', en: 'Activities' },
    intro: { ar: 'تعلّم مهارة، والعب، وتسابق، واصنع بيديك — أربعة أبوابٍ في مكانٍ واحد. اختر واحدًا اليوم 🌟', en: 'Learn a skill, play, compete and make things — four doors in one place. Pick one today 🌟' },
    guide: { icon: '🧒', name: { ar: 'أنوس', en: 'Anos' }, say: { ar: 'أهلًا! أنا أنوس 👋 تعلّمتَ شيئًا جديدًا في الأركان؟ تعال نلعب به، أو نتسابق، أو نصنع شيئًا جميلًا!', en: "Hi! I'm Anos 👋 Learned something new in the corners? Let's play with it, race, or make something beautiful!" } },
    onRender: function (TR) {
      document.querySelector('[data-panel="kids"]').innerHTML = '<div class="pl-grid">' + DOORS.map(function (d) {
        return '<a class="pl-door" style="--c:' + d.c + '" href="' + d.href + '"><span class="top"><span class="ic">' + d.ic + '</span><span><span class="t">' + TR.esc(TR.t(d.t)) + '</span><br><span class="tag">' + TR.esc(TR.t(d.tag)) + '</span></span></span>' +
          '<ul>' + (TR.ar() ? d.li.ar : d.li.en).map(function (x) { return '<li>' + TR.esc(x) + '</li>'; }).join('') + '</ul>' +
          '<span class="go">' + TR.tx('ادخل ←', 'Enter →') + '</span></a>';
      }).join('') + '</div>';
    }
  };
})();
</script>
<script src="../treasures/tr.js"></script>
<script defer src="../shared/mk-system.js"></script>
<script defer src="../shared/mk-journeys.js"></script>
<script defer src="../shared/mk-bag.js"></script>
</body>
</html>
