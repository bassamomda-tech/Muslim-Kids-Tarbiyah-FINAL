<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كوكب الإبداع | Planet of Creativity</title>
<meta name="description" content="كوكب الإبداع: صانع المهارات، وألعاب أنوس التفاعلية، وساحة المسابقات — في مكانٍ واحد.">
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../treasures/tr.css">
<style>
  .pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
  .pl-door{display:flex;flex-direction:column;gap:.4rem;background:#fff;border:2px solid var(--line);border-radius:22px;padding:1.1rem;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
  .pl-door:hover,.pl-door:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none}
  .pl-door .top{display:flex;align-items:center;gap:.7rem}
  .pl-door .ic{flex:0 0 58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--c) 14%,#fff)}
  .pl-door .t{font-weight:900;font-size:1.12rem;line-height:1.35}
  .pl-door .tag{font-size:.76rem;font-weight:800;color:var(--c)}
  .pl-door ul{margin:.2rem 0 0;padding-inline-start:1.1rem;color:var(--muted);font-size:.9rem;line-height:1.7}
  .pl-door .go{align-self:flex-start;margin-top:.4rem;background:var(--c);color:#fff;border-radius:999px;padding:.4rem 1rem;font-weight:800;font-size:.88rem}
  html.calm .pl-door{transition:none}
</style>
</head>
<body>
<div id="tr-root"></div>
<script>
/* كوكب الإبداع — ONE home-page door for the three "doing" places (they keep their own pages & progress). */

    { href: R + 'activities/dashboard.html', ic: '🧩', c: '#C9A961',

    { href: R + 'league/index.html', ic: '🏅', c: '#C9962A',

    { href: R + 'brain/index.html', ic: '♟️', c: '#6C4AB6',

    title: { ar: 'كوكب الإبداع', en: 'Planet of Creativity' },

    onRender: function (TR) {
      document.querySelector('[data-panel="kids"]').innerHTML = '<div class="pl-grid">' + DOORS.map(function (d) {
        return '<a class="pl-door" style="--c:' + d.c + '" href="' + d.href + '"><span class="top"><span class="ic">' + d.ic + '</span><span><span class="t">' + TR.esc(TR.t(d.t)) + '</span><br><span class="tag">' + TR.esc(TR.t(d.tag)) + '</span></span></span>' +
          '<ul>' + (TR.ar() ? d.li.ar : d.li.en).map(function (x) { return '<li>' + TR.esc(x) + '</li>'; }).join('') + '</ul>' +
          '<span class="go">' + TR.tx('ادخل ←', 'Enter →') + '</span></a>';
      }).join('') + '</div>';
    }
  };
})();
</script>
