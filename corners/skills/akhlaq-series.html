<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخلاق الطفل المسلم | مسلسل حيّ النور</title>
<meta name="description" content="مسلسل «أخلاق الطفل المسلم»: ٣٠ حلقة مع الجدّة آمنة وعمر في «حيّ النور» تغطّي بابَي الأخلاق والآداب من كتاب «ما لا يسع أطفال المسلمين جهله» — مع ملفّ قضية ونشاط تفاعلي في كل حلقة.">
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Nunito:wght@400;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../treasures/tr.css">
<style>
  .ms-ay{font-family:Amiri,serif;font-size:1.25rem;line-height:2.1;text-align:center;color:#1a2b4a;background:#fbf6ea;border:1.5px solid #c9a04a;border-radius:14px;padding:.6rem .8rem}
  .ms-ay small{display:block;font-family:Tajawal,sans-serif;font-size:.8rem;color:#7a5a20}
  .ms-board{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
  .ms-board span{background:#22325a;color:#fff;border-radius:10px;padding:.15rem .7rem;font-size:.85rem;font-weight:800}
  .ms-qa{background:#fff;border:1.5px solid #d8cdef;border-radius:12px;padding:.45rem .7rem;margin-bottom:.4rem}
  .ms-qa summary{cursor:pointer;font-weight:800;color:#22325a}
  .ms-qa div{margin-top:.4rem;line-height:1.9}
  .ms-dyk{background:#fff4d6;border:1.5px solid #f0c860;border-radius:12px;padding:.45rem .7rem}
  .ms-case{border:2px solid #22325a;border-radius:14px;padding:.6rem .8rem;background:#fff}
  .ms-case ol{padding-inline-start:1.2rem}
  .ma{background:#f6f2fd;border:1.5px solid #c8b6ef;border-radius:16px;padding:.8rem}
  .ma-hd{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:#5b3fa8;gap:.5rem}
  .ma-prog{display:flex;gap:4px}.ma-prog i{width:22px;height:7px;border-radius:9px;background:#ddd2f5}.ma-prog i.d{background:#5b3fa8}.ma-prog i.c{background:#e7b84a}
  .ma h5{margin:.5rem 0 .3rem;font-size:1.05rem;color:#22325a}
  .ma-p{margin:.2rem 0 .6rem}
  .ma-chips,.ma-opts{display:flex;flex-wrap:wrap;gap:.45rem}
  .ma-opts{flex-direction:column}
  .ma-chip,.ma-opt{font:inherit;font-weight:700;border:2px solid #d8cdef;background:#fff;border-radius:12px;padding:.45rem .75rem;cursor:pointer;text-align:start;color:inherit}
  .ma-chip.sel,.ma-opt.pick{border-color:#5b3fa8;box-shadow:0 0 0 3px #5b3fa833}
  .ma-chip.ok,.ma-opt.ok,.ma-order li.ok{border-color:#2e9e6a;background:#e8f7ef}
  .ma-opt.meh{border-color:#e0a530;background:#fff6e2}
  .ma-chip.no,.ma-opt.no,.ma-order li.no{border-color:#d9534f;background:#fdeceb}
  .ma-chip.no{animation:maShake .4s}
  @keyframes maShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .ma-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin-top:.7rem}
  .ma-bin{border:2px dashed #b9a6e6;border-radius:14px;padding:.5rem;min-height:86px;background:#fff;cursor:pointer}
  .ma-bin b{display:block;text-align:center;color:#5b3fa8;margin-bottom:.3rem}
  .ma-in{display:flex;flex-wrap:wrap;gap:.3rem}.ma-in .ma-chip{font-size:.85rem;padding:.25rem .5rem;pointer-events:none}
  .ma-match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.ma-match>div{display:flex;flex-direction:column;gap:.4rem}
  .ma-order{list-style:none;padding:0;margin:0 0 .5rem;counter-reset:o}
  .ma-order li{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border:2px solid #d8cdef;background:#fff;border-radius:12px;padding:.4rem .6rem;margin-bottom:.35rem;counter-increment:o}
  .ma-order li span:first-child::before{content:counter(o, arabic-indic) ". ";font-weight:900;color:#5b3fa8}
  .ma-arrows button,.ma-ctl button{font:inherit;width:34px;height:34px;border-radius:10px;border:1.5px solid #c8b6ef;background:#fff;cursor:pointer;font-weight:900}
  .ma-scn{background:#fff;border-inline-start:5px solid #5b3fa8;border-radius:10px;padding:.5rem .7rem;margin-bottom:.6rem}
  .ma-total{font-weight:800;margin-bottom:.4rem}
  .ma-cats{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.5rem}
  .ma-cat{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid #e3d9f6;border-radius:12px;padding:.35rem .6rem}
  .ma-ctl{display:flex;align-items:center;gap:.5rem}.ma-ctl b{min-width:2.2rem;text-align:center}
  .ma-calc{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
  .ma-calc input{font:inherit;width:120px;padding:.4rem .6rem;border-radius:10px;border:2px solid #c8b6ef;text-align:center}
  .ma-btn,.ma-next{font:inherit;font-weight:800;background:#5b3fa8;color:#fff;border:0;border-radius:999px;padding:.45rem 1rem;cursor:pointer}
  .ma-btn.ghost{background:#fff;color:#5b3fa8;border:1.5px solid #5b3fa8}
  .ma-btn:disabled{opacity:.5}
  .ma-fb{min-height:1.6rem;margin-top:.5rem;font-weight:700}
  .ma-nav{margin-top:.6rem}
  .ma-win{background:#fff7e0;border:1.5px solid #e7b84a;border-radius:14px;padding:.6rem;text-align:center;font-weight:900}
  html.calm .ma-chip.no{animation:none}
  .sp{background:#eef5fd;border:1.5px solid #b8d4f0;border-radius:16px;padding:.7rem}
  .sp-ctl{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}.sp-prog{font-weight:800;color:#22325a;margin-inline-start:auto}
  .sp-pause{margin-top:.5rem;background:#fff7e0;border:1.5px solid #e7b84a;border-radius:12px;padding:.5rem .7rem;font-weight:800}
  .sp-lines{list-style:none;padding:0;margin:.6rem 0 0;max-height:320px;overflow:auto}
  .sp-lines li{padding:.35rem .5rem;border-radius:10px;cursor:pointer;line-height:1.8;font-size:.95rem}
  .sp-lines li b{color:#22325a}.sp-lines li.done{opacity:.55}.sp-lines li.now{background:#fff;box-shadow:0 0 0 2px #2E86C1}
  .sp-lines li.q{font-family:Amiri,serif;font-size:1.1rem}
</style>
</head>
<body>
<div id="tr-root"></div>
<script src="data/akhlaq-series.js"></script>
<script>window.MA_HERO = 'يا صاحب الخلق';</script>
<script src="money-act.js"></script>
<script src="series-podcast.js"></script>
<script>
/* «أخلاق الطفل المسلم» — ٣٠ حلقة. المحتوى مولَّد من notes/akhlaq-series/lessons وكتاب ساحة المسابقات عبر: SERIES_DIR=akhlaq-series python3 tools/money/build.py */
(function () {
  var S = window.AKHLAQ_SERIES || { episodes: [], seasons: [] };
  var AR = '٠١٢٣٤٥٦٧٨٩';
  function ar(n) { return String(n).replace(/\d/g, function (d) { return AR[d]; }); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var ICON = { 1: '💗', 2: '🏡', 3: '🌳' };
  var SCENES = ['🤔', '🏝️', '⛵', '🧭', '📜', '💡'];
  var items = S.episodes.map(function (e) {
    var pages = [{ scene: '🤔', text: ar(e.hook) }].concat(e.sections.map(function (s, k) {
      return { scene: SCENES[(k + 1) % SCENES.length], text: '<b>' + esc(s.h) + '</b><br>' + s.p.map(ar).join('<br><br>') +
        (s.board ? '<div class="ms-board">' + s.board.map(function (b) { return '<span>' + esc(ar(b)) + '</span>'; }).join('') + '</div>' : '') };
    }));
    var isl = e.islam || {};
    var islHtml = (isl.intro ? '<p>' + ar(isl.intro) + '</p>' : '') +
      (isl.ayah ? '<div class="ms-ay">﴿' + esc(isl.ayah.text) + '﴾<small>' + esc(isl.ayah.src) + '</small></div>' : '') +
      (isl.hadith ? '<div class="ms-ay">«' + esc(isl.hadith.text) + '»<small>' + esc(isl.hadith.source) + '</small></div>' : '') +
      '<p>' + ar(isl.text || '') + '</p>';
    var c = e.case, h = e.home;
    var sections = [
      { icon: '🎧', h: { ar: 'استمع إلى الحلقة (بودكاست)', en: 'Listen (podcast)' }, html: { ar: (e.podcast && e.podcast.lines && e.podcast.lines.length) ? '<div class="ms-pod" data-ep="' + e.n + '"></div>' : '' } },
      { icon: '📚', h: { ar: 'أسئلة الكتاب: اسأل نفسك ثم اكشف الجواب', en: 'Book questions' }, html: { ar: (e.qa || []).map(function (q) {
          return '<details class="ms-qa"><summary><b>' + ar(q.id) + '.</b> ' + esc(q.q) + '</summary><div>' + esc(q.a).replace(/\n/g, '<br>') + '</div></details>'; }).join('') } },
      { icon: '💡', h: { ar: 'هل تعلم؟', en: 'Did you know?' }, html: { ar: (e.dyk || []).map(function (f) { return '<p class="ms-dyk">' + esc(f) + '</p>'; }).join('') } },
      { icon: '🎮', h: { ar: 'النشاط التفاعلي: ' + e.online.title, en: 'Interactive activity' }, html: { ar: '<p>' + esc(e.online.intro) + '</p><div class="ms-act" data-ep="' + e.n + '"></div>' } },
      { icon: '🌙', h: { ar: 'من نور الوحي', en: 'From the Revelation' }, html: { ar: islHtml } },
      { icon: '✅', h: { ar: 'خلاصة الحلقة', en: 'Summary' }, html: { ar: '<ul>' + e.summary.map(function (x) { return '<li>' + esc(ar(x)) + '</li>'; }).join('') + '</ul>' } },
      { icon: '🏠', h: { ar: 'نشاط البيت: ' + h.title, en: 'Home activity' }, html: { ar: '<p>' + esc(ar(h.goal)) + '</p><ol>' + h.steps.map(function (x) { return '<li>' + esc(ar(x)) + '</li>'; }).join('') + '</ol><p><small>👨‍👩‍👧 ' + esc(h.parent) + '</small></p>' } },
      { icon: '🕵️', h: { ar: 'ملفّ القضية: ' + c.title, en: 'Case file' }, html: { ar: '<div class="ms-case"><p>' + esc(ar(c.story)) + '</p><b>الأدلّة:</b><ol>' +
        c.evidence.map(function (x) { return '<li>' + esc(ar(x)) + '</li>'; }).join('') + '</ol><b>ماذا تقرّر؟</b><ul>' +
        c.options.map(function (o, i) { return '<li>' + 'أبج'[i] + ') ' + esc(ar(o)) + '</li>'; }).join('') + '</ul><p>🧠 ' + esc(ar(c.deep)) +
        '</p><p><small>ناقش قرارك وأدلّتك مع معلّمك. الحلّ يُكشف في الحلقة القادمة!</small></p></div>' } }
    ];
    sections = sections.filter(function (x) { return x.html.ar; });
    var q = e.quiz && e.quiz[0];
    return {
      id: 'ep' + e.n, icon: ICON[e.season] || '🪙', num: e.n, tag: 's' + e.season,
      title: { ar: 'الحلقة ' + ar(e.n) + ': ' + e.title, en: 'Episode ' + e.n }, sub: { ar: (S.seasons[e.season - 1] || {}).title || '' },
      pages: pages, sections: sections,
      quiz: q ? { q: { ar: q.q }, opts: q.o.map(function (o, i) { return { t: { ar: o }, ok: i === q.a }; }), fb: { ar: q.why || 'أحسنت!' } } : null
    };
  });

  window.TR_PAGE = {
    id: 'skill-akhlaq-series', icon: '🌙', color: '#C0563A', kind: 'stories',
    back: { href: 'index.html', label: { ar: 'صانع المهارات', en: 'Skills Maker' } },
    title: { ar: 'أخلاق الطفل المسلم: مسلسل «حيّ النور»', en: 'The Muslim Child\'s Character: the Neighbourhood of Light' },
    intro: { ar: 'ثلاثون حلقة مع الجدّة آمنة وحفيدها عمر في «حيّ النور»: مواقف من البيت والمدرسة والطريق والملعب، نحقّق فيها ونختار الخلق الحسن، ونتعلّم بابَي الأخلاق والآداب من الكتاب. في كل حلقة قصة، ونشاط تفاعلي، ونشاط للبيت، وملفّ قضية!', en: 'Thirty episodes with Grandma Amina and Omar: everyday situations at home, school, on the road and in the playground.' },
    filters: S.seasons.map(function (s) { return { id: 's' + s.n, label: { ar: s.title.replace(/^الموسم [^:]+: /, ''), en: 'Season ' + s.n } }; }),
    items: items,
    panels: window.SeriesPodcast ? [SeriesPodcast.panel(S)] : null,
    onTab: function (id) { if (id !== 'podcast' && window.SeriesPodcast) SeriesPodcast.stop(); },
    parents: { ar: '<h3>كيف تستعمل الحلقة مع طفلك؟</h3><ul><li>اقرأ القصة معه صفحةً صفحة، ثم العب النشاط التفاعلي.</li><li>نفّذا نشاط البيت معًا، ولا تعطه الحلّ مباشرة.</li><li>ملفّ القضية يُحلّ في البيت، ويناقشه المعلّم في الحصّة القادمة: المهمّ أن يعلّل الطفل قراره. وأسئلة الكتاب مفتوحة للمراجعة: اسأل طفلك السؤال قبل أن يكشف الجواب.</li><li>المهامّ التي فيها تواصل أو إنترنت تتمّ بإشرافك، ودون مشاركة أيّ بيانات شخصية.</li></ul>' }
  };

  /* تشغيل النشاط التفاعلي كلّما ظهر في نافذة الحلقة */
  function mountActs(root) {
    (root || document).querySelectorAll('.ms-act:not([data-on])').forEach(function (el) {
      el.setAttribute('data-on', '1');
      var e = S.episodes.filter(function (x) { return String(x.n) === el.dataset.ep; })[0];
      if (e && window.MoneyAct) window.MoneyAct.mount(el, e);
    });
    (root || document).querySelectorAll('.ms-pod:not([data-on])').forEach(function (el) {
      el.setAttribute('data-on', '1');
      var e = S.episodes.filter(function (x) { return String(x.n) === el.dataset.ep; })[0];
      if (e && window.SeriesPodcast) window.SeriesPodcast.mount(el, e, S.podcast_hosts || {});
    });
  }
  new MutationObserver(function () { mountActs(); }).observe(document.documentElement, { childList: true, subtree: true });

  /* ?ep=رقم يفتح الحلقة مباشرة (من رمز QR في الدرس المكتوب) */
  var want = +new URLSearchParams(location.search).get('ep');
  TR_PAGE.onRender = function (TR) {
    if (!want) return;
    var i = items.map(function (x) { return x.num; }).indexOf(want); want = 0;
    if (i >= 0) setTimeout(function () { TR.open(i); }, 50);
  };
})();
</script>
<script src="../treasures/tr.js"></script>
<script defer src="../shared/mk-system.js"></script>
<script defer src="../shared/mk-journeys.js"></script>
<script defer src="../shared/mk-bag.js"></script>
</body>
</html>
