<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بطاقات الاكتشاف | مختبر الاكتشاف</title>
<meta name="description" content="بطاقات الاكتشاف للأطفال: حيوانات وطيور ونباتات ومهن ووسائل نقل بالعربية والإنجليزية مع معلومة ولعبتين. · Discovery cards for children in Arabic and English.">

<style id="__antiflash">html{background:#081E36;color-scheme:dark}</style>
<style>
/* ── Discovery Cards (page-specific; colours and fonts come from lab.css) ── */
.lab-wrap{max-width:760px}
html body .lang>button{min-height:44px!important}   /* the shared top bar sets 40px; keep the language toggle at a full 44px here */
.dc-cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.dc-cat{display:flex;flex-direction:column;align-items:center;gap:.3rem;min-width:0;min-height:150px;padding:.8rem .5rem .7rem;border-radius:1.2rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:center}
.dc-cat:hover,.dc-cat:focus-visible{border-color:var(--gold);background:rgba(255,255,255,.1)}
.dc-cat .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:2.1rem;background:var(--c,rgba(232,181,48,.15))}
.dc-cat b{font-size:1rem;font-weight:900;line-height:1.5;overflow-wrap:anywhere}
.dc-cat .pg{display:block;width:80%;height:7px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:auto}
.dc-cat .pg i{display:block;height:100%;background:var(--green);border-radius:99px}
.dc-cat small{font-size:.85rem;font-weight:900;color:var(--gold-lt)}
.lab-head h1{overflow-wrap:anywhere}
.dc-back{flex:0 0 48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font-size:1.3rem;font-weight:900;cursor:pointer}
.lab-tabs button{font-size:.88rem;line-height:1.3}
.dc-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;width:100%;min-height:330px;padding:1rem .9rem .8rem;border-radius:1.5rem;border:2px solid var(--gold);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(232,181,48,.08));color:var(--ink);cursor:pointer;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.dc-card.back{background:linear-gradient(160deg,rgba(46,158,91,.2),rgba(232,181,48,.1))}
.dc-card .em{font-size:6.2rem;line-height:1.15}
.dc-card .em.sm{font-size:3rem}
.dc-card .nm{font-size:2.1rem;font-weight:900;color:var(--gold-lt);line-height:1.8;overflow-wrap:anywhere}
.dc-card .nm.sm{font-size:1.35rem}
.dc-card .nm2{font-size:1.25rem;font-weight:800;color:var(--muted);line-height:1.7}
.dc-card .ft{font-size:1.3rem;font-weight:800;line-height:2;margin-top:.2rem}
.dc-card .sd{font-size:1.05rem;font-weight:700;color:var(--muted);line-height:1.8}
.dc-card .sd b{color:var(--gold-lt)}
.dc-q{display:inline-block;margin-top:.3rem;padding:.15rem .8rem;border-radius:999px;background:rgba(59,179,109,.22);border:1.5px solid rgba(59,179,109,.6);font-size:.88rem;font-weight:800;line-height:1.8}
.dc-card .hint{margin-top:auto;padding-top:.5rem;font-size:.85rem;font-weight:700;color:var(--muted)}
.dc-nav{display:flex;align-items:center;gap:.5rem;margin-top:.7rem}
.dc-nav .btn{flex:1;min-width:0;padding:0 .6rem}
.dc-nav .cnt{flex:0 0 auto;font-weight:900;color:var(--gold-lt);white-space:nowrap;padding:0 .2rem}
.dc-thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;margin-top:.8rem}
.dc-thumbs button{width:46px;height:46px;border-radius:.8rem;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-size:1.35rem;cursor:pointer;padding:0;opacity:.55}
.dc-thumbs button.seen{opacity:1;background:rgba(59,179,109,.16);border-color:rgba(59,179,109,.55)}
.dc-thumbs button.cur{opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.dc-ask{display:grid;place-items:center;min-height:130px;margin:.5rem 0 .2rem;border-radius:1.1rem;background:rgba(0,0,0,.2);border:1.5px dashed var(--line);font-size:5.2rem;line-height:1.2}
.dc-ask.word{font-size:2.1rem;font-weight:900;color:var(--gold-lt);min-height:96px;padding:.3rem .6rem;text-align:center;overflow-wrap:anywhere}
.dc-names button{text-align:center;font-size:1.2rem;min-height:56px}
.dc-pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;margin-top:.6rem}
.dc-pics button{min-height:96px;border-radius:1rem;border:1.5px solid var(--line);background:rgba(255,255,255,.07);font-size:3.1rem;line-height:1.2;cursor:pointer;padding:0;color:var(--ink)}
.dc-pics button.ok{background:rgba(59,179,109,.3);border-color:var(--green)}
.dc-pics button.no{opacity:.35}
.dc-game .st-after{text-align:center}
.dc-first{margin:.2rem 0 0;font-weight:800;color:var(--muted)}
.fin .st-row{justify-content:center}
@media (min-width:640px){.dc-cats{grid-template-columns:repeat(3,minmax(0,1fr))}.dc-pics{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:900px){.dc-cats{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:899px){.lab-head p{display:none}}
</style>
</head>
<body>
  <div class="header">
    <a href="../activities/play.html" class="back-btn" id="backBtn">↩️ <span class="lng-ar">كوكب الإبداع</span><span class="lng-en" style="display:none">Planet of Creativity</span></a>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="ar" class="active">عربي</button></div>
  </div>
  <main class="lab-wrap" id="lab"></main>
