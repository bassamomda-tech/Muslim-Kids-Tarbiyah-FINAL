<script type="module">
/* «المختبر ثلاثيّ الأبعاد» — real 3D models (three.js r160, MIT, bundled in vendor/ — no CDN).
   The child turns the model with a finger (drag), zooms with two fingers or the wheel, and
   switches parts on and off. Four models: Sun–Earth–Moon · the atom · water molecule & salt
   crystal · the solid shapes. Each has a short explanation and one question (→ 2 stars).
   Motion stops in calm / focus mode and when the tab is hidden. No network calls. */
import * as THREE from './vendor/three.module.min.js';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { MeshoptDecoder } from './vendor/libs/meshopt_decoder.module.js';
const BODY = {};   /* the anatomy model is downloaded once, then reused */

const LS = localStorage; let lang = 'ar'; try { lang = LS.getItem('bunyanLang') === 'en' ? 'en' : 'ar'; } catch (e) {}
const T = (a, e) => lang === 'en' ? e : a;
const N = n => lang === 'ar' ? String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]) : String(n);
const $ = id => document.getElementById(id);
const calm = () => document.documentElement.classList.contains('calm') || document.documentElement.classList.contains('a11y-focus') || matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage = $('stage'), canvas = $('cv');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) { renderer = null; }
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const pivot = new THREE.Group(); scene.add(pivot);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(4, 6, 8); scene.add(key);

/* orbit by hand: yaw/pitch of the pivot, distance of the camera */
const view = { yaw: 0.5, pitch: 0.35, dist: 9, min: 4, max: 22 };
const ptr = new Map(); let pinch = 0, touched = 0, play = true, speed = 1, cur = null, labels = [];
function applyView() { pivot.rotation.set(view.pitch, view.yaw, 0); camera.position.set(0, 0, view.dist); camera.lookAt(0, 0, 0); }
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY, performance.now()]; canvas.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); touched = performance.now(); canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return; const p = ptr.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1]; ptr.set(e.pointerId, [e.clientX, e.clientY]); touched = performance.now();
  if (ptr.size === 1) { view.yaw += dx * 0.01; view.pitch = Math.max(-1.3, Math.min(1.3, view.pitch + dy * 0.01)); }
  else if (ptr.size === 2) { const a = [...ptr.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); if (pinch) view.dist = Math.max(view.min, Math.min(view.max, view.dist * pinch / d)); pinch = d; }
});
const up = e => { if (downAt && e.type === 'pointerup' && ptr.size === 1 && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 8 && performance.now() - downAt[2] < 500 && cur && cur.tap) cur.tap(e.clientX, e.clientY); downAt = null; ptr.delete(e.pointerId); pinch = 0; canvas.style.cursor = 'grab'; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); view.dist = Math.max(view.min, Math.min(view.max, view.dist * (e.deltaY > 0 ? 1.1 : 0.9))); touched = performance.now(); }, { passive: false });
canvas.tabIndex = 0;
canvas.addEventListener('keydown', e => { const k = e.key; if (k === 'ArrowLeft') view.yaw -= 0.15; else if (k === 'ArrowRight') view.yaw += 0.15; else if (k === 'ArrowUp') view.pitch -= 0.12; else if (k === 'ArrowDown') view.pitch += 0.12; else if (k === '+' || k === '=') view.dist *= 0.9; else if (k === '-') view.dist *= 1.1; else return; e.preventDefault(); touched = performance.now(); });

/* helpers */
const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.55, metalness: 0.05 }, o || {}));
const ball = (r, c, o) => new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28), mat(c, o));
function ring(r, c) { const g = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 8, 120), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.55 })); g.rotation.x = Math.PI / 2; return g; }
function stick(a, b, r, c) { const d = new THREE.Vector3().subVectors(b, a), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 16), mat(c)); m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); return m; }
function earthTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#1F6FB5'; x.fillRect(0, 0, 512, 256);
  x.fillStyle = '#3FA35A';   /* simple land shapes — a globe a child recognises, not an accurate map */
  [[120, 70, 46, 30], [140, 150, 26, 44], [270, 80, 30, 26], [285, 140, 26, 40], [350, 80, 70, 34], [400, 120, 30, 20], [440, 170, 26, 14], [70, 60, 30, 16]].forEach(b => { x.beginPath(); x.ellipse(b[0], b[1], b[2], b[3], 0, 0, 7); x.fill(); });
  x.fillStyle = '#E9D9A6'; x.beginPath(); x.ellipse(290, 108, 34, 12, 0, 0, 7); x.fill(); x.beginPath(); x.ellipse(335, 112, 14, 10, 0, 0, 7); x.fill();
  x.fillStyle = '#F4FAFF'; x.fillRect(0, 0, 512, 14); x.fillRect(0, 242, 512, 14);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function label(obj, ar, en) { const d = document.createElement('div'); d.className = 'd3-lbl'; d.textContent = T(ar, en); stage.appendChild(d); labels.push([obj, d]); }
function clearModel() { while (pivot.children.length) pivot.remove(pivot.children[0]); labels.forEach(l => l[1].remove()); labels = []; key.visible = true; scene.children.filter(o => o.userData.tmp).forEach(o => scene.remove(o)); }

/* ── the four models ── */
const MODELS = [
  { id: 'globe', ic: '🌍', n: ['الليل والنهار', 'Day and night'], dist: 8.6,
    opts: [['fajr', '🌅 الفجر', '🌅 Dawn'], ['dhuhr', '☀️ الظهر', '☀️ Noon'], ['asr', '🌤️ العصر', '🌤️ Afternoon'], ['maghrib', '🌇 المغرب', '🌇 Sunset'], ['night', '🌙 الليل', '🌙 Night']],
    info: ['الشمس تضيء نصف الأرض فقط. والأرض تدور حول نفسها مرّةً كلّ يومٍ تقريبًا، فتنتقل مدينتنا من النصف المضيء (النهار) إلى النصف المظلم (الليل). اضغط على الأوقات لترى أين تكون المدينة المنوّرة.', 'The Sun lights only half of the Earth. The Earth spins about once a day, so our city moves from the lit half (day) to the dark half (night). Press the times to see where al-Madinah is.'],
    q: ['لماذا يأتي الليل؟', 'Why does night come?'], o: [['لأنّ الأرض تدور فيصير مكاننا في الجهة البعيدة عن الشمس', 'Because the Earth spins and our place turns away from the Sun'], ['لأنّ الشمس تنطفئ', 'Because the Sun switches off'], ['لأنّ القمر يغطّي الشمس كلّ ليلة', 'Because the Moon covers the Sun every night']],
    T: { fajr: 5.6, dhuhr: 12.3, asr: 15.6, maghrib: 18.2, night: 22 },
    build(opt) {
      key.visible = false;
      const sunDir = new THREE.Vector3(-1, 0, 0.25).normalize();
      const sun = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 20), new THREE.MeshBasicMaterial({ color: 0xFFC93C })); sun.position.copy(sunDir).multiplyScalar(3.5); pivot.add(sun);
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.85, 32, 20), new THREE.MeshBasicMaterial({ color: 0xFFE27A, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false })); glow.position.copy(sun.position); pivot.add(glow);
      label(sun, 'الشمس', 'Sun');
      const tl = new THREE.TextureLoader(), day = tl.load('img/earth-day.webp'), night = tl.load('img/earth-night.webp');
      const sunW = sunDir.clone(), em = new THREE.ShaderMaterial({ uniforms: { dayT: { value: day }, nightT: { value: night }, sun: { value: sunW } },
        vertexShader: 'varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: 'uniform sampler2D dayT; uniform sampler2D nightT; uniform vec3 sun; varying vec2 vUv; varying vec3 vN; void main(){ float d = dot(normalize(vN), sun); float m = smoothstep(-0.12, 0.12, d); vec3 dc = texture2D(dayT, vUv).rgb * (0.35 + 0.9 * max(d, 0.0)); vec3 nc = texture2D(nightT, vUv).rgb * 1.3 + vec3(0.01, 0.02, 0.05); gl_FragColor = vec4(mix(nc, dc, m), 1.0); }' });
      const tilt = new THREE.Group(); tilt.rotation.z = 0.41; pivot.add(tilt);
      const earth = new THREE.Mesh(new THREE.SphereGeometry(1.8, 96, 64), em); tilt.add(earth);
      const atm = new THREE.Mesh(new THREE.SphereGeometry(1.88, 64, 40), new THREE.MeshBasicMaterial({ color: 0x6FB7FF, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false })); tilt.add(atm);
      const axis = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 4.6, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })); tilt.add(axis);
      /* al-Madinah: lat 24.47 N, lon 39.61 E — a golden pin standing on the globe */
      const lat = 24.47, lon = 39.61, u = (lon + 180) / 360, v = (90 - lat) / 180;
      const nrm = new THREE.Vector3(-Math.cos(2 * Math.PI * u) * Math.sin(Math.PI * v), Math.cos(Math.PI * v), Math.sin(2 * Math.PI * u) * Math.sin(Math.PI * v));
      const pin = new THREE.Group(); pin.position.copy(nrm).multiplyScalar(1.8); pin.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nrm); earth.add(pin);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); stem.position.y = 0.17; pin.add(stem);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), new THREE.MeshBasicMaterial({ color: 0xFFD23F })); head.position.y = 0.36; pin.add(head);
      label(head, 'المدينة المنوّرة', 'al-Madinah');
      const w = new THREE.Vector3(), solar = () => { head.getWorldPosition(w); pivot.worldToLocal(w); w.y = 0; const a = Math.atan2(w.z, w.x), b = Math.atan2(sunDir.z, sunDir.x); let d = b - a; while (d < 0) d += Math.PI * 2; return (12 + d * 12 / Math.PI) % 24; };
      earth.rotation.y = this.rot || 0; scene.updateMatrixWorld(true);
      let goal = null;
      if (opt) {   /* the tilt makes the spin uneven, so search for the exact turn that brings the city to this time */
        const r0 = earth.rotation.y, tgt = this.T[opt]; let best = r0, bd = 99;
        for (let i = 0; i <= 1440; i++) { earth.rotation.y = r0 + i * Math.PI * 2 / 1440; earth.updateMatrixWorld(true); let d = Math.abs(solar() - tgt); d = Math.min(d, 24 - d); if (d < bd - 1e-9) { bd = d; best = earth.rotation.y; } if (d < 0.03) break; }
        earth.rotation.y = r0; earth.updateMatrixWorld(true); goal = best;
      }
      const self = this, fmt = h => { const H = Math.floor(h), M = Math.floor((h - H) * 60 / 5) * 5; return N(H) + ':' + (M < 10 ? N(0) : '') + N(M); };
      const name = h => h >= 4.8 && h < 6.3 ? T('وقت الفجر والشروق', 'dawn and sunrise') : h >= 6.3 && h < 11.8 ? T('صباح', 'morning') : h >= 11.8 && h < 13 ? T('الظهر — الشمس في أعلى السماء', 'noon — the Sun is highest') : h >= 13 && h < 17.6 ? T('العصر', 'afternoon') : h >= 17.6 && h < 19 ? T('المغرب — الشمس تغيب', 'sunset') : T('ليل', 'night');
      return dt => {
        if (goal != null) { const st = Math.min(goal - earth.rotation.y, dt * 1.6); earth.rotation.y += st; if (goal - earth.rotation.y < 1e-3) goal = null; }
        else if (!opt) earth.rotation.y += dt * 0.05;   /* after a time is chosen the Earth waits there */
        self.rot = earth.rotation.y % (Math.PI * 2); sunW.copy(sunDir).applyQuaternion(pivot.quaternion);
        const h = solar(), lit = h >= 6 && h < 18.4;
        const el = document.getElementById('gtime'); if (el) el.textContent = T('الوقت في المدينة المنوّرة: ', 'Time in al-Madinah: ') + fmt(h) + ' — ' + name(h) + (lit ? ' ☀️' : ' 🌙');
      };
    } },
  { id: 'body', ic: '🫀', n: ['جسم الإنسان', 'The human body'], dist: 8,
    /* REAL anatomy: BodyParts3D (© DBCLS, CC BY 4.0) via open-anatomy-3d (CC BY 4.0) — bones, organs and vessels only (no skin, no muscles, no reproductive organs). */
    opts: [['dig', '🍞 الهضم', '🍞 Digestion'], ['resp', '🫁 التنفّس', '🫁 Breathing'], ['circ', '❤️ الدم والقلب', '❤️ Heart & blood'], ['urin', '💧 الكلى', '💧 Kidneys'], ['nerv', '🧠 الدماغ والأعصاب', '🧠 Brain & nerves'], ['bone', '🦴 الهيكل العظمي', '🦴 Skeleton']],
    SYS: {
      dig: ['tongue', 'teeth', 'salivary_glands', 'pharynx', 'esophagus', 'stomach', 'liver', 'gallbladder', 'pancreas', 'small_intestine', 'colon', 'appendix'],
      resp: ['larynx', 'trachea', 'bronchi', 'lung_r', 'lung_l', 'diaphragm'],
      circ: ['heart', 'coronary_arteries', 'aorta', 'vena_cava_superior', 'vena_cava_inferior', 'pulmonary_vessels', 'carotid_l', 'carotid_r', 'arteries_thorax', 'arteries_abdomen', 'arteries_head', 'arteries_arm_l', 'arteries_arm_r', 'arteries_pelvis', 'arteries_leg_l', 'arteries_leg_r', 'veins_thorax', 'veins_abdomen', 'veins_arm_l', 'veins_arm_r', 'veins_pelvis', 'veins_leg_l', 'veins_leg_r', 'spleen'],
      urin: ['kidney_r', 'kidney_l', 'adrenal_r', 'adrenal_l', 'ureter_r', 'ureter_l', 'bladder'],
      nerv: ['brain', 'cerebellum', 'brainstem', 'spinal_cord', 'cranial_nerves', 'eye_r', 'eye_l', 'pituitary'],
      bone: ['skull', 'mandible', 'spine_cervical', 'spine_thoracic', 'spine_lumbar', 'ribs_r', 'ribs_l', 'sternum', 'clavicle_r', 'clavicle_l', 'scapula_r', 'scapula_l', 'humerus_r', 'humerus_l', 'forearm_r', 'forearm_l', 'hand_r', 'hand_l', 'pelvis', 'femur_r', 'femur_l', 'patella_r', 'patella_l', 'lower_leg_r', 'lower_leg_l', 'foot_r', 'foot_l']
    },
    /* the stops of each tour (the rest of the system is shown but not stopped at) */
    TOUR: {
      dig: ['teeth', 'tongue', 'salivary_glands', 'pharynx', 'esophagus', 'stomach', 'liver', 'gallbladder', 'pancreas', 'small_intestine', 'colon', 'appendix'],
      resp: ['larynx', 'trachea', 'bronchi', 'lung_r', 'lung_l', 'diaphragm'],
      circ: ['heart', 'coronary_arteries', 'aorta', 'vena_cava_superior', 'vena_cava_inferior', 'pulmonary_vessels', 'carotid_r', 'spleen'],
      urin: ['kidney_r', 'adrenal_r', 'ureter_r', 'bladder'],
      nerv: ['brain', 'cerebellum', 'brainstem', 'spinal_cord', 'cranial_nerves', 'pituitary', 'eye_r'],
      bone: ['skull', 'mandible', 'spine_thoracic', 'ribs_r', 'sternum', 'clavicle_r', 'scapula_r', 'humerus_r', 'pelvis', 'femur_r', 'patella_r']
    },
    ORG: {
      teeth: ['الأسنان', 'Teeth', 'تقطع الطعام وتطحنه حتى يصير قطعًا صغيرة يسهل بلعها وهضمها.', 'They cut and grind food into small pieces that are easy to swallow and digest.'],
      tongue: ['اللسان', 'Tongue', 'عضلةٌ تقلّب الطعام في الفم وتدفعه للبلع، وفيها براعم التذوّق، ونتكلّم بها.', 'A muscle that turns food in the mouth and pushes it to be swallowed; it has the taste buds, and we speak with it.'],
