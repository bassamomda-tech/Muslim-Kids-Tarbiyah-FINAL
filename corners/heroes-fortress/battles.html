<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dusk">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خُطَط القادة | حِصن الأبطال</title>
<meta name="description" content="خُطَط القادة: خمس معارك من التاريخ الإسلامي على خرائط تفاعلية — بدر، الخندق، حطّين وفتح القدس، عين جالوت، فتح القسطنطينية. · The Commanders' Plans: five battles from Islamic history as interactive maps.">
<meta name="theme-color" content="#0C0A1C">
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Amiri:wght@700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

<script>(function(){try{var p=JSON.parse(localStorage.getItem('hisn-prefs2')||'{}');if(p.theme)document.documentElement.dataset.theme=p.theme;}catch(e){}})();</script>
<style id="__antiflash">html{background:#0C0A1C;color-scheme:dark}</style>
<style>
  /* «خُطَط القادة» — page styles (colours and fonts come from the Fortress theme in styles/base.css) */
  html[dir="ltr"] body{font-family:'Nunito','Tajawal',system-ui,sans-serif}
  .bt-hdr{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .9rem;background:var(--topbar);border-bottom:1px solid var(--line)}
  .bt-hdr .back-btn{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 1rem;border-radius:2rem;background:var(--accent);color:#fff;font-weight:800;text-decoration:none;font-size:.9rem}
  .bt-hdr .lang{display:flex;border:1.5px solid var(--line);border-radius:2rem;overflow:hidden}
  .bt-hdr .lang button{min-width:48px;min-height:44px;padding:0 .8rem;border:0;background:transparent;color:var(--fg);font:800 .85rem 'Tajawal','Nunito',sans-serif;cursor:pointer}
  .bt-hdr .lang button.active{background:var(--gold);color:#1a1208}

  .bt-wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:1rem 1rem 4.5rem}
  .bt-wrap button{font-family:inherit;cursor:pointer}
  .bt-wrap button:focus-visible,.bt-hdr a:focus-visible,.bt-hdr button:focus-visible{outline:3px solid var(--gold-lt);outline-offset:2px}

  /* hub */
  .bt-crest{text-align:center;padding:.6rem 0 1.1rem}
  .bt-seal{font-size:2.6rem;line-height:1}
  .bt-crest h1{font-size:1.9rem;font-weight:900;color:var(--gold-lt);margin:.25rem 0 .35rem}
  .bt-crest p{color:var(--fg-dim);line-height:1.8;max-width:34rem;margin:0 auto;font-size:1rem}
  .bt-count{display:inline-block;margin-top:.7rem;padding:.3rem .9rem;border-radius:2rem;background:var(--stone);border:1px solid var(--stone-line);color:var(--gold-lt);font-weight:800;font-size:.85rem}
  .bt-list{list-style:none;display:flex;flex-direction:column;gap:.75rem;position:relative}
  .bt-card{width:100%;display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"num ic tx" "go go go";align-items:center;gap:.5rem .75rem;text-align:start;
    background:linear-gradient(160deg,var(--stone-lt),var(--stone));border:1.5px solid var(--stone-line);border-inline-start:6px solid var(--bc);border-radius:1.2rem;padding:.85rem .9rem;color:var(--fg);min-height:88px;transition:transform .15s,border-color .2s}
  .bt-card:hover{transform:translateY(-2px);border-color:var(--bc)}
  .bt-num{grid-area:num;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:#fff;font-weight:900;font-size:.95rem}
  .bt-card .bt-ic{grid-area:ic;font-size:1.9rem;line-height:1}
  .bt-tx{grid-area:tx;display:flex;flex-direction:column;gap:.1rem;min-width:0}
  .bt-tx b{font-size:1.12rem;font-weight:900;line-height:1.4}
  .bt-tx small{color:var(--gold-lt);font-weight:800;font-size:.8rem}
  .bt-tx em{font-style:normal;color:var(--fg-dim);font-size:.88rem;line-height:1.5}
  .bt-go{grid-area:go;justify-self:end;background:var(--bc);color:#fff;border-radius:2rem;padding:.4rem 1rem;font-weight:800;font-size:.88rem}
  .bt-card.done .bt-go{background:#2E9E5B}
  .bt-note{margin-top:1.1rem;text-align:center;color:var(--fg-faint);font-size:.82rem;line-height:1.7}
  @media(min-width:620px){.bt-card{grid-template-columns:auto auto 1fr auto;grid-template-areas:"num ic tx go"}}

  /* lesson */
  .bt-back{min-height:44px;padding:0 1rem;border-radius:2rem;border:1.5px solid var(--line);background:transparent;color:var(--fg);font-weight:800;font-size:.9rem}
  .bt-head{display:flex;align-items:center;gap:.7rem;margin:.7rem 0 .6rem;scroll-margin-top:calc(var(--mktb-h,62px) + 8px)}
  .bt-head .bt-ic{font-size:2.2rem;line-height:1}
  .bt-head h1{font-size:1.5rem;font-weight:900;color:var(--gold-lt);line-height:1.35}
  .bt-head p{color:var(--fg-dim);font-weight:800;font-size:.88rem}
  .bt-dots{list-style:none;display:flex;gap:.3rem;margin:0 0 .7rem}
  .bt-dots li{flex:1;height:8px;border-radius:8px;background:var(--stone-lt);border:1px solid var(--stone-line)}
  .bt-dots li.past{background:var(--bc);border-color:var(--bc)}
  .bt-dots li.now{background:var(--gold-lt);border-color:var(--gold-lt)}
  .bt-dots li span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  .bt-map{background:var(--stone);border:1.5px solid var(--stone-line);border-radius:1.1rem;overflow:hidden;scroll-margin-top:calc(var(--mktb-h,62px) + 6px)}
  .bt-map svg{display:block;width:100%;height:auto;background:#EAD9AE}
  .bt-key{display:flex;flex-wrap:wrap;gap:.3rem .9rem;padding:.45rem .8rem 0;font-size:.8rem;font-weight:800;color:var(--fg-dim)}
  .bt-key span{display:inline-flex;align-items:center;gap:.35rem}
  .bt-key .k{width:.9rem;height:.9rem;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.35)}
  .bt-key .k.m{background:#1F8A55}.bt-key .k.e{background:#B5482F}.bt-key .k.w{background:#3F97CF;border-radius:50%}
  .bt-map figcaption{padding:.4rem .8rem .65rem;font-size:.9rem;line-height:1.65;color:var(--fg);min-height:3.6em}

  /* map drawing */
  #btSvg .snd{fill:#EAD9AE}
  #btSvg .sea{fill:#4E9FD1}
  #btSvg .lnd{fill:#E3D2A2;stroke:#B79F63;stroke-width:1}
  #btSvg .cty{fill:#F3E7C4;stroke:#9B8656;stroke-width:1}
  #btSvg .vl{fill:#CFDDA0}
  #btSvg .gr{fill:#5E9E57}
  #btSvg .tre{fill:#4F8F4B;stroke:#356B33;stroke-width:1}
  #btSvg .hr{fill:#6E6259}
  #btSvg .hl{fill:#BC955F;stroke:#8A6A3D;stroke-width:1.2}
  #btSvg .wl{fill:#3F97CF;stroke:#fff;stroke-width:1.6}
  #btSvg .bsn{fill:#3F97CF;stroke:#1d5f8f;stroke-width:1.2}
  #btSvg .strm{fill:none;stroke:#3F97CF;stroke-width:3;stroke-linecap:round}
  #btSvg .hs{fill:#F6EBCB;stroke:#8A6A3D;stroke-width:1}
  #btSvg .twn{fill:#F6EBCB;stroke:#7C6A48;stroke-width:2}
  #btSvg .dot{fill:#B79F63}
  #btSvg .rt{fill:none;stroke:#8A6A3D;stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round}
  #btSvg .opn{fill:none;stroke:#B5482F;stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round}
  #btSvg .tr{fill:none;stroke:#5B3F1E;stroke-width:6;stroke-linecap:round}
  #btSvg .wnd{fill:none;stroke:#6C8FA8;stroke-width:2;stroke-linecap:round}
  #btSvg .wal{fill:#F3E7C4;stroke:#7C6A48;stroke-width:6;stroke-dasharray:10 3}
  #btSvg .gate{fill:#EAD9AE}
  #btSvg .msq{fill:#fff;stroke:#7C6A48;stroke-width:1.5}
  #btSvg .dm{fill:#D9A92B;stroke:#8A6508;stroke-width:1.5}
  #btSvg .wl2{fill:none;stroke:#6B5A3C;stroke-width:5;stroke-dasharray:7 2}
  #btSvg .chn{fill:none;stroke:#2B2B2B;stroke-width:3.5;stroke-dasharray:4 2}
  #btSvg .frt{fill:#8C7B62;stroke:#4A3F2E;stroke-width:1.2}
  #btSvg .cn{fill:#333;stroke:#000;stroke-width:1}
  #btSvg .bk{stroke:#1b1b1b;stroke-width:1.2}
  #btSvg .bk.m,#btSvg .fl.m,#btSvg .tn.m,#btSvg .bo.m,#btSvg .ah.m{fill:#1F8A55}
  #btSvg .bk.e,#btSvg .fl.e,#btSvg .tn.e,#btSvg .bo.e,#btSvg .ah.e{fill:#B5482F}
  #btSvg .ah.n{fill:#55606B}
  #btSvg .bk.hid{fill:rgba(31,138,85,.25);stroke:#1F8A55;stroke-dasharray:4 3}
  #btSvg .fl,#btSvg .tn,#btSvg .bo{stroke:#1b1b1b;stroke-width:1;stroke-linejoin:round}
  #btSvg .arw{fill:none;stroke-width:3.2;stroke-linecap:round}
  #btSvg .arw.m{stroke:#1F8A55}#btSvg .arw.e{stroke:#B5482F}#btSvg .arw.n{stroke:#55606B}
  #btSvg .arw.dsh{stroke-dasharray:6 5}
  #btSvg .lb{font-family:'Tajawal','Nunito',sans-serif;font-size:12px;font-weight:800;text-anchor:middle;fill:#2C2620;stroke:#FBF1DA;stroke-width:3px;stroke-linejoin:round;paint-order:stroke}
  html[dir="ltr"] #btSvg .lb{font-family:'Nunito','Tajawal',sans-serif;font-size:11px}
  #btSvg .lb.big{font-size:14px;font-weight:900}
  #btSvg .lb.sm{font-size:10.5px}
  #btSvg .lb.xs{font-size:9px}
  html[dir="ltr"] #btSvg .lb.sm{font-size:9.5px}
  html[dir="ltr"] #btSvg .lb.xs{font-size:8.5px}
  #btSvg .lb.dim{fill:#5A4A2E}
  #btSvg .lb.wt{fill:#fff;stroke:#1E5A85}
  #btSvg .lb.wtr{fill:#134F7C}
  #btSvg .lb.s-m{fill:#0C5632}
  #btSvg .lb.s-e{fill:#8A2A16}
  #btSvg .st{opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
  #btSvg .st.on{opacity:1;visibility:visible;transition:opacity .6s ease}
  #btSvg .st .arw:not(.dsh),#btSvg .st .drw{stroke-dasharray:1;stroke-dashoffset:1}
  #btSvg .st.on .arw:not(.dsh),#btSvg .st.on .drw{animation:btDraw 1.3s ease .25s forwards}
  #btSvg .st.on .wnd{animation:btWind 2.4s ease-in-out infinite}
  @keyframes btDraw{to{stroke-dashoffset:0}}
  @keyframes btWind{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

  /* panels */
  .bt-body{margin-top:.8rem}
  .bt-panel{background:linear-gradient(170deg,var(--stone-lt),var(--stone));border:1.5px solid var(--stone-line);border-radius:1.2rem;padding:1rem 1rem 1.1rem}
  .bt-panel h2{font-size:1.2rem;font-weight:900;color:var(--gold-lt);margin-bottom:.5rem;line-height:1.5}
  .bt-p{font-size:1.04rem;line-height:1.95;color:var(--fg)}
  .bt-kick{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;margin-bottom:.45rem;font-size:.85rem;font-weight:800;color:var(--fg-dim)}
  .bt-kick b{background:var(--bc);color:#fff;border-radius:2rem;padding:.2rem .75rem}
  .bt-panel h2.bt-q{color:var(--fg);font-size:1.1rem;line-height:1.8;font-weight:800}
  .bt-opts{display:flex;flex-direction:column;gap:.6rem;margin-top:.7rem}
  .bt-opt{display:flex;align-items:center;gap:.7rem;width:100%;min-height:56px;text-align:start;padding:.65rem .8rem;border-radius:1rem;border:1.5px solid var(--stone-line);background:rgba(255,255,255,.05);color:var(--fg);font-size:1.02rem;font-weight:700;line-height:1.6;transition:border-color .15s,background .15s}
  .bt-opt:hover:not(:disabled){border-color:var(--gold-lt);background:rgba(245,204,90,.1)}
  .bt-opt i{flex:0 0 2rem;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:#fff;font-style:normal;font-weight:900}
  .bt-opt.right{border-color:#2E9E5B;background:rgba(46,158,91,.18)}
  .bt-opt.right i{background:#2E9E5B}
  .bt-opt.miss{opacity:.55}
  .bt-opt:disabled{cursor:default}
  .bt-fb{min-height:1.8em;margin-top:.6rem;font-weight:800;color:var(--fg-dim)}
  .bt-fb.ok{color:#8FE3B0}
  [data-theme="parchment"] .bt-fb.ok{color:#1c7a44}
  .bt-res{border-radius:1rem;padding:.75rem .85rem;margin-top:.5rem;line-height:1.85;font-size:1rem;border:1.5px solid var(--stone-line);background:rgba(255,255,255,.05)}
  .bt-res.ok{border-color:#2E9E5B;background:rgba(46,158,91,.14)}
  .bt-res.soft{border-color:var(--gold);background:rgba(224,168,42,.1)}
  .bt-res p+p{margin-top:.25rem}
  .bt-tag{display:inline-block;font-weight:900;margin-bottom:.3rem;color:var(--gold-lt)}
  .bt-taken{color:var(--gold-lt)}
  [data-theme="parchment"] .bt-tag,[data-theme="parchment"] .bt-taken{color:var(--gold-dk)}
  .bt-act{margin-top:.8rem;padding-top:.75rem;border-top:1px dashed var(--stone-line)}
  .bt-act h3{font-size:1.02rem;font-weight:900;color:var(--gold-lt);margin-bottom:.3rem}
  .bt-vals{list-style:none;display:flex;flex-direction:column;gap:.6rem}
  .bt-vals li{display:flex;gap:.7rem;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--stone-line);border-radius:1rem;padding:.7rem .8rem}
  .bt-vals .vi{font-size:1.6rem;line-height:1.2}
  .bt-vals b{display:block;font-size:1.05rem;font-weight:900}
  .bt-vals p{color:var(--fg-dim);line-height:1.7;font-size:.95rem}
  .bt-src{margin-top:.9rem;font-size:.85rem;line-height:1.8;color:var(--fg-dim)}
  .bt-nav{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:.8rem;flex-wrap:wrap}
  .bt-btn{min-height:50px;padding:0 1.3rem;border-radius:2rem;border:0;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:900;font-size:1.02rem}
  .bt-btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg);font-weight:800}
  .bt-fin{text-align:center}
  .bt-stars{font-size:2rem;letter-spacing:.3rem}
  .bt-fin .bt-nav{justify-content:center}
  @media(prefers-reduced-motion:reduce){
    #btSvg .st,#btSvg .st.on{transition:none}
    #btSvg .st.on .arw:not(.dsh),#btSvg .st.on .drw{animation:none;stroke-dashoffset:0}
    #btSvg .st.on .wnd{animation:none}
    .bt-card{transition:none}
  }
</style>
</head>
