<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stories.css">
<style>
/* picture area in reader */
.rd-pic{
  --sc:var(--rc,var(--gold));
  width:100%;height:clamp(160px,46vw,220px);border-radius:1.3rem;overflow:hidden;position:relative;
  background:linear-gradient(180deg,color-mix(in oklab,var(--sc) 30%,#dff3ff) 0%,color-mix(in oklab,var(--sc) 12%,#fffaf0) 100%);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--sc) 30%,transparent),0 8px 20px -10px color-mix(in oklab,var(--sc) 60%,transparent);
  display:grid;place-items:center;margin-bottom:.8rem;isolation:isolate;
}
/* a real illustration (if one is ever provided) keeps its natural frame and hides the drawn scene */
.rd-pic.has-img{height:auto;aspect-ratio:16/10}
.rd-pic.has-img .scene{display:none}
/* a drawn picture of this very page (story-pics.js): the picture fills the frame, the emoji becomes a small badge */
.rd-pic.has-pic{height:auto;aspect-ratio:12/5;background:#fff}
.rd-pic.has-pic .scene{animation:picIn .5s both}
.rd-pic.has-pic .ph{position:absolute;bottom:.45rem;inset-inline-start:.45rem;z-index:2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem !important;line-height:1;background:rgba(255,255,255,.93);box-shadow:0 2px 8px rgba(0,0,0,.25);filter:none;animation:none !important}
.rd-pic.no-emo .ph{display:none !important}
@keyframes picIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.rd-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:3}
.rd-pic.night{background:linear-gradient(180deg,color-mix(in oklab,var(--sc) 45%,#141a3c) 0%,color-mix(in oklab,var(--sc) 55%,#3b3f7a) 100%)}
.rd-pic .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scene .sun{fill:#FFD66B}
.scene .sun-glow{fill:#FFE9A8;opacity:.55}
.scene .moon{fill:#FFF3C4}
.scene .star{fill:#FFF6D6}
.scene .cloud{fill:#fff;opacity:.85}
.scene .far{fill:color-mix(in oklab,var(--sc) 35%,#ffffff)}
.scene .mid{fill:color-mix(in oklab,var(--sc) 60%,#ffffff)}
.scene .near{fill:color-mix(in oklab,var(--sc) 85%,#2b2b2b)}
.scene .sand1{fill:#F3D79A}.scene .sand2{fill:#E8BF6E}
.scene .sea1{fill:color-mix(in oklab,#2E9BD6 70%,var(--sc))}.scene .sea2{fill:color-mix(in oklab,#1C78B8 75%,var(--sc))}
.scene .foam{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.7}
.scene .leaf{fill:color-mix(in oklab,#4CAF50 75%,var(--sc))}.scene .leaf2{fill:color-mix(in oklab,#2E8B57 75%,var(--sc))}
.scene .trunk{fill:#8B5E3C}
.scene .bloom{fill:#FF9EB5}
.scene .dot{fill:#fff;opacity:.5}
.rd-pic.night .scene .far{fill:color-mix(in oklab,var(--sc) 40%,#2a2f5c)}
.rd-pic.night .scene .mid{fill:color-mix(in oklab,var(--sc) 35%,#1d2247)}
.rd-pic.night .scene .near{fill:color-mix(in oklab,var(--sc) 25%,#11142e)}
.scene .drift{animation:scDrift 14s ease-in-out infinite alternate}
.scene .twinkle{animation:scTwinkle 2.6s ease-in-out infinite}
.scene .twinkle:nth-of-type(3n){animation-delay:.9s}.scene .twinkle:nth-of-type(3n+1){animation-delay:1.7s}
@keyframes scDrift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes scTwinkle{0%,100%{opacity:.35}50%{opacity:1}}
.rd-pic .ph{
  position:relative;z-index:2;font-size:clamp(3.2rem,13vw,4.4rem);line-height:1;
  width:1.75em;height:1.75em;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.75) 55%,rgba(255,255,255,0) 72%);
  filter:drop-shadow(0 8px 12px rgba(40,30,20,.18));
  animation:pop .45s both,phFloat 3.6s ease-in-out .45s infinite;
}
.rd-pic.night .ph{background:radial-gradient(circle,rgba(255,246,214,.55) 0%,rgba(255,246,214,.22) 55%,rgba(255,246,214,0) 72%)}
@keyframes phFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){
  .rd-pic .ph{animation:none}
  .scene .drift,.scene .twinkle{animation:none}
}
.rd-tools{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.6rem}
.rd-tools button{
  display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);
  background:var(--paper2);color:var(--wood);font:800 .8rem var(--font-body);
  border-radius:999px;padding:.5rem 1rem;min-height:40px;transition:.2s;
}
.rd-tools button:hover{background:var(--line)}
.rd-tools button.speaking{background:var(--rc,var(--gold));color:#fff;border-color:transparent}
.rd-dua{
  margin-top:.7rem;font-family:var(--font-story);font-size:1.15rem;color:var(--gold-deep);
  background:var(--paper2);border-radius:.9rem;padding:.7rem 1rem;line-height:1.9;
}
.toast{
  position:fixed;bottom:1.2rem;inset-inline-start:50%;transform:translateX(50%) translateY(20px);
  background:var(--wood);color:#fff;font-weight:800;font-size:.82rem;padding:.7rem 1.2rem;
  border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:99;
  max-width:90vw;text-align:center;line-height:1.6;
}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
</style>
<script src="../shared/voice-engine.js"></script>
</head>
<body data-screen-label="رحلة منارة للصغار">

<header class="topbar">
  <a href="little.html" class="back-city">↩︎ مكتبة الصغار</a>
  <div class="tb-brand">
    <div class="tb-mark" id="jMark">🕌</div>
    <div class="tb-name" id="jName">…<small id="jTag"></small></div>
  </div>
</header>

<section class="hero">
  <span class="lamp" id="jLamp">🕌</span>
  <h1 id="jTitle">…</h1>
  <p id="jDesc"></p>
</section>

<div class="progress-strip">
  <div class="ps-card">
    <span class="ic">🌟</span>
    <div class="ps-meta"><b>حكاياتي المكتملة</b><span id="psSub"></span></div>

<div class="shelf">رفُّ الحكايات</div>

<footer class="foot">🏮 حكاياتٌ مبسّطةٌ من رحلاتِ منارةِ العقيدة · النسخةُ الكاملةُ (٧–١٢) في منارةِ العقيدة نفسِها</footer>

<!-- READER -->
<div class="reader" id="reader" data-screen-label="قارئ الحكاية">
  <div class="rd-box" id="rdBox">
    <button class="rd-x" id="rdClose" aria-label="إغلاق">✕</button>
    <div class="rd-dots" id="rdDots"></div>
    <div class="rd-title" id="rdTitle"></div>
    <div class="rd-pic" id="rdPic"><img id="rdImg" alt=""><span class="ph" id="rdPh">🏮</span></div>
    <div class="rd-tools">
      <button id="btnSpeak">🔊 اقرئي لي</button>
      <button id="btnPrompt">🎨 انسخْ وصفَ الصورة</button>
    </div>
    <div class="rd-text" id="rdText"></div>
    <div class="rd-nav">
      <button class="rd-prev" id="rdPrev">→ السابق</button>
      <button class="rd-next" id="rdNext">التالي ←</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="minaret-little/journeys.js"></script>
<script src="prophets-little/journeys.js"></script>
<script src="ibada-little/journeys.js"></script>
<script src="seerah-little/journeys.js"></script>
<script src="companions-little/journeys.js"></script>
<script src="story-endings.js"></script>
<script src="mini-games.js"></script>
<script src="../shared/story-pics.js"></script>
<!-- same warm FEMALE cloud voice as every other corner (loaded directly so the path never breaks) -->
<script>
  window.MK_TTS_ENDPOINT = window.MK_TTS_ENDPOINT || 'https://narrate-ltyvjxcneq-uc.a.run.app';
  window.MK_NARRATOR_GENDER = 'female';
</script>
<script defer src="../shared/mk-tts-cloud.js"></script>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var params = new URLSearchParams(location.search);
  var jid = params.get('j') || 'tawheed';
  var src = params.get('src') || (params.get('src')==='prophets'?'prophets':'minaret');
  var isProphets = src==='prophets';
  var SRC = { prophets:{dir:'prophets-little',ns:'PROPHET_LITTLE',meta:'PROPHET_JOURNEYS',key:'mk-stories-plittle-'},
              ibada:{dir:'ibada-little',ns:'IBADA_LITTLE',meta:'IBADA_JOURNEYS',key:'mk-stories-iblittle-'},
              seerah:{dir:'seerah-little',ns:'SEERAH_LITTLE',meta:'SEERAH_JOURNEYS',key:'mk-stories-selittle-'},
              companions:{dir:'companions-little',ns:'COMPANIONS_LITTLE',meta:'COMPANIONS_JOURNEYS',key:'mk-stories-colittle-'},
              minaret:{dir:'minaret-little',ns:'MINARET_LITTLE',meta:'MINARET_JOURNEYS',key:'mk-stories-minlittle-'} };
  var CFG = SRC[src] || SRC.minaret;
  var DIR = CFG.dir;
  var NSKEY = CFG.ns;
  var metaList = window[CFG.meta]||[];
  var meta = metaList.find(function(x){ return x.id===jid; });
  if(!meta || !meta.ready){ location.replace('little.html'); return; }

  var KEY = CFG.key+jid;
  function loadDone(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
  var done = loadDone();
  var AR = function(n){ return String(n).replace(/\d/g,function(d){ return '٠١٢٣٤٥٦٧٨٩'[d]; }); };

  /* image prompt style prefix for nanobanana / Gemini */
  var STYLE = "Children's storybook illustration for ages 3-6, soft warm watercolor with paper texture, cozy golden-library palette, simple friendly shapes, no text or writing anywhere, culturally Islamic-appropriate, never depict prophets or their faces. Scene: ";

  var J=null, STORIES=[];
  var s=document.createElement('script');
  s.src=DIR+'/'+jid+'.js';
  s.onload=init; s.onerror=function(){ location.replace('little.html'); };
  document.head.appendChild(s);

  function init(){
    J = window[NSKEY] && window[NSKEY][jid];
    if(!J){ location.replace('little.html'); return; }
    STORIES = J.stories;
    document.title = J.title+' · ركن القصص للصغار';
    $('#jMark').textContent = J.icon; $('#jLamp').textContent = J.icon;
    $('#jName').innerHTML = J.title+'<small>'+J.tag+' · من ٣ إلى ٦ سنوات</small>';
    $('#jTitle').innerHTML = isProphets ? 'حكاياتُ <em>'+J.title+'</em>' : 'رحلةُ <em>'+J.title+'</em>';
    $('#jDesc').textContent = 'حكاياتٌ قصيرةٌ سهلةٌ تزرعُ في قلبِ طفلِك: '+J.tag+'. كلُّ صفحةٍ صورةٌ وجملٌ بسيطةٌ تُقرأُ بصوتٍ جميل.';
    renderBooks(); renderProgress();
  }

  function renderBooks(){
    $('#books').innerHTML = STORIES.map(function(st,i){
      var isDone = !!done[st.id];
      return '<article class="book" style="--bc:'+st.color+';animation-delay:'+(0.04+i*0.05)+'s">'
        + (isDone ? '<span class="ribbon">✓ أنهيتُها</span>' : '')
        + '<div class="cover">'+st.icon+'</div>'
        + '<h3>'+st.title+'</h3>'
        + '<div class="who">'+st.tag+'</div>'
        + '<div class="meta"><span class="chip">📄 '+AR(st.pages.length)+' صفحات</span>'
        + (isDone ? '<span class="chip done">🌟 مكتملة</span>' : '') + '</div>'
        + '<button class="open-btn" data-i="'+i+'">'+(isDone?'اقرأها من جديد 📖':'افتحِ الحكاية 📖')+'</button>'
        + '</article>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.open-btn'),function(b){
      b.addEventListener('click',function(){ openStory(+b.getAttribute('data-i')); });
    });
  }
  function renderProgress(){
    var n = STORIES.filter(function(s){ return done[s.id]; }).length;
    $('#psPct').textContent = AR(n)+'/'+AR(STORIES.length);
    $('#psFill').style.width = (n/STORIES.length*100)+'%';
    $('#psSub').textContent = n===0?'ابدأ أولَ حكاية!':n===STORIES.length?'ما شاء الله! أتممتَ الرحلةَ كلَّها 🎉':'أحسنت! أكملِ الرحلة 💪';
  }

  /* ── reader ── */
  var cur=null, page=0, actSolved=false, gameWon=false, seq=[], EX={};
  function openStory(i){
    cur = STORIES[i]; page = 0;
    EX = (window.STORY_ENDINGS||{})[jid+':'+cur.id]||{};
    seq = [{t:'intro'}];
    cur.pages.forEach(function(p,k){ seq.push({t:'page',p:p,i:k}); });
    seq.push({t:'lessons'});
    seq.push({t:'apply'});
    if(cur.act) seq.push({t:'act'});
    if(cur.game) seq.push({t:'game'});
    $('#rdBox').style.setProperty('--rc',cur.color);
    $('#rdTitle').textContent = cur.icon+' '+cur.title;
    $('#reader').classList.add('open');
    renderPage();
  }
  function closeReader(){ stopSpeak(); $('#reader').classList.remove('open'); cur=null; }

  function imgPath(p){ return 'minaret-art/'+jid+'-'+cur.id+'-'+(p+1)+'.png'; }

  /* ── drawn scene shown behind the emoji while no real illustration exists ──
     pure inline SVG (no external files), tinted with the story colour (--rc).
     No faces / figures — only sky, sun/moon, hills, desert, sea, trees, mosque. */
  var THEMES = {
    night:  '🌙⭐🌟✨💫🌌🌠🌃🏮🕯️',
    sea:    '🌊💧🚢⛵🐟🐠🐳🐋🌧️☔🏝️🐚🦈🌀',
    desert: '🐪🐫🌴☀️🏜️⛰️🏔️🪨🔥🐍🦁🐑🐐⛺🌪️🌅🗿🧱',
    mosque: '🕌🕋🤲📖📜📿☝️🙇📚⚖️🛡️👑🏰📣📢🚪🔑💎',
    garden: '🌳🌱🌸🌷🌻🐦🕊️🌍🌎🌏🍎🍇🌿🏡🏠🐝🦋🍃🌾🐄🐓💧'
  };
  function themeFor(emoji){
    var e = String(emoji||'');
    for(var k in THEMES){ if(e && THEMES[k].indexOf(e)>-1) return k; }
    return 'sky';
  }
  function sceneSVG(theme, flip){
    var night = theme==='night';
    var sky = '';
    if(night){
      var st=[[30,30],[78,62],[120,22],[170,48],[232,26],[262,70],[300,40],[60,100],[200,90],[385,95]];
      sky += st.map(function(p,i){ var r=i%3?1.6:2.4; return '<circle class="star twinkle" cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'"/>'; }).join('');
      sky += '<path class="moon" d="M352 28a26 26 0 1 0 22 42a21 21 0 1 1 -22 -42z"/>';
    }else{
      sky += '<circle class="sun-glow" cx="342" cy="52" r="32"/><circle class="sun" cx="342" cy="52" r="20"/>'
          +  '<g class="drift"><g class="cloud" transform="translate(0 12)"><ellipse cx="70" cy="44" rx="30" ry="12"/><ellipse cx="92" cy="36" rx="20" ry="13"/><ellipse cx="52" cy="38" rx="15" ry="10"/></g>'
          +  '<g class="cloud" opacity=".7" transform="translate(0 16)"><ellipse cx="215" cy="26" rx="22" ry="8"/><ellipse cx="230" cy="20" rx="14" ry="9"/></g></g>';
    }
    sky += '<circle class="dot twinkle" cx="140" cy="120" r="4"/><circle class="dot twinkle" cx="268" cy="104" r="3"/><circle class="dot twinkle" cx="40" cy="132" r="3"/>';
    var mosque = '<g class="near"><rect x="292" y="150" width="66" height="40" rx="2"/>'
      + '<path d="M296 152q0-30 29-38q29 8 29 38z"/><rect x="323.5" y="100" width="3" height="16"/><circle cx="325" cy="98" r="3.2"/>'
      + '<rect x="366" y="112" width="11" height="78"/><rect x="363" y="128" width="17" height="4" rx="1"/><path d="M364 113l7.5-17l7.5 17z"/></g>'
      + '<path class="far" d="M318 190v-18a7 7 0 0 1 14 0v18z"/>';
    var tree = function(x,y,s){ return '<g transform="translate('+x+' '+y+') scale('+s+')"><rect class="trunk" x="-3" y="-4" width="6" height="22" rx="2"/>'
      + '<circle class="leaf2" cx="0" cy="-14" r="15"/><circle class="leaf" cx="-8" cy="-20" r="10"/><circle class="leaf" cx="7" cy="-22" r="9"/></g>'; };
    var palm = function(x,y,s){ return '<g transform="translate('+x+' '+y+') scale('+s+')"><path class="trunk" d="M-2 30q-4-28 2-56l5 1q-5 27 1 55z"/>'
      + '<path class="leaf2" d="M1-26q-22-8-36 6q18-4 36-4zM1-26q22-8 36 6q-18-4-36-4zM1-26q-14-16-30-12q16 2 30 14zM1-26q14-16 30-12q-16 2-30 14z"/></g>'; };
    var land = '';
    if(theme==='sea'){
      land = '<path class="far" d="M0 140q60-26 120-6t110 2v20H0z"/>'
        + '<path class="sea1" d="M0 150q25-8 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0V200H0z"/>'
        + '<path class="sea2" d="M0 172q25-8 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0V200H0z"/>'
        + '<g class="drift"><path class="foam" d="M30 162q12-6 24 0M150 166q12-6 24 0M290 160q12-6 24 0"/></g>';
    }else if(theme==='desert'){
      land = '<path class="far" d="M0 150l40-30l30 20l45-40l55 50z"/>'
        + '<path class="sand1" d="M0 158q90-34 190-6t210-8V200H0z"/>'
        + '<path class="sand2" d="M0 182q110-28 230-2t170-6V200H0z"/>'
        + palm(48,150,1) + palm(372,160,.75);
    }else if(theme==='garden'){
      land = '<path class="far" d="M0 150q70-40 150-12t130-8t120 6V200H0z"/>'
        + '<path class="leaf" d="M0 170q100-26 200-4t200-6V200H0z"/>'
        + tree(40,160,1) + tree(80,170,.7) + tree(360,166,.9)
        + '<g class="bloom"><circle cx="130" cy="186" r="4"/><circle cx="250" cy="182" r="4"/><circle cx="300" cy="190" r="3.5"/><circle cx="175" cy="192" r="3"/></g>';
    }else if(theme==='mosque' || night){
      land = '<path class="far" d="M0 156q80-34 170-10t140-6t90 4V200H0z"/>' + mosque
        + '<path class="mid" d="M0 178q100-18 200-2t200-4V200H0z"/>'
        + (night ? '' : tree(46,172,.8));
    }else{
      land = '<path class="far" d="M0 150q70-40 150-12t130-8t120 6V200H0z"/>'
        + '<path class="mid" d="M0 172q100-26 200-4t200-6V200H0z"/>'
        + tree(50,166,.85) + tree(355,172,.7);
    }
    var body = sky + land;
    if(flip) body = '<g transform="translate(400 0) scale(-1 1)">'+body+'</g>';
    return '<svg class="scene" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">'+body+'</svg>';
  }
  function setScene(emoji, theme, flip){
    var pic = $('#rdPic'), old = pic.querySelector('.scene');
    theme = theme || themeFor(emoji);
    if(old) old.remove();
    pic.insertAdjacentHTML('afterbegin', sceneSVG(theme, !!flip));
    pic.classList.toggle('night', theme==='night');
    pic.classList.remove('has-img'); pic.classList.remove('has-pic'); pic.classList.remove('no-emo');
    var ph=$('#rdPh'); ph.textContent = emoji;
    ph.style.animation='none'; void ph.offsetWidth; ph.style.animation='';
  }

  function getLessons(){ return EX.lessons || [cur.moral]; }
  function getApply(){ return EX.apply || ['أقولُ دائماً: '+cur.dua]; }

  function renderPage(){
    stopSpeak();
    var dots='';
    for(var i=0;i<seq.length;i++){ dots+='<i class="'+(i===page?'on':'')+'"></i>'; }
    $('#rdDots').innerHTML = dots;
    var img=$('#rdImg'), ph=$('#rdPh');
    var step = seq[page];
    $('#rdNext').disabled=false;
    $('#rdPrev').disabled = page===0;
    $('#rdPic').style.display='';
    $('#btnPrompt').style.display='none';
    img.onload=img.onerror=null; img.removeAttribute('src');
    img.style.display='none'; ph.style.display='';
    if(step.t==='intro'){
      setScene(cur.icon, null, false);
      $('#rdText').innerHTML = '<span>كان يا ما كان، في قديمِ الزمان... 🌙<br>هذه حكايةُ «'+cur.title+'» — '+cur.tag+'.<br>هيا بنا نبدأ!</span>';
      $('#rdNext').textContent = 'ابدأِ الحكاية ←';
    }else if(step.t==='page'){
      var p = step.p;
      setScene(p.emoji, null, step.i%2===1);
      (function(story, pg, pp, n){
        if(!window.MKStoryPic) return;
        MKStoryPic.get({ id:'mj-'+src+'-'+jid+'-'+story.id+'-'+n, title:story.title, text:pp.text, emoji:pp.emoji, color:story.color }, function(svg){
          var pic=$('#rdPic'); if(!svg || cur!==story || page!==pg || pic.classList.contains('has-img')) return;
          var old=pic.querySelector('.scene'); if(old) old.remove();
          pic.insertAdjacentHTML('afterbegin', svg);
          var g=pic.querySelector('svg'); if(!g) return;
          g.setAttribute('class','scene'); g.setAttribute('preserveAspectRatio','xMidYMid slice'); g.removeAttribute('width'); g.removeAttribute('height'); g.setAttribute('aria-hidden','true');
          pic.classList.remove('night'); pic.classList.add('has-pic');
          /* in stories of the prophets, the Seerah and the companions a person/face emoji is not kept on the picture */
          var person = /[\u{1F466}-\u{1F478}\u{1F47C}\u{1F481}-\u{1F487}\u{1F574}\u{1F575}\u{1F57A}\u{1F600}-\u{1F64F}\u{1F926}\u{1F930}-\u{1F939}\u{1F9D1}-\u{1F9DF}\u{1F9B8}\u{1F9B9}]/u.test(pp.emoji) && !/[\u{1F64C}\u{1F64F}]/u.test(pp.emoji);
          pic.classList.toggle('no-emo', person && /^(prophets|seerah|companions)$/.test(src));
        });
      })(cur, page, p, step.i);
      img.onload=function(){ img.style.display='block'; ph.style.display='none'; $('#rdPic').classList.add('has-img'); };
      img.onerror=function(){ img.style.display='none'; ph.style.display=''; $('#rdPic').classList.remove('has-img'); };
      img.src = imgPath(step.i);
      $('#rdText').innerHTML = '<span>'+p.text+'</span>';
      $('#btnPrompt').style.display = p.prompt ? '' : 'none';
      $('#rdNext').textContent = step.i===cur.pages.length-1 ? 'انتهتِ الحكاية 🌟' : 'التالي ←';
    }else if(step.t==='lessons'){
      setScene('🌙', 'night', false);
      $('#rdText').innerHTML = '<div style="width:100%"><div class="rd-act-q">🌙 ماذا نتعلّمُ من القصة؟</div><div class="rd-lessons">'
        + getLessons().map(function(l){ return '<div class="rd-lesson">🌟 '+l+'</div>'; }).join('')
        + '</div></div>';
      $('#rdNext').textContent = 'كيف نطبّقُها؟ 💪';
    }else if(step.t==='apply'){
      setScene('💪', 'garden', true);
      $('#rdText').innerHTML = '<div style="width:100%"><div class="rd-act-q">💪 كيف نطبّقُ ما تعلّمنا؟</div><div class="rd-lessons">'
        + getApply().map(function(l){ return '<div class="rd-lesson apply">✅ '+l+'</div>'; }).join('')
        + '</div><div class="rd-dua">🤲 '+cur.dua+'</div></div>';
      $('#rdNext').textContent = cur.act ? 'هيا نلعب! 🎮' : (cur.game ? 'لعبة! 🧩' : 'أنهيتُ الحكاية ✓');
      if(!cur.act && !cur.game && !done[cur.id]) confetti();
    }else if(step.t==='act'){
      setScene('🎮', 'sky', false);
      renderActivity();
    }else{
      $('#rdPic').style.display='none';
      renderGame();
    }
  }
  function renderGame(){
    gameWon=false;
    $('#rdText').innerHTML='';
    var box=document.createElement('div'); box.style.width='100%';
    $('#rdText').appendChild(box);
    $('#rdPrev').disabled=false;
    $('#rdNext').textContent='🔒 أكملِ اللعبةَ أولاً';
    $('#rdNext').disabled=true;
    MiniGames.render(box, cur.game, function(){
      gameWon=true;
      $('#rdNext').textContent='أنهيتُ الحكاية ✓';
      $('#rdNext').disabled=false;
      if(!done[cur.id]) confetti();
    });
  }
  function renderActivity(){
    actSolved=false;
    var a=cur.act;
    $('#rdText').innerHTML = '<div style="width:100%"><div class="rd-act-q">'+a.q+'</div><div class="rd-opts">'
      + a.opts.map(function(o,i){ return '<button class="rd-opt" data-i="'+i+'"><span class="oe">'+o.e+'</span><span>'+o.t+'</span></button>'; }).join('')
      + '</div><div class="rd-yay" id="rdYay" style="display:none"></div></div>';
    $('#rdPrev').disabled=false;
    $('#rdNext').textContent = cur.game ? 'لعبة! 🧩' : 'أنهيتُ الحكاية ✓';
    $('#rdNext').disabled=false;
    Array.prototype.forEach.call(document.querySelectorAll('#rdText .rd-opt'),function(b){
      b.addEventListener('click',function(){
        if(actSolved) return;
        var o=cur.act.opts[+b.getAttribute('data-i')];
        if(o.ok){
          actSolved=true;
          b.classList.add('ok');
          Array.prototype.forEach.call(document.querySelectorAll('#rdText .rd-opt'),function(x){ x.disabled=true; });
          var y=document.getElementById('rdYay');
          y.style.display=''; y.textContent='🎉 '+(cur.act.yay||'أحسنت! إجابةٌ صحيحة');
          $('#rdNext').textContent = cur.game ? 'لعبةٌ أخيرة! 🧩' : 'أنهيتُ الحكاية ✓';
          $('#rdNext').disabled=false;
          if(!done[cur.id]) confetti();
        }else{
          b.classList.add('no');
          setTimeout(function(){ b.classList.remove('no'); },500);
        }
      });
    });
  }
  function next(){
    var step = seq[page];
    if(step.t==='game' && !gameWon) return;
    if(page<seq.length-1){ page++; renderPage(); }
    else{
      done[cur.id]=1; localStorage.setItem(KEY,JSON.stringify(done)); closeReader(); renderBooks(); renderProgress();
    }
  }
  function prev(){ if(page>0){ page--; renderPage(); } }

  /* ── read aloud (best available Arabic voice) ── */
  var speaking=false;
  function pickVoice(){
    var vs = speechSynthesis.getVoices().filter(function(v){ return /^ar/i.test(v.lang); });
    if(!vs.length) return null;
    var score = function(v){
      var s=0, n=v.name.toLowerCase();
      if(/natural|neural|online/.test(n)) s+=4;
      if(/google/.test(n)) s+=3;
      if(/majed|laila|hoda|salma|hamed/.test(n)) s+=2;
      if(v.localService===false) s+=1;
      return s;
    };
    return (window.MKVoice&&MKVoice.bestVoice("ar",MKVoice.guessGender(txt)))||vs.sort(function(a,b){ return score(b)-score(a); })[0];
  }
  function speakText(){
    if(speaking){ stopSpeak(); return; }
    var step = seq[page];
    var txt = step.t==='intro' ? ('كان يا ما كان، في قديمِ الزمان. هذه حكايةُ '+cur.title+'. هيا بنا نبدأ')
      : step.t==='page' ? step.p.text
      : step.t==='lessons' ? ('ماذا نتعلمُ من القصة؟ '+getLessons().join('. '))
      : step.t==='apply' ? ('كيف نطبقُ ما تعلمنا؟ '+getApply().join('. ')+'. '+cur.dua)
      : step.t==='act' ? cur.act.q
      : (cur.game ? cur.game.title : '');
    txt = txt.replace(/<[^>]+>/g,'').replace(/[🌱-🿿📄-📿☀-⛿✀-➿🀀-🯿]/gu,'');
    var u = new SpeechSynthesisUtterance(window.MKVoice?MKVoice.fixText(txt):txt);
    var v = pickVoice(); if(v) u.voice=v;
    u.lang='ar-SA'; u.rate=0.92; u.pitch=1.05; if(window.MKVoice&&u.voice){ var __g=MKVoice.guessGender(txt); if(MKVoice.genderOf(u.voice)!==__g) u.pitch=(__g==='male'?0.72:1.22); }
    if(step.t==='page') u.mkEl=$('#rdText');   /* read-along: each word lights up as it is read (mk-tts-cloud.js) */
    u.onend=u.onerror=function(){ speaking=false; $('#btnSpeak').classList.remove('speaking'); $('#btnSpeak').textContent='🔊 اقرئي لي'; };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    speaking=true; $('#btnSpeak').classList.add('speaking'); $('#btnSpeak').textContent='⏸ توقّفي';
  }
  function stopSpeak(){ if(window.speechSynthesis){ speechSynthesis.cancel(); } speaking=false;
    var b=$('#btnSpeak'); b.classList.remove('speaking'); b.textContent='🔊 اقرئي لي'; }
  if(window.speechSynthesis){ speechSynthesis.onvoiceschanged=function(){}; }

  /* ── copy image prompt ── */
  function copyPrompt(){
    var step = seq[page];
    if(!step || step.t!=='page' || !step.p.prompt) return;
    var p = step.p;
    var fname = jid+'-'+cur.id+'-'+(step.i+1)+'.png';
    var full = STYLE + p.prompt + '.';
    (navigator.clipboard ? navigator.clipboard.writeText(full) : Promise.reject()).then(function(){
      toast('✓ نُسخَ الوصف! ولِّدِ الصورةَ ثم احفظْها باسم <b>'+fname+'</b> داخل مجلد minaret-art');
    }).catch(function(){
      toast('لم يُسمَح بالنسخ — الوصف: '+full);
    });
  }
  var toastTimer=null;
  function toast(html){
    var t=$('#toast'); t.innerHTML=html; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },5000);
  }

  function confetti(){
    var em=['🌟','✨','🎈','⭐','🎉'];
    for(var i=0;i<16;i++){
      var c=document.createElement('span'); c.className='confetti'; c.textContent=em[i%em.length];
      c.style.left=(Math.random()*100)+'vw';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      c.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(c);
      setTimeout(function(el){ return function(){ el.remove(); }; }(c),5000);
    }
  }

  $('#rdNext').addEventListener('click',next);
  $('#rdPrev').addEventListener('click',prev);
  $('#rdClose').addEventListener('click',closeReader);
  $('#btnSpeak').addEventListener('click',speakText);
  $('#btnPrompt').addEventListener('click',copyPrompt);
  $('#reader').addEventListener('click',function(e){ if(e.target===this) closeReader(); });
  document.addEventListener('keydown',function(e){
    if(!cur) return;
    if(e.key==='Escape') closeReader();
    if(e.key==='ArrowLeft') next();
    if(e.key==='ArrowRight') prev();
  });
})();
</script>
<script defer src="../shared/mk-a11y.js"></script>
<script src="../shared/mk-topbar.js"></script>
</body>
