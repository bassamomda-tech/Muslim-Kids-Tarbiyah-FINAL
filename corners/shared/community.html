<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="color-scheme" content="dark">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجتمع العائلات | Family Community</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{ --bg1:#081E36; --bg2:#0E2E4E; --gold:#E8B530; --gold-lt:#F5CC5A; --ink:#FEF5DC; --muted:rgba(254,245,220,.66); --card:rgba(255,255,255,.06); --line:rgba(232,181,48,.28); --green:#1F8A5B; --c:#2980B9; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal','Nunito',sans-serif;color:var(--ink);direction:rtl;min-height:100vh;background:
    radial-gradient(1100px 640px at 82% -8%,rgba(41,128,185,.18),transparent 60%),radial-gradient(800px 520px at 0% 108%,rgba(31,138,91,.13),transparent 55%),linear-gradient(165deg,var(--bg1),var(--bg2))}
  html[dir="ltr"] body{direction:ltr;font-family:'Nunito','Tajawal',sans-serif}
  .header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.3rem;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:rgba(8,24,42,.74);backdrop-filter:blur(8px)}
  .back-btn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:2rem;padding:.45rem 1rem;text-decoration:none;font-weight:800;font-size:.82rem}
  .who{display:flex;align-items:center;gap:.4rem;font-weight:800;font-size:.85rem}
  .who .av{width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:1rem}
  .lang{display:flex;border:1.5px solid var(--line);border-radius:2rem;overflow:hidden}
  .lang button{background:transparent;border:none;color:var(--ink);font-weight:800;padding:.3rem .8rem;font-size:.78rem;cursor:pointer;font-family:inherit}
  .lang button.active{background:var(--gold);color:#10243d}
  .wrap{max-width:920px;margin:0 auto;padding:1.6rem 1rem 4rem}

  .tabs{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:1.1rem;padding:.3rem;margin-bottom:1.4rem;max-width:420px}
  .tabs button{flex:1;background:transparent;border:none;color:var(--muted);font-weight:800;padding:.6rem;border-radius:.8rem;cursor:pointer;font-family:inherit;font-size:.92rem}
  .tabs button.active{background:var(--c);color:#fff}

  .gate{text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:1.4rem;padding:2rem 1.4rem;max-width:460px;margin:1rem auto}
  .gate .ic{font-size:2.6rem}
  .gate h2{font-size:1.3rem;font-weight:900;margin:.3rem 0}
  .gate p{color:var(--muted);line-height:1.7;margin-bottom:1rem}
  .gate a{display:inline-block;background:var(--gold);color:#10243d;border-radius:2rem;padding:.6rem 1.4rem;font-weight:800;text-decoration:none}

  .panel{display:none}.panel.active{display:block}
  .add{display:flex;gap:.6rem;margin-bottom:1.2rem}
  .add input,.add textarea{flex:1;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);border-radius:1rem;padding:.7rem .9rem;font-family:inherit;font-size:.95rem;resize:vertical}
  .add button{background:var(--c);color:#fff;border:none;border-radius:1rem;padding:0 1.2rem;font-weight:800;font-family:inherit;cursor:pointer}

  .ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
  .ch-card{background:var(--card);border:1.5px solid var(--line);border-radius:1.3rem;padding:1.1rem;display:flex;flex-direction:column;gap:.5rem}
  .ch-top{display:flex;align-items:center;gap:.6rem}
  .ch-ic{font-size:1.8rem}
  .ch-t{font-weight:900;font-size:1.05rem;line-height:1.35}
  .ch-d{color:var(--muted);font-size:.84rem;line-height:1.6;flex:1}
  .ch-meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-weight:700}
  .ch-bar{height:8px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
  .ch-bar i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .4s}
  .ch-acts{display:flex;gap:.5rem;align-items:center}
  .ch-join{flex:1;background:var(--c);color:#fff;border:none;border-radius:.9rem;padding:.55rem;font-weight:800;font-family:inherit;cursor:pointer;font-size:.88rem}
  .ch-join.joined{background:rgba(31,138,91,.2);color:#a8f0c4;border:1px solid rgba(31,138,91,.5)}
  .ch-step{width:38px;height:38px;border-radius:.8rem;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-weight:900;font-size:1.1rem;cursor:pointer}
  .new-ch{background:rgba(41,128,185,.1);border:1.5px dashed var(--c);border-radius:1.3rem;padding:1.1rem;display:flex;flex-direction:column;gap:.6rem}
  .new-ch input{border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);border-radius:.8rem;padding:.6rem .8rem;font-family:inherit}
  .new-ch button{background:var(--c);color:#fff;border:none;border-radius:.8rem;padding:.6rem;font-weight:800;font-family:inherit;cursor:pointer}

  .post{background:var(--card);border:1.5px solid var(--line);border-radius:1.2rem;padding:1rem 1.1rem;margin-bottom:.8rem}
  .post-h{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
  .post-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.1rem}
  .post-who{font-weight:800}.post-time{color:var(--muted);font-size:.74rem;margin-inline-start:auto}
  .post-text{line-height:1.75;font-size:.95rem}
  .post-like{margin-top:.5rem;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:2rem;padding:.25rem .8rem;font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit}
  .live-note{font-family:ui-monospace,monospace;font-size:.72rem;color:#90A4AE;background:rgba(0,0,0,.22);border-radius:.6rem;padding:.5rem .8rem;margin-bottom:1.2rem;text-align:center}
  .en-only{display:none}
  html[dir="ltr"] .ar-only{display:none}
  html[dir="ltr"] .en-only{display:inline}
</style>
<style id="__antiflash">html{background:#081E36;color-scheme:dark}</style>
</head>
<body>
  <div class="header">
    <a class="back-btn" href="../../index.html"><span class="ar-only">↩️ المدينة</span><span class="en-only">↩️ City</span></a>
    <div class="who" id="who"></div>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="ar" class="active">عربي</button></div>
  </div>

  <div class="wrap">
    <div id="gate"></div>
    <div id="main" style="display:none">
      <div class="live-note" id="liveNote"></div>
      <div class="tabs">
        <button id="tabCh" class="active" onclick="showTab('ch')">🎯 <span class="ar-only">التحدّيات</span><span class="en-only">Challenges</span></button>
        <button id="tabDisc" onclick="showTab('disc')">💬 <span class="ar-only">نقاش الأهل</span><span class="en-only">Parents' Talk</span></button>
      </div>

      <section class="panel active" id="panel-ch">
        <div class="new-ch">
          <b>➕ <span class="ar-only">أنشئ تحدّياً جديداً</span><span class="en-only">Create a new challenge</span></b>
          <input id="ncTitle" placeholder="">
          <input id="ncDesc" placeholder="">
          <button onclick="createChallenge()"><span class="ar-only">أنشئ التحدّي</span><span class="en-only">Create challenge</span></button>
        </div>
        <div class="ch" id="chGrid" style="margin-top:1.2rem"></div>
      </section>

      <section class="panel" id="panel-disc">
        <div class="add">
          <textarea id="postInput" rows="2" placeholder=""></textarea>
          <button onclick="addPost()"><span class="ar-only">انشُر</span><span class="en-only">Post</span></button>
        </div>
        <div id="postList"></div>
      </section>
    </div>
  </div>

<script defer src="mk-system.js"></script>
<script src="mk-auth.js"></script>
<script>
  var lang=(window.MK&&MK.lang&&MK.lang())||localStorage.getItem('bunyanLang')||'ar';
  function t(a,e){ return lang==='ar'?a:e; }
  function txo(o){ return o?(lang==='ar'?(o.ar||o):(o.en||o.ar||o)):''; }
  function ago(ts){ var s=Math.floor((Date.now()-ts)/1000); if(s<60)return t('الآن','now'); var m=Math.floor(s/60); if(m<60)return m+t(' د',' m'); var h=Math.floor(m/60); if(h<24)return h+t(' س',' h'); return Math.floor(h/24)+t(' ي',' d'); }

  function applyLang(){
    document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
    document.querySelectorAll('.ar-only').forEach(function(e){e.style.display=lang==='ar'?'':'none';});
    document.querySelectorAll('.en-only').forEach(function(e){e.style.display=lang==='en'?'':'none';});
    document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang);});
    document.getElementById('ncTitle').placeholder=t('عنوان التحدّي (مثال: حفظ جزء عمّ)','Challenge title');
    document.getElementById('ncDesc').placeholder=t('وصفٌ قصير','Short description');
    document.getElementById('postInput').placeholder=t('شارِك تجربتك أو سؤالك مع الأهل…','Share your experience or question…');
    document.getElementById('liveNote').textContent=t('🔒 يعمل محليّاً الآن · جاهزٌ للربط بحسابٍ سحابيٍّ ليتشارك الجميع','🔒 Runs locally now · ready to connect to a cloud account so everyone shares');
    boot();
  }
  document.querySelectorAll('.lang button').forEach(function(b){ b.onclick=function(){ lang=b.dataset.lang; try{localStorage.setItem('bunyanLang',lang);}catch(e){} applyLang(); }; });

  function boot(){
    MKAuth.refresh().then(function(u){
      var gate=document.getElementById('gate'), main=document.getElementById('main'), who=document.getElementById('who');
      if(!u){
        main.style.display='none'; who.innerHTML='';
        gate.style.display='block';
        gate.innerHTML='<div class="gate"><div class="ic">👥</div><h2>'+t('مجتمعُ العائلات','Family Community')+'</h2>'
          +'<p>'+t('سجِّل دخولَك لِتشارِكَ في التحدّياتِ وتتفاعَلَ مع عائلاتٍ أخرى.','Log in to join challenges and connect with other families.')+'</p>'
          +'<a href="account.html?lang='+lang+'">'+t('تسجيل الدخول / حساب جديد ←','Log in / Sign up →')+'</a></div>';
        return;
      }
      gate.style.display='none'; main.style.display='block';
      who.innerHTML='<span class="av">'+(u.avatar||'🧑')+'</span><span>'+escapeHtml(u.name)+'</span>';
      renderChallenges(); renderPosts();
    });
  }

  function showTab(id){
    document.getElementById('tabCh').classList.toggle('active',id==='ch');
    document.getElementById('tabDisc').classList.toggle('active',id==='disc');
    document.getElementById('panel-ch').classList.toggle('active',id==='ch');
    document.getElementById('panel-disc').classList.toggle('active',id==='disc');
  }

  function renderChallenges(){
    MKAuth.listChallenges().then(function(list){
      document.getElementById('chGrid').innerHTML=list.map(function(c){
        var pct=c.days?Math.round((c.myProgress||0)/c.days*100):0;
        var join=c.joined
          ? '<button class="ch-join joined" disabled>✓ '+t('مشترك','Joined')+'</button><button class="ch-step" onclick="stepChallenge(\''+c.id+'\','+c.days+')">＋</button>'
          : '<button class="ch-join" onclick="joinChallenge(\''+c.id+'\')">'+t('انضمّ','Join')+'</button>';
        return '<div class="ch-card"><div class="ch-top"><span class="ch-ic">'+c.icon+'</span><span class="ch-t">'+txo(c.title)+'</span></div>'
          +'<div class="ch-d">'+txo(c.desc)+'</div>'
          +(c.joined?'<div class="ch-bar"><i style="width:'+pct+'%"></i></div><div class="ch-meta"><span>'+(c.myProgress||0)+'/'+c.days+' '+t('يوم','days')+'</span><span>'+pct+'%</span></div>':'')
          +'<div class="ch-meta"><span>👥 '+c.members+' '+t('مشارك','members')+'</span><span>'+(c.days)+' '+t('يوم','days')+'</span></div>'
          +'<div class="ch-acts">'+join+'</div></div>';
      }).join('');
    });
  }
  function joinChallenge(id){ MKAuth.joinChallenge(id).then(renderChallenges); }
  function stepChallenge(id,days){
    MKAuth.listChallenges().then(function(list){
      var c=list.find(function(x){return x.id===id;}); var p=Math.min((c.myProgress||0)+1,days);
      MKAuth.setChallengeProgress(id,p).then(renderChallenges);
    });
  }
  function createChallenge(){
    var title=document.getElementById('ncTitle').value.trim();
    var desc=document.getElementById('ncDesc').value.trim();
    if(!title){ document.getElementById('ncTitle').focus(); return; }
    MKAuth.createChallenge({ title:{ar:title,en:title}, desc:{ar:desc,en:desc}, days:7, icon:'🎯' }).then(function(){
      document.getElementById('ncTitle').value=''; document.getElementById('ncDesc').value=''; renderChallenges();
    });
  }

  function renderPosts(){
    MKAuth.listPosts().then(function(list){
      document.getElementById('postList').innerHTML=list.map(function(p){
        return '<div class="post"><div class="post-h"><span class="post-av">'+(p.avatar||'🧑')+'</span>'
          +'<span class="post-who">'+escapeHtml(p.who)+'</span><span class="post-time">'+ago(p.at)+'</span></div>'
          +'<div class="post-text">'+escapeHtml(p.text)+'</div>'
          +'<button class="post-like" onclick="likePost(\''+p.id+'\')">🤍 '+(p.likes||0)+'</button></div>';
      }).join('');
    });
  }
  function addPost(){
    var inp=document.getElementById('postInput'); var v=inp.value.trim(); if(!v) return;
    MKAuth.addPost(v).then(function(){ inp.value=''; renderPosts(); });
  }
  function likePost(id){ MKAuth.likePost(id).then(renderPosts); }

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  applyLang();
</script>
<script defer src="nav-fix.js"></script>
<script src="mk-citynav.js"></script>
</body>
</html>
