<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>أصوات الصغار | Little Voices</title>
<meta name="description" content="تلاواتٌ وأدعيةٌ بأصوات الأطفال، تُنشَر بموافقة الأهل وبعد مراجعة المشرف. Children's recitations and du'as, published with a parent's consent after the admin's review.">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Amiri:wght@700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#081E36;--bg2:#0E2E4E;--gold:#E8B530;--gold-lt:#F5CC5A;--ink:#FEF5DC;--muted:rgba(254,245,220,.72);--card:rgba(255,255,255,.06);--line:rgba(232,181,48,.28);--ok:#2E9E5B}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal','Nunito',sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(900px 520px at 80% -10%,rgba(232,181,48,.16),transparent 60%),linear-gradient(165deg,var(--bg1),var(--bg2))}
  html[dir="ltr"] body{font-family:'Nunito','Tajawal',sans-serif}
  .header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem}
  .back-btn{background:var(--gold);color:#10243d;border-radius:2rem;padding:.5rem 1.1rem;font-weight:800;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
  .lang{display:flex;border:1.5px solid var(--line);border-radius:2rem;overflow:hidden}
  .lang button{background:transparent;border:none;color:var(--ink);font-weight:800;padding:0 .85rem;min-height:40px;font-size:.85rem;cursor:pointer;font-family:inherit}
  .lang button.active{background:var(--gold);color:#10243d}
  .wrap{max-width:820px;margin:0 auto;padding:.3rem 1rem 4rem}
  h1{margin:.3rem 0;font-size:1.8rem;color:var(--gold-lt);text-align:center}
  .lead{margin:0 auto 1rem;max-width:600px;text-align:center;color:var(--muted);font-weight:700;line-height:1.7}
  .tabs{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.8rem 0 1rem}
  .tabs button{min-height:50px;padding:0 1.1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:900 1rem inherit;font-family:inherit;cursor:pointer}
  .tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--gold-lt),#D4A017);color:#1A1205;border-color:transparent}
  .tabs .n{display:inline-block;min-width:1.5em;margin-inline-start:.3rem;padding:0 .35em;border-radius:999px;background:#C0392B;color:#fff;font-size:.82rem}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem}
  .v{background:var(--card);border:1.5px solid var(--line);border-radius:1.2rem;padding:.9rem}
  .v.pending{border-style:dashed}
  .v-hd{display:flex;align-items:center;gap:.6rem}
  .v-hd .av{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:rgba(255,255,255,.1)}
  .v-hd b{display:block;font-size:1.05rem}
  .v-hd small{color:var(--muted);font-weight:700}
  .v .tx{font-family:'Amiri',serif;font-size:1.15rem;line-height:1.9;margin:.5rem 0;color:#fff;max-height:5.8em;overflow:hidden}
  .v .ref{display:block;color:var(--gold-lt);font-weight:800;font-size:.88rem}
  .v audio{width:100%;margin-top:.5rem}
  .v .st{display:inline-block;margin-top:.5rem;padding:.2rem .7rem;border-radius:999px;font-size:.82rem;font-weight:900;background:rgba(232,181,48,.2)}
  .v .st.ok{background:rgba(46,158,91,.3)}
  .v .row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
  .btn{min-height:46px;padding:0 1rem;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:900 .92rem inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
  .btn.go{background:linear-gradient(135deg,#3BB36D,#1F7A44);border:none;color:#fff}
  .btn.no{background:#8E2B20;border-color:#8E2B20;color:#fff}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);font-weight:800;padding:2rem 1rem;line-height:1.8}
  .rec{max-width:560px;margin:0 auto 1.2rem;background:var(--card);border:1.5px solid var(--line);border-radius:1.2rem;padding:1rem}
  .rec select{width:100%;min-height:48px;border-radius:.9rem;border:1.5px solid var(--line);background:#0E2E4E;color:var(--ink);font:800 1rem inherit;font-family:inherit;padding:0 .7rem}
  .rec .pv{font-family:'Amiri',serif;font-size:1.3rem;line-height:2;text-align:center;margin:.6rem 0 0;color:#fff}
  .safe{max-width:640px;margin:1.4rem auto 0;color:var(--muted);font-size:.9rem;line-height:1.8;font-weight:600;text-align:center}
</style>
<style id="__antiflash">html{background:#081E36;color-scheme:dark}</style>
</head>
<body>
  <div class="header">
    <a href="../../index.html" class="back-btn">↩️ <span class="lng-ar">المدينة</span><span class="lng-en">City</span></a>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="ar" class="active">عربي</button></div>
  </div>
  <main class="wrap" id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="mk-system.js"></script>
<script src="mk-auth.js"></script>
<script src="mk-firebase.js"></script>
<script src="mk-voice.js"></script>
<script>
(function () {
  var LS = localStorage, lang = 'ar', tab = 'all', items = [], pendingN = 0, loading = true, user = null;
  try { lang = LS.getItem('bunyanLang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  function T(a, e) { return lang === 'en' ? e : a; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(ts) { try { return new Date(ts).toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } }
  function isAdmin() { return !!(window.MKAuth && MKAuth.isAdmin && MKAuth.isAdmin()); }
  /* short pieces a child can record straight from this page */
  var PIECES = [
    { kind: 'ayah', ref: { ar: '[الفاتحة: ٢]', en: '[al-Fatihah 1:2]' }, text: '﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾' },
    { kind: 'ayah', ref: { ar: '[الإخلاص: ١]', en: '[al-Ikhlas 112:1]' }, text: '﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾' },
    { kind: 'dhikr', ref: { ar: 'ذِكر', en: 'Dhikr' }, text: 'سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ' },
    { kind: 'dua', ref: { ar: '[طه: ١١٤]', en: '[Ta-Ha 20:114]' }, text: '﴿رَبِّ زِدْنِي عِلْمًا﴾' },
    { kind: 'dua', ref: { ar: 'دعاء النوم — رواه البخاري', en: 'Before sleep — al-Bukhari' }, text: 'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا' }
  ];
  var piece = 0;

  function card(x, mode) {
    var st = x.status === 'approved';
    return '<article class="v' + (st ? '' : ' pending') + '"><div class="v-hd"><span class="av">' + esc(x.avatar || '🧒') + '</span><div><b>' + esc(x.kid || T('طفلٌ من أسرتنا', 'A child of our family')) + '</b><small>' + esc(when(x.at)) + '</small></div></div>' +
      (x.text ? '<div class="tx">' + esc(x.text) + '</div>' : '') + (x.ref ? '<span class="ref">' + esc(x.ref) + '</span>' : '') +
      '<audio controls preload="none" src="' + esc(x.url) + '"></audio>' +
      (mode !== 'all' ? '<span class="st' + (st ? ' ok' : '') + '">' + (st ? T('✅ منشور للجميع', '✅ Published for everyone') : T('⏳ بانتظار مراجعة المشرف', '⏳ Waiting for the admin\'s review')) + '</span>' : '') +
      '<div class="row">' +
      (mode === 'pending' ? '<button class="btn go" data-ok="' + esc(x.id) + '">✅ ' + T('وافِق وانشُر', 'Approve & publish') + '</button><button class="btn no" data-del="' + esc(x.id) + '">🗑️ ' + T('ارفض واحذف', 'Reject & delete') + '</button>' : '') +
      (mode === 'mine' ? '<button class="btn no" data-del="' + esc(x.id) + '">🗑️ ' + T('احذف تسجيلي', 'Delete my recording') + '</button>' : '') +
      (mode === 'all' && isAdmin() ? '<button class="btn" data-unpub="' + esc(x.id) + '">↩️ ' + T('أوقف النشر', 'Unpublish') + '</button><button class="btn no" data-del="' + esc(x.id) + '">🗑️</button>' : '') +
      '</div></article>';
  }
  function render() {
    var h = '<h1>🎧 ' + T('أصواتُ الصغار', 'Little Voices') + '</h1><p class="lead">' + T('تلاواتٌ وأذكارٌ وأدعيةٌ بأصوات أطفالنا. استمع، وقل: ما شاء الله، بارك الله فيهم 💚', 'Recitations, dhikr and du\'as in our children\'s voices. Listen, and say: MashaAllah, may Allah bless them 💚') + '</p>' +
      '<div class="tabs" role="tablist"><button role="tab" data-tab="all" aria-selected="' + (tab === 'all') + '">🎧 ' + T('استمع', 'Listen') + '</button>' +
      '<button role="tab" data-tab="rec" aria-selected="' + (tab === 'rec') + '">🎙️ ' + T('سجّل صوتي', 'Record mine') + '</button>' +
      (user ? '<button role="tab" data-tab="mine" aria-selected="' + (tab === 'mine') + '">📁 ' + T('تسجيلاتي', 'My recordings') + '</button>' : '') +
      (isAdmin() ? '<button role="tab" data-tab="pending" aria-selected="' + (tab === 'pending') + '">🛡️ ' + T('بانتظار المراجعة', 'To review') + (pendingN ? '<span class="n">' + pendingN + '</span>' : '') + '</button>' : '') + '</div>';
    if (tab === 'rec') {
      var p = PIECES[piece];
      h += '<section class="rec"><select id="pieceSel" aria-label="' + T('ماذا تقرأ؟', 'What will you read?') + '">' + PIECES.map(function (q, i) { return '<option value="' + i + '"' + (i === piece ? ' selected' : '') + '>' + esc(q.text.replace(/[﴿﴾]/g, '')) + '</option>'; }).join('') + '</select>' +
        '<div class="pv">' + esc(p.text) + '</div><span class="ref" style="display:block;text-align:center;color:var(--gold-lt);font-weight:800">' + esc(p.ref[lang]) + '</span><div id="recBox"></div></section>';
    } else {
      h += '<div class="list">' + (loading ? '<div class="empty">⏳ ' + T('جارٍ التحميل…', 'Loading…') + '</div>' :
        items.length ? items.map(function (x) { return card(x, tab); }).join('') :
        '<div class="empty">' + (tab === 'all' ? T('لا توجد تسجيلاتٌ منشورة بعد. كن أوّل من يشارك! 🎙️', 'No published recordings yet. Be the first to share! 🎙️') : tab === 'mine' ? T('لم تُرسِل تسجيلًا بعد.', 'You have not sent a recording yet.') : T('لا شيء بانتظار المراجعة. 🌿', 'Nothing is waiting for review. 🌿')) + '</div>') + '</div>';
    }
    h += '<p class="safe">🔒 ' + T('لا يُنشَر أيُّ تسجيلٍ إلا بموافقة أحد الوالدين ثم مراجعة المشرف. يظهر الاسمُ الأوّل للطفل فقط، ولا توجد تعليقاتٌ ولا إعجابات. يستطيع وليُّ الأمر حذف التسجيل في أيّ وقت.', 'No recording is published without a parent\'s consent and then the admin\'s review. Only the child\'s first name is shown, and there are no comments or likes. A parent can delete the recording at any time.') + '</p>';
    var app = document.getElementById('app'); app.innerHTML = h;
    app.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-tab'); if (tab === 'rec') render(); else load(); }; });
    if (tab === 'rec') {
      var pz = PIECES[piece]; MKVoiceRec.mount(document.getElementById('recBox'), { kind: pz.kind, ref: pz.ref[lang], text: pz.text });
      document.getElementById('pieceSel').onchange = function () { piece = +this.value; render(); };
    }
    app.querySelectorAll('[data-ok]').forEach(function (b) { b.onclick = function () { b.disabled = true; MKAuth.voiceSetStatus(b.getAttribute('data-ok'), 'approved').then(load).catch(function () { alert(T('تعذّر الحفظ.', 'Could not save.')); load(); }); }; });
    app.querySelectorAll('[data-unpub]').forEach(function (b) { b.onclick = function () { b.disabled = true; MKAuth.voiceSetStatus(b.getAttribute('data-unpub'), 'pending').then(load).catch(load); }; });
    app.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () {
      if (!confirm(T('حذف هذا التسجيل نهائيًّا؟', 'Delete this recording for good?'))) return;
      var id = b.getAttribute('data-del'), x = items.filter(function (i) { return i.id === id; })[0]; b.disabled = true;
      MKAuth.voiceDelete(id, x && x.path).then(load).catch(function () { alert(T('تعذّر الحذف.', 'Could not delete.')); load(); }); }; });
    /* only one recording plays at a time */
    app.querySelectorAll('audio').forEach(function (a) { a.addEventListener('play', function () { app.querySelectorAll('audio').forEach(function (o) { if (o !== a) o.pause(); }); }); });
  }
  function load() {
    loading = true; render();
    var which = tab === 'mine' ? 'mine' : tab === 'pending' ? 'pending' : 'approved';
    MKAuth.voiceList(which).then(function (l) { items = l || []; loading = false; if (tab === 'pending') pendingN = items.length; render(); });
    if (isAdmin() && tab !== 'pending') MKAuth.voiceList('pending').then(function (l) { pendingN = (l || []).length; if (!loading) render(); });
  }
  function texts() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lng-ar').forEach(function (e) { e.style.display = lang === 'ar' ? '' : 'none'; });
    document.querySelectorAll('.lng-en').forEach(function (e) { e.style.display = lang === 'en' ? '' : 'none'; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    document.title = T('أصوات الصغار', 'Little Voices'); render();
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.dataset.lang; try { LS.setItem('bunyanLang', lang); } catch (e) {} texts(); }; });
  window.setLang = function (l) { lang = l; try { LS.setItem('bunyanLang', l); } catch (e) {} texts(); };
  try { if (/#rec/.test(location.hash)) tab = 'rec'; } catch (e) {}
  texts();
  (window.MKAuth ? MKAuth.refresh().catch(function () { return null; }) : Promise.resolve(null)).then(function (u) { user = u; if (tab === 'rec') render(); else load(); });
})();
</script>
<script src="mk-citynav.js"></script>
<script src="mk-topbar.js"></script>
</body>
</html>
