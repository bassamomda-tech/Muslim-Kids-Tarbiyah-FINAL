<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ابحث في المدينة | Search the City</title>
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Amiri:wght@700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#081E36;--bg2:#0E2E4E;--gold:#E8B530;--gold-lt:#F5CC5A;--ink:#FEF5DC;--muted:rgba(254,245,220,.7);--line:rgba(232,181,48,.28);--green:#2E9E5B}
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{margin:0;font-family:'Tajawal','Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:radial-gradient(900px 520px at 50% -10%,rgba(232,181,48,.16),transparent 60%),linear-gradient(165deg,var(--bg1),var(--bg2))}
  html[dir="ltr"] body{font-family:'Nunito','Tajawal',sans-serif}
  .header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem}
  .back-btn{background:var(--gold);color:#10243d;border-radius:2rem;padding:.5rem 1.1rem;font-weight:800;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
  .lang{display:flex;border:1.5px solid var(--line);border-radius:2rem;overflow:hidden}
  .lang button{background:transparent;border:none;color:var(--ink);font-weight:800;padding:0 .85rem;min-height:44px;font-size:.85rem;cursor:pointer;font-family:inherit}
  .lang button.active{background:var(--gold);color:#10243d}
  .wrap{max-width:760px;margin:0 auto;padding:.5rem 1rem 5rem}
  h1{margin:.4rem 0 .2rem;font-size:1.9rem;font-weight:900;color:var(--gold-lt);text-align:center}
  .lead{margin:0 auto 1rem;max-width:560px;color:var(--muted);font-weight:700;line-height:1.7;font-size:1.02rem;text-align:center}
  .box{position:relative;margin:0 auto .8rem}
  .box input{display:block;width:100%;min-height:60px;border-radius:1.4rem;border:2px solid var(--gold);background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:1.25rem;line-height:1.4;font-family:inherit;padding:.6rem 3.2rem;outline:none;-webkit-appearance:none;appearance:none}
  .box input::placeholder{color:rgba(254,245,220,.55);font-weight:700}
  .box input:focus{box-shadow:0 0 0 4px rgba(232,181,48,.3);background:rgba(255,255,255,.14)}
  .box input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .box .mag{position:absolute;top:50%;inset-inline-start:1rem;transform:translateY(-50%);font-size:1.4rem;pointer-events:none}
  .box .clr{position:absolute;top:50%;inset-inline-end:.45rem;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:1.15rem;font-weight:900;cursor:pointer;font-family:inherit}
  .box .clr[hidden]{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin:0 0 .8rem}
  .chip{min-height:44px;padding:0 .95rem;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-weight:800;font-size:.95rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#10243d}
  .chip small{font-size:.78rem;opacity:.8;font-weight:800}
  .chip:focus-visible,.card:focus-visible,.clr:focus-visible,.back-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .status{min-height:1.5rem;margin:0 0 .6rem;text-align:center;color:var(--muted);font-weight:800;font-size:.95rem}
  .results{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem;list-style:none;margin:0;padding:0}
  .results li{min-width:0}
  .card{display:flex;align-items:center;gap:.8rem;min-height:76px;padding:.75rem .9rem;border-radius:1.2rem;background:rgba(255,255,255,.07);border:1.5px solid var(--line);color:var(--ink);text-decoration:none;transition:transform .12s,background .15s}
  .card:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  .card .ic{flex:0 0 52px;height:52px;border-radius:1rem;display:grid;place-items:center;font-size:1.7rem;background:rgba(232,181,48,.16)}
  .card .tx{flex:1;min-width:0}
  .card b{display:block;font-size:1.12rem;font-weight:900;line-height:1.5;color:#fff;overflow-wrap:anywhere}
  .card .ds{display:block;color:var(--muted);font-weight:700;font-size:.92rem;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .kd{flex:0 0 auto;font-size:.78rem;font-weight:900;padding:.25rem .6rem;border-radius:999px;background:var(--kc,#2E9E5B);color:#fff;white-space:nowrap}
  .card .go{flex:0 0 auto;color:var(--gold-lt);font-weight:900;font-size:1.2rem}
  .panel{margin:.4rem auto 0;background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:1.3rem;padding:1.1rem 1rem;text-align:center}
  .panel .big{font-size:2.6rem;line-height:1.2}
  .panel h2{margin:.3rem 0 .3rem;font-size:1.2rem;color:var(--gold-lt)}
  .panel p{margin:0 0 .8rem;color:var(--muted);font-weight:700;line-height:1.7}
  .sugg{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
  .sugg .chip{font-size:1.02rem;padding:0 1.1rem;min-height:48px}
  .note{margin:1.1rem auto 0;max-width:560px;color:var(--muted);font-size:.9rem;line-height:1.7;font-weight:600;text-align:center}
  [hidden]{display:none!important}
  @media (max-width:480px){h1{font-size:1.6rem}.card{gap:.6rem;padding:.7rem}.card .ic{flex-basis:46px;height:46px;font-size:1.5rem}.card .go{display:none}.card .kd{font-size:.72rem;padding:.2rem .5rem}}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
  html.calm .card{transition:none}
</style>
<style id="__antiflash">html{background:#081E36;color-scheme:dark}</style>
</head>
<body>
  <div class="header">
    <a href="../../index.html" class="back-btn" id="backBtn">↩️ <span class="lng-ar">المدينة</span><span class="lng-en">City</span></a>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="ar" class="active">عربي</button></div>
  </div>
  <div class="wrap">
    <h1 id="ttl"></h1>
    <p class="lead" id="lead"></p>
    <form class="box" id="form" role="search" action="search.html" method="get">
      <span class="mag" aria-hidden="true">🔎</span>
      <input type="search" id="q" name="q" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="clr" id="clr" hidden>✕</button>
    </form>
    <div class="chips" id="chips" role="group"></div>
    <p class="status" id="status" aria-live="polite"></p>
    <ul class="results" id="results"></ul>
    <section class="panel" id="empty" hidden>
      <div class="big">🧭</div>
      <h2 id="emH"></h2><p id="emP"></p>
      <div class="sugg" id="sugg"></div>
    </section>
    <section class="panel" id="none" hidden>
      <div class="big">🌙</div>
      <h2 id="noH"></h2><p id="noP"></p>
      <div class="sugg" id="sugg2"></div>
    </section>
    <p class="note" id="note"></p>
  </div>

<script src="mk-system.js"></script>
<script src="search-index.js"></script>
<script>
(function () {
  var LS = null, lang = 'ar';
  try { LS = localStorage; lang = LS.getItem('bunyanLang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  function T(a, e) { return lang === 'en' ? e : a; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var MAX = 40, ROOT = '../../';                     // this page lives in corners/shared/

  /* chips → the fine kinds they cover */
  var GROUPS = [
    { id: 'all',      ar: 'الكل',     en: 'All',        kinds: null },
    { id: 'story',    ar: 'قصص',      en: 'Stories',    kinds: ['story'] },
    { id: 'hadith',   ar: 'أحاديث',   en: 'Hadith',     kinds: ['hadith'] },
    { id: 'activity', ar: 'أنشطة',    en: 'Activities', kinds: ['activity'] },
    { id: 'atlas',    ar: 'الأطلس',   en: 'Atlas',      kinds: ['atlas', 'country'] },
    { id: 'journey',  ar: 'رحلات',    en: 'Journeys',   kinds: ['journey', 'house', 'skill'] },
    { id: 'page',     ar: 'صفحات',    en: 'Pages',      kinds: ['page', 'corner', 'card', 'quest'] }
  ];
  var KIND = {
    story: ['قصة', 'Story', '#C1663A'], hadith: ['حديث', 'Hadith', '#6C4BD8'], activity: ['نشاط', 'Activity', '#B8860B'],
    atlas: ['الأطلس', 'Atlas', '#2E6DA4'], country: ['دولة', 'Country', '#2E6DA4'], journey: ['رحلة', 'Journey', '#1A9B7B'],
    house: ['بيت خُلُق', 'Manners house', '#1A9B7B'], skill: ['مهارة', 'Skill', '#7A3FB0'], page: ['صفحة', 'Page', '#4A6FA5'],
    corner: ['ركن', 'Corner', '#C0392B'], card: ['بطاقة', 'Card', '#117A8B'], quest: ['مهمّة الأسبوع', 'Weekly quest', '#2E9E5B']
  };
  var SUGGEST = [
    { ar: 'الصدق', en: 'honesty' }, { ar: 'الوضوء', en: 'wudu' }, { ar: 'الصلاة', en: 'prayer' },
    { ar: 'القدس', en: 'Al-Quds' }, { ar: 'أبو بكر', en: 'Abu Bakr' }, { ar: 'الأندلس', en: 'Andalus' }
  ];

  /* ── normalise: Arabic without tashkeel/tatweel, أإآٱ→ا, ى→ي, ة→ه; English lower-case ── */
  var DIGITS = '٠١٢٣٤٥٦٧٨٩';
  function norm(s) {
    s = String(s == null ? '' : s).toLowerCase();
    try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}   // Córdoba → cordoba
    return s
      .replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ‌-‏]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/[٠-٩]/g, function (d) { return DIGITS.indexOf(d); })
      .replace(/[‘’'`]/g, '')
      .replace(/[^a-z0-9ء-ي]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  var DATA = (window.MK_SEARCH || []).map(function (e, i) {
    var t = e.t || {}, d = e.d || {};
    return { e: e, i: i, t: ' ' + norm((t.ar || '') + ' ' + (t.en || '')) + ' ', d: ' ' + norm((d.ar || '') + ' ' + (d.en || '')) + ' ' };
  });

  /* score one word against one item (0 = no match). Title beats description; word starts beat middles. */
  function wordScore(it, w) {
    var p = it.t.indexOf(w);
    if (p >= 0) return it.t.indexOf(' ' + w + ' ') >= 0 ? 100 : (it.t.indexOf(' ' + w) >= 0 ? 70 : 45);
    if (it.d.indexOf(w) >= 0) return it.d.indexOf(' ' + w) >= 0 ? 14 : 8;
    return 0;
  }
  function score(it, words) {
    var total = 0;
    for (var i = 0; i < words.length; i++) {
      var w = words[i], s = wordScore(it, w);
      if (!s && w.length > 3 && w.indexOf('ال') === 0) s = wordScore(it, w.slice(2)) * 0.8;   // «الصدق» also finds «صدق»
      if (!s) return 0;                                                                        // every word must match
      total += s;
    }
    var k = it.e.k;
    if (k === 'corner') total += 12; else if (k === 'page' || k === 'journey') total += 4;
    return total - Math.min(it.t.length, 60) / 30;                                             // shorter titles first
  }
  function search(q) {
    var words = norm(q).split(' ').filter(Boolean), out = [];
    if (!words.length) return out;
    for (var i = 0; i < DATA.length; i++) { var s = score(DATA[i], words); if (s > 0) out.push({ it: DATA[i], s: s }); }
    out.sort(function (a, b) { return b.s - a.s || a.it.i - b.it.i; });
    return out.map(function (x) { return x.it.e; });
  }

  var group = 'all', lastQ = '', inp = $('q');
  function inGroup(e, g) { return !g.kinds || g.kinds.indexOf(e.k) >= 0; }
  function pick(o) { o = o || {}; return (lang === 'en' ? (o.en || o.ar) : (o.ar || o.en)) || ''; }

  function card(e) {
    var K = KIND[e.k] || KIND.page, ds = pick(e.d), arOnly = lang === 'en' && !(e.t && e.t.en);
    return '<li><a class="card" href="' + esc(ROOT + encodeURI(e.u)) + '">' +
      '<span class="ic" aria-hidden="true">' + esc(e.ic || '⭐') + '</span>' +
      '<span class="tx"><b' + (arOnly ? ' lang="ar" dir="rtl"' : '') + '>' + esc(pick(e.t)) + '</b>' +
      (ds ? '<span class="ds"' + (lang === 'en' && !(e.d && e.d.en) ? ' lang="ar" dir="rtl"' : '') + '>' + esc(ds) + '</span>' : '') + '</span>' +
      '<span class="kd" style="--kc:' + K[2] + '">' + esc(T(K[0], K[1])) + '</span>' +
      '<span class="go" aria-hidden="true">' + T('←', '→') + '</span></a></li>';
  }
  function chips(all, hasQ) {
    $('chips').innerHTML = GROUPS.map(function (g) {
      var n = hasQ ? all.filter(function (e) { return inGroup(e, g); }).length : null;
      return '<button type="button" class="chip' + (g.id === group ? ' on' : '') + '" data-g="' + g.id + '" aria-pressed="' + (g.id === group) + '">' +
        esc(T(g.ar, g.en)) + (n == null ? '' : ' <small>' + n + '</small>') + '</button>';
    }).join('');
  }
  function sugg(el) {
    el.innerHTML = SUGGEST.map(function (s) { var w = T(s.ar, s.en); return '<button type="button" class="chip" data-s="' + esc(w) + '">🔎 ' + esc(w) + '</button>'; }).join('');
  }
  function render() {
    var q = inp.value, hasQ = !!norm(q), all = hasQ ? search(q) : [];
    var g = GROUPS.filter(function (x) { return x.id === group; })[0] || GROUPS[0];
    var list = all.filter(function (e) { return inGroup(e, g); });
    chips(all, hasQ);
    $('clr').hidden = !q;
    $('results').innerHTML = list.slice(0, MAX).map(card).join('');
    $('empty').hidden = hasQ; $('none').hidden = !hasQ || list.length > 0;
    var st = '';
    if (hasQ && list.length) st = list.length > MAX
      ? T('أوّل ' + MAX + ' نتيجة من ' + list.length + ' — اكتب كلمةً أخرى لتقريب البحث', 'Showing the first ' + MAX + ' of ' + list.length + ' — add a word to narrow it down')
      : T(list.length === 1 ? 'نتيجة واحدة' : list.length === 2 ? 'نتيجتان' : list.length + (list.length <= 10 ? ' نتائج' : ' نتيجة'), list.length + (list.length === 1 ? ' result' : ' results'));
    $('status').textContent = st;
    if (hasQ && !list.length) {
      var other = all.length;   // matches exist, but under another chip
      $('noH').textContent = T('لم نجد شيئًا بهذه الكلمة', 'We could not find that');
      $('noP').textContent = other
        ? T('لا نتائج في هذا القسم — اضغط «الكل» لترى ' + other + ' نتيجة في أقسامٍ أخرى.', 'Nothing in this section — tap “All” to see ' + other + ' result' + (other === 1 ? '' : 's') + ' elsewhere.')
        : T('لا بأس! جرّب كلمةً أقصر، أو كلمةً واحدة فقط، أو اختر واحدةً من هذه:', 'No worries! Try a shorter word, or just one word, or pick one of these:');
    }
    if (q !== lastQ) {
      lastQ = q;
      try { history.replaceState(null, '', q ? '?q=' + encodeURIComponent(q) : location.pathname); } catch (e) {}
    }
  }
  function texts() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lng-ar').forEach(function (e) { e.style.display = lang === 'ar' ? '' : 'none'; });
    document.querySelectorAll('.lng-en').forEach(function (e) { e.style.display = lang === 'en' ? '' : 'none'; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    document.title = T('ابحث في المدينة', 'Search the City');
    $('ttl').textContent = T('🔎 ابحث في المدينة', '🔎 Search the City');
    $('lead').textContent = T('اكتب كلمةً — بالعربية أو الإنجليزية — لتجد قصّةً أو حديثًا أو نشاطًا أو رحلةً أو أيّ صفحة.', 'Type a word — in Arabic or English — to find a story, a hadith, an activity, a journey or any page.');
    inp.placeholder = T('عمّ تبحث؟ مثلًا: الصدق', 'What are you looking for? e.g. honesty');
    inp.setAttribute('aria-label', T('ابحث في المدينة', 'Search the city'));
    $('clr').setAttribute('aria-label', T('امسح البحث', 'Clear search'));
    $('chips').setAttribute('aria-label', T('نوع النتائج', 'Result type'));
    $('emH').textContent = T('عمّ تريد أن تبحث اليوم؟', 'What would you like to find today?');
    $('emP').textContent = T('في المدينة ' + DATA.length + ' قصّةً وبطاقةً ونشاطًا ورحلة. جرّب واحدةً من هذه:', 'The city has ' + DATA.length + ' stories, cards, activities and journeys. Try one of these:');
    $('note').textContent = T('لا يهمّ التشكيل ولا الهمزات: «الصدق» و«الصِّدق» سواء. اكتب كلمتين لتقريب البحث.', 'Arabic vowel marks and hamzas don’t matter. Type two words to narrow the search.');
    sugg($('sugg')); sugg($('sugg2'));
    render();
  }

  var timer = null;
  inp.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(render, 120); });
  $('form').addEventListener('submit', function (ev) { ev.preventDefault(); clearTimeout(timer); render(); try { inp.blur(); } catch (e) {} });
  $('clr').onclick = function () { inp.value = ''; render(); inp.focus(); };
  $('chips').addEventListener('click', function (ev) { var b = ev.target.closest('[data-g]'); if (!b) return; group = b.getAttribute('data-g'); render(); });
  function useSugg(ev) { var b = ev.target.closest('[data-s]'); if (!b) return; inp.value = b.getAttribute('data-s'); group = 'all'; render(); window.scrollTo(0, 0); }
  $('sugg').addEventListener('click', useSugg); $('sugg2').addEventListener('click', useSugg);
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.dataset.lang; try { LS.setItem('bunyanLang', lang); } catch (e) {} texts(); }; });
  if (window.setLang === undefined) window.setLang = function (l) { lang = l === 'en' ? 'en' : 'ar'; try { LS.setItem('bunyanLang', lang); } catch (e) {} texts(); };

  try { var q0 = new URLSearchParams(location.search).get('q'); if (q0) { inp.value = q0; lastQ = q0; } } catch (e) {}
  texts();
})();
</script>
<script src="mk-citynav.js"></script>
<script src="mk-topbar.js"></script>
</body>
</html>
