  /* ── 3D islands: each island is a drawn scene (sea ring, cliff, sand, grass, landmark) with a name plate ── */
  body{background:radial-gradient(1200px 700px at 70% 12%,rgba(120,220,235,.28),transparent 60%),linear-gradient(180deg,#073352 0%,#0B5C86 34%,#0E86A8 68%,#14A3B8 100%)}
  .sea{background-image:radial-gradient(60px 10px at 20% 12%,rgba(255,255,255,.14),transparent 70%),radial-gradient(80px 12px at 78% 30%,rgba(255,255,255,.12),transparent 70%),radial-gradient(70px 10px at 30% 55%,rgba(255,255,255,.12),transparent 70%),radial-gradient(90px 12px at 70% 78%,rgba(255,255,255,.12),transparent 70%),radial-gradient(60px 10px at 15% 92%,rgba(255,255,255,.12),transparent 70%)}

<script>
/* «عالم الجزر» — the GAME view of the whole site (the city home page is the PARENT view).
   Every corner is an island on one sea route; an island opens when the child has enough stars, and stars
   come from doing things: the Quran wird, «يومي», finishing games and stations, experiments, brain games,
   dhikr. Nothing is ever lost; a parent can open every island (parent question) or go back to the city.
   Device setting  mk:view = 'game' | 'parent'  decides which one the home page shows first. */
(function () {
  var LS = localStorage, J = MKJourney, lang = 'ar';
  try { lang = LS.getItem('bunyanLang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  try { LS.setItem('mk:view', 'game'); } catch (e) {}
  function T(a, e) { return lang === 'en' ? e : a; }
  function t(o) { return o ? (o[lang] || o.ar || '') : ''; }
  function N(n) { return lang === 'ar' ? J.arNum(n) : String(n); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var R = '../';   // from corners/shared/ to corners/

      (Q ? '<div class="box' + (isLit ? ' lit' : '') + '"><h3>🧭 ' + T('مهمّة الجزيرة', 'Island mission') + '</h3><p>' + esc(isLit ? T('أضأتَ هذه الجزيرة — بارك الله فيك! كلُّ محطّةٍ جديدة تُتمّها تزيدك نجمة.', 'You lit this island — well done! Every new station you finish still earns a star.') : T(Q[0], Q[1])) + '</p><div class="lamps" aria-label="' + pr + '/' + g + '">' + lamps + '</div></div>' : '') +
      (kinds.length > 1 ? '<div class="chips"><button class="chip on" data-f="">' + T('الكلّ', 'All') + '</button>' + kinds.map(function (k) { return '<button class="chip" data-f="' + k + '" style="--k:' + KIND[k][3] + '">' + KIND[k][0] + ' ' + T(KIND[k][1], KIND[k][2]) + '</button>'; }).join('') + '</div>' : '') + '<div class="doors" id="doors">' + doors('') + '</div>' +
      (Q ? '<div class="box deed"><h3>🌍 ' + T('مهمّةٌ في الحياة', 'A real-life mission') + '</h3><p>' + esc(T(Q[2], Q[3])) + '</p>' + (deedDone ? '<p style="color:#1F7A44;font-weight:900;margin-top:.3rem">✅ ' + T('فعلتَها — تقبّل الله منك!', 'Done — may Allah accept it!') + '</p>' : '<button class="btn" id="deedBtn">✔ ' + T('فعلتُها', 'I did it') + ' · +' + N(5) + ' ⭐</button><p style="font-size:.82rem;color:#4a6a55;margin-top:.3rem">' + T('يؤكّدها أحد الوالدين.', 'A parent confirms it.') + '</p>') + '</div>' : '') +
      heroBox(I, isLit) + extras(I, isLit));
    wire();
    var qb = document.getElementById('quizBtn'); if (qb) qb.onclick = function () { quizSheet(I, 0); };
    var te = document.getElementById('teach'); if (te && window.MKVoiceRec) MKVoiceRec.mount(te, { title: T('سجّل شرحك', 'Record your explanation'), hint: T('تكلّم بهدوء كأنّك تشرح لصديقك.', 'Speak calmly, as if explaining to a friend.'), kind: 'teach', isl: I.id, ref: I.n.ar, text: T('أشرح ما تعلّمتُه في ' + I.n.ar, 'I explain what I learned on ' + I.n.en), lang: lang });
    [].forEach.call(document.querySelectorAll('#sheet .chip'), function (c) { c.onclick = function () { [].forEach.call(document.querySelectorAll('#sheet .chip'), function (o) { o.classList.toggle('on', o === c); }); document.getElementById('doors').innerHTML = doors(c.getAttribute('data-f')); wire(); }; });
    var db = document.getElementById('deedBtn'); if (db) db.onclick = function () { var go = function () { J.earn('deed', I.id, 5); openIsland(i, J.totalStars(), all); }; if (window.MKGate && MKGate.ask) MKGate.ask(go, T('هل أتمّ طفلك هذه المهمّة؟', 'Did your child do this mission?')); else go(); };
  }
  function extras(I, isLit) {
    var h = '', W = (X.WHY || {})[I.id], P = (X.PARENT || {})[I.id], w = null;
    if (I.note) h += '<div class="box lit"><p>' + esc(t(I.note)) + '</p></div>';
    if (isLit && (X.QUIZ || {})[I.id]) h += '<div class="box"><h3>🎖️ ' + T('وسام الجزيرة', 'The island badge') + '</h3>' + (J.earned('badge', I.id) ? '<p style="color:#1F7A44;font-weight:900">✅ ' + T('نلتَ وسام هذه الجزيرة.', 'You earned this island\'s badge.') + '</p>' : '<p>' + T('ثلاثةُ أسئلةٍ سريعة عمّا تعلّمتَه هنا.', 'Three quick questions about what you learned here.') + '</p><button class="btn" id="quizBtn" style="margin-top:.5rem">' + T('ابدأ الأسئلة', 'Start the questions') + ' · +' + N(2) + ' ⭐</button>') + '</div>';
    if (isLit) h += '<div class="box"><h3>🎙️ ' + T('علِّم غيرك', 'Teach it back') + (J.earned('teach', I.id) ? ' ✅' : ' · +' + N(2) + ' ⭐') + '</h3><p>' + T('اشرح بصوتك في نصف دقيقة شيئًا واحدًا تعلّمتَه في هذه الجزيرة — من يُعلِّم يتعلّم مرّتين.', 'In half a minute, explain one thing you learned on this island — whoever teaches learns twice.') + '</p><div id="teach" style="margin-top:.5rem"></div></div>';
    if (W) { w = (DAY.hadith || []).concat(DAY.ayat || []).filter(function (o) { return o.id === W; })[0]; }
    if (w) h += '<div class="box why"><h3>💡 ' + T('لماذا نتعلّم هذا؟', 'Why do we learn this?') + '</h3><q>' + esc(w.ar) + '</q>' + (lang === 'en' ? '<p>' + esc(w.en) + '</p>' : '') + '<small>' + esc(t(w.src || w.ref)) + '</small></div>';
    if (P) h += '<details class="box"><summary>🏠 ' + T('للوالدين: سؤالٌ ونشاط', 'For parents: a question and an activity') + '</summary><p>💬 <b>' + T('اسأل طفلك: ', 'Ask your child: ') + '</b>' + esc(T(P[0], P[1])) + '</p><p>🤝 <b>' + T('افعلا معًا: ', 'Do together: ') + '</b>' + esc(T(P[2], P[3])) + '</p></details>';
    return h;
  }
  function celebrate(I) {
    markSeen(I.id);
    show('<div class="sh-hd" style="--c:' + I.c + '"><span class="ic">🎉</span><div><b>' + T('جزيرةٌ جديدة!', 'A new island!') + '</b></div><button class="x" aria-label="' + T('إغلاق', 'Close') + '">✕</button></div>' +
      '<div class="up"><div class="big">' + I.ic + '</div><b>' + T('فتحتَ «' + I.n.ar + '» — بارك الله فيك!', 'You opened "' + I.n.en + '" — may Allah bless you!') + '</b><p style="font-weight:700;line-height:1.8">' + esc(t(I.s)) + '</p><button class="btn" id="goNew">' + T('ادخل الجزيرة', 'Enter the island') + ' ' + (lang === 'ar' ? '←' : '→') + '</button></div>');
    document.getElementById('goNew').onclick = function () { openIsland(ISLANDS.indexOf(I), J.totalStars(), openAll()); };
  }
  function toParent() {
    var go = function () { try { LS.setItem('mk:view', 'parent'); } catch (e) {} location.href = '../../index.html'; };
    if (window.MKGate && MKGate.ask) MKGate.ask(go, T('عرضُ الأهل يفتحه أحد الوالدين', 'The parent view is opened by a parent')); else go();
  }
  document.getElementById('parentBtn').onclick = toParent;
  function texts() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lng-ar').forEach(function (e) { e.style.display = lang === 'ar' ? '' : 'none'; });
    document.querySelectorAll('.lng-en').forEach(function (e) { e.style.display = lang === 'en' ? '' : 'none'; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    document.title = T('عالم الجزر', 'Island World'); render();
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.dataset.lang; try { LS.setItem('bunyanLang', lang); } catch (e) {} texts(); }; });
  window.setLang = function (l) { lang = l; try { LS.setItem('bunyanLang', l); } catch (e) {} texts(); };
  document.getElementById('ov').addEventListener('click', function (e) { if (e.target.id === 'ov' && closable()) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('ov').classList.contains('open') && closable()) close(); });
  window.addEventListener('resize', function () { requestAnimationFrame(route); });
  window.addEventListener('pageshow', function () { render(); });
  texts();
})();
</script>
<script src="mk-citynav.js"></script>
<script src="mk-topbar.js"></script>
</body>
</html>
