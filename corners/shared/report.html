<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>تقرير الأسبوع | Weekly Report</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script>window.MK_NO_GATE = true;   /* a page for parents: outside links open without the parent question */</script>
<style>
  :root{--bg1:#081E36;--bg2:#0E2E4E;--gold:#E8B530;--gold-lt:#F5CC5A;--ink:#FEF5DC;--muted:rgba(254,245,220,.72);--card:rgba(255,255,255,.06);--line:rgba(232,181,48,.28);--ok:#2E9E5B}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal','Nunito',sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(165deg,var(--bg1),var(--bg2))}
  html[dir="ltr"] body{font-family:'Nunito','Tajawal',sans-serif}
  .header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem}
  .back-btn{background:var(--gold);color:#10243d;border-radius:2rem;padding:.5rem 1.1rem;font-weight:800;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
  .lang{display:flex;border:1.5px solid var(--line);border-radius:2rem;overflow:hidden}
  .lang button{background:transparent;border:none;color:var(--ink);font-weight:800;padding:0 .85rem;min-height:40px;font-size:.85rem;cursor:pointer;font-family:inherit}
  .lang button.active{background:var(--gold);color:#10243d}
  .wrap{max-width:820px;margin:0 auto;padding:.3rem 1rem 4rem}
  h1{margin:.2rem 0;font-size:1.7rem;color:var(--gold-lt)}
  .sub{color:var(--muted);font-weight:700;margin:0 0 1rem}
  .kids{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .kids button{min-height:46px;padding:0 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:800 .95rem inherit;font-family:inherit;cursor:pointer}
  .kids button.on{background:var(--gold);color:#10243d;border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
  @media(max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .tile{background:var(--card);border:1.5px solid var(--line);border-radius:1.1rem;padding:.8rem;text-align:center}
  .tile b{display:block;font-size:1.7rem;color:var(--gold-lt)}
  .tile span{font-size:.88rem;font-weight:700;color:var(--muted)}
  .sec{margin-top:1.1rem;background:var(--card);border:1.5px solid var(--line);border-radius:1.2rem;padding:1rem}
  .sec h2{margin:0 0 .6rem;font-size:1.12rem}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.35rem;text-align:center}
  .week div{background:rgba(0,0,0,.18);border-radius:.8rem;padding:.45rem .2rem;font-size:.78rem;font-weight:800}
  .week div i{display:block;font-style:normal;font-size:1.25rem;margin-top:.2rem}
  .week div.full{background:rgba(46,158,91,.35)}
  ul.list{margin:0;padding:0;list-style:none;display:grid;gap:.4rem}
  ul.list li{background:rgba(0,0,0,.16);border-radius:.8rem;padding:.55rem .75rem;line-height:1.6;font-weight:700}
  ul.list li small{color:var(--muted);font-weight:700}
  .empty{color:var(--muted);font-weight:700}
  .talk{background:linear-gradient(135deg,rgba(232,181,48,.2),rgba(46,158,91,.15))}
  .talk q{display:block;quotes:none;font-size:1.2rem;font-weight:900;line-height:1.7;margin:.3rem 0}
  .acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
  .btn{min-height:48px;padding:0 1.1rem;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:900 .98rem inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem}
  .btn.gold{background:linear-gradient(135deg,var(--gold-lt),#D4A017);border:none;color:#1A1205}
  .note{color:var(--muted);font-size:.9rem;line-height:1.7;font-weight:600;margin-top:1rem}
  #offMsg{font-weight:800;margin-top:.5rem;min-height:1.4em}
  @media print{
    body{background:#fff;color:#111}
    .header,.acts,.kids,#mktb,#mkDockBtn,#mkA11yBtn,#mkCityNav,.no-print{display:none!important}
    .tile,.sec{border-color:#ccc;background:#fff}
    .tile b,h1{color:#7A4A12}.tile span,.sub,ul.list li small,.note{color:#555}
    ul.list li,.week div{background:#f4f1ea}
  }
</style>
<style id="__antiflash">html{background:#081E36;color-scheme:dark}</style>
</head>
<body>
  <div class="header">
    <a href="../little-district/pages/parents.html" class="back-btn">↩️ <span class="lng-ar">ركن الأهل</span><span class="lng-en">Parents</span></a>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="ar" class="active">عربي</button></div>
  </div>
  <main class="wrap" id="app"></main>

<script src="mk-system.js"></script>
<script src="mk-bag.js"></script>
<script src="mk-journey.js"></script>
<script src="my-day-data.js"></script>
<script src="week-quests.js"></script>
<script src="journey-story.js"></script>
<script src="../activities/scripts/activities-data.js"></script>
<script>
(function () {
  var LS = localStorage, J = MKJourney, lang = 'ar';
  try { lang = LS.getItem('bunyanLang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  function T(a, e) { return lang === 'en' ? e : a; }
  function t(o) { return o ? (o[lang] || o.ar || '') : ''; }
  function N(n) { return lang === 'ar' ? J.arNum(n) : String(n); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function jget(k, d) { try { var v = JSON.parse(LS.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }

  /* the good deed «يومي» gave on a given day (same rule as my-day.html) */
  function doy(d) { var s = new Date(d.getFullYear(), 0, 0); return Math.floor((d - s) / 864e5) + d.getFullYear() * 7; }
  function deedOn(d) {
    var D = (window.MK_DAY || {}).deeds || []; var L = J.age() === 'young' ? D.filter(function (x) { return x.young; }) : D; if (!L.length) L = D; if (!L.length) return null;
    return L[(doy(d) + 11) % L.length];
  }
  function actName(id) {
    var S = window.SECTIONS || []; for (var i = 0; i < S.length; i++) for (var j = 0; j < S[i].activities.length; j++) { var a = S[i].activities[j]; if (String(a.href || '').indexOf(id + '.html') >= 0) return lang === 'en' ? (a.te || a.t) : a.t; }
    return id;
  }
  var TALK = [
    { ar: 'ما أجملُ شيءٍ تعلّمتَه هذا الأسبوع؟ ولماذا أعجبك؟', en: 'What is the most beautiful thing you learned this week? Why did you like it?' },
    { ar: 'متى شعرتَ هذا الأسبوع أنّ الله قريبٌ منك؟', en: 'When did you feel this week that Allah is close to you?' },
    { ar: 'مَن ساعدتَ هذا الأسبوع؟ وكيف شعرتَ بعدها؟', en: 'Whom did you help this week? How did you feel afterwards?' },
    { ar: 'لو قابلتَ أنوس اليوم، ماذا تحكي له عن أسبوعك؟', en: 'If you met Anos today, what would you tell him about your week?' },
    { ar: 'ما الكلمةُ الطيّبة التي قالها لك أحدٌ هذا الأسبوع؟', en: 'What kind word did someone say to you this week?' },
    { ar: 'ما الشيءُ الصعب الذي صبرتَ عليه هذا الأسبوع؟', en: 'What hard thing were you patient with this week?' },
    { ar: 'أيُّ دعاءٍ تحبّ أن تدعو به الليلة؟ ولمن؟', en: 'Which du\'a would you like to make tonight? For whom?' },
    { ar: 'ما العملُ الطيّب الذي تريد أن تفعله الأسبوع القادم؟', en: 'What good deed do you want to do next week?' }
  ];

  function render() {
    var prof = (window.MK && MK.activeProfile && MK.activeProfile()) || null, list = (window.MK && MK.profiles && MK.profiles()) || [];
    var lv = J.level(), L = J.log(), now = new Date(), week = [], since = new Date(); since.setHours(0, 0, 0, 0); since.setDate(since.getDate() - 6);
    for (var i = 6; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate() - i); week.push(d); }
    var steps = 0, fullDays = 0, deeds = [];
    week.forEach(function (d) { var o = L[J.dayKey(d)] || {}; steps += J.doneCount(o); if (J.full(o)) fullDays++; if (o.deed) { var g = deedOn(d); if (g) deeds.push({ d: d, g: g }); } });
    var D0 = jget('anos_done', {}) || {}, acts = Object.keys(D0).filter(function (k) { return (D0[k][1] || 0) >= since.getTime(); }).sort(function (a, b) { return D0[b][1] - D0[a][1]; });
    var read = J.readChapters(), chapters = (window.MK_STORY || []).filter(function (c) { var r = read[c.lvl]; return r && new Date(r + 'T12:00') >= since; });
    var bag = {}; try { bag = MKBagCollect(); } catch (e) {}
    var talk = TALK[Math.floor(doy(now) / 7) % TALK.length];
    var dayName = function (d) { return d.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB', { weekday: 'short' }); };

    var html = '<h1>📊 ' + T('تقرير الأسبوع', 'Weekly report') + (prof ? ' — ' + esc(prof.name) : '') + '</h1>' +
      '<p class="sub">' + esc(since.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB', { day: 'numeric', month: 'long' })) + ' – ' + esc(now.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' })) + ' · ' + esc(J.hijriText()) + '</p>';
    if (list.length > 1) html += '<div class="kids">' + list.map(function (p) { return '<button data-kid="' + esc(p.id) + '" class="' + (prof && prof.id === p.id ? 'on' : '') + '">' + esc((p.avatar || '🧒') + ' ' + p.name) + '</button>'; }).join('') + '</div>';
    html += '<div class="grid"><div class="tile"><b>' + lv.ic + '</b><span>' + esc(t(lv.name)) + ' · ' + N(lv.stars) + ' ⭐</span></div>' +
      '<div class="tile"><b>' + N(steps) + '</b><span>' + T('خطوة في «يومي»', 'steps in «My Day»') + '</span></div>' +
      '<div class="tile"><b>' + N(acts.length) + '</b><span>' + T('لعبة أنهاها', 'games finished') + '</span></div>' +
      '<div class="tile"><b>' + N(J.palms()) + '</b><span>' + T('نخلة في بستان الذكر', 'palms in the dhikr garden') + '</span></div></div>';
    html += '<section class="sec"><h2>☀️ ' + T('«يومي» هذا الأسبوع', '«My Day» this week') + ' — ' + T(N(fullDays) + ' أيام كاملة · أيّام متتالية: ' + N(J.streak()), fullDays + ' full days · streak: ' + J.streak()) + '</h2><div class="week">' +
      week.map(function (d) { var o = L[J.dayKey(d)] || {}, n = J.doneCount(o); return '<div class="' + (J.full(o) ? 'full' : '') + '">' + esc(dayName(d)) + '<i>' + (n ? (J.full(o) ? '🌟' : N(n) + '/' + N(5)) : '·') + '</i></div>'; }).join('') + '</div></section>';
    var Qw = J.quest(), qd = J.questDone(), nNights = week.filter(function (d) { return J.night(d) != null; }).length;
    if (Qw) html += '<section class="sec"><h2>' + Qw.icon + ' ' + T('مهمّةُ الأسبوع: ', "This week's quest: ") + esc(t(Qw.title)) + '</h2><ul class="list">' +
      Qw.tasks.map(function (k, i) { return '<li>' + (qd['t' + i] ? '✅' : '⬜') + ' ' + esc(t(k)) + '</li>'; }).join('') +
      '<li>' + (qd.fam ? '✅' : '⬜') + ' ' + T('تحدّي العائلة: ', 'Family challenge: ') + esc(t(Qw.family)) + '</li></ul>' +
      '<p class="note">🗣️ ' + esc(t(Qw.talk)) + '</p><p class="note">🌙 ' + T('جلساتُ «قبل النوم» هذا الأسبوع: ' + N(nNights), 'Bedtime check-ins this week: ' + nNights) + '</p></section>';
    html += '<section class="sec"><h2>💚 ' + T('أعمالٌ طيّبة أخبرَ عنها طفلُكم', 'Good deeds your child says they did') + '</h2>' +
      (deeds.length ? '<ul class="list">' + deeds.map(function (x) { return '<li>' + esc(x.g.icon || '💚') + ' ' + esc(t(x.g)) + ' <small>· ' + esc(dayName(x.d)) + '</small></li>'; }).join('') + '</ul>' : '<p class="empty">' + T('لا شيء بعد هذا الأسبوع — شجّعوه على خطوة «العمل الطيّب» في «يومي».', 'Nothing yet this week — encourage the «good deed» step in «My Day».') + '</p>') +
      '<p class="note">' + T('💡 اسألوه عنها بلطف وامدحوه؛ فالهدفُ أن يحبّ الخير، لا أن نحاسبه.', '💡 Ask about them gently and praise them — the aim is for the child to love doing good, not to be checked up on.') + '</p></section>';
    html += '<section class="sec"><h2>🎮 ' + T('الألعاب التي أنهاها', 'Games finished') + '</h2>' +
      (acts.length ? '<ul class="list">' + acts.slice(0, 12).map(function (k) { return '<li>' + esc(actName(k)) + ' <small>· ' + esc(dayName(new Date(D0[k][1]))) + '</small></li>'; }).join('') + '</ul>' : '<p class="empty">' + T('لم يُنهِ لعبةً هذا الأسبوع.', 'No games finished this week.') + '</p>') + '</section>';
    html += '<section class="sec"><h2>📖 ' + T('رحلة أنوس', "Anos's journey") + '</h2>' +
      (chapters.length ? '<ul class="list">' + chapters.map(function (c) { return '<li>' + c.icon + ' ' + esc(t(c.title)) + ' <small>· ' + esc(t(c.lesson)) + '</small></li>'; }).join('') + '</ul>' : '<p class="empty">' + T('لم يقرأ فصلًا جديدًا هذا الأسبوع.', 'No new chapter read this week.') + '</p>') +
      (lv.next ? '<p class="note">' + T('بقي ' + N(Math.max(0, lv.next.at - lv.stars)) + ' نجمة ليصل إلى «' + lv.next.ar + '» ويُفتح فصلٌ جديد.', (lv.next.at - lv.stars) + ' more stars to reach "' + lv.next.en + '" and open a new chapter.') + '</p>' : '') + '</section>';
    html += '<section class="sec talk"><h2>🗣️ ' + T('سؤالُ حوارٍ لهذا الأسبوع', 'A conversation question for this week') + '</h2><q>' + esc(t(talk)) + '</q><p class="note">' + T('على العشاء أو قبل النوم — استمعوا أكثر ممّا تتكلّمون.', 'At dinner or bedtime — listen more than you speak.') + '</p></section>';
    html += '<div class="acts"><button class="btn gold" id="printBtn">🖨️ ' + T('اطبع التقرير', 'Print the report') + '</button>' +
      '<button class="btn" id="focusBtn">🎯 ' + T('خيارات التركيز (ADHD)', 'Focus options (ADHD)') + '</button>' +
      '<button class="btn" id="offBtn">📥 ' + T('احفظ الموقع للاستخدام بلا إنترنت', 'Save the site for offline use') + '</button></div><div id="offMsg" class="no-print"></div>' +
      '<p class="note">' + T('🔒 هذا التقرير يُحسَب على هذا الجهاز فقط من تقدّم الطفل، ولا يُرسَل إلى أحد.', '🔒 This report is worked out on this device only, from your child\'s progress, and is not sent anywhere.') + '</p>';

    var app = document.getElementById('app'); app.innerHTML = html;
    document.getElementById('printBtn').onclick = function () { window.print(); };
    document.getElementById('focusBtn').onclick = function () { if (window.MKA11y) MKA11y.open(); };
    document.getElementById('offBtn').onclick = saveOffline;
    app.querySelectorAll('[data-kid]').forEach(function (b) { b.onclick = function () { try { MK.setActive(b.getAttribute('data-kid')); } catch (e) {} render(); }; });
  }

  /* «save for offline»: the service worker downloads the main pages, games and scripts once */
  function saveOffline() {
    var m = document.getElementById('offMsg');
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) { m.textContent = T('افتحوا الصفحة الرئيسية مرّةً مع الإنترنت ثم عودوا إلى هنا.', 'Open the home page once while online, then come back here.'); return; }
    var S = window.SECTIONS || [], acts = [];
    S.forEach(function (s) { s.activities.forEach(function (a) { acts.push('corners/activities/' + a.href); }); });
    m.textContent = T('⏳ جارٍ الحفظ…', '⏳ Saving…');
    var ch = new MessageChannel();
    ch.port1.onmessage = function (e) { var d = e.data || {}; m.textContent = d.done ? T('✅ تمّ! حُفظت ' + N(d.ok) + ' صفحة وملفًّا. يعمل «يومي» والألعاب الآن بلا إنترنت (القراءة الصوتية تحتاج الإنترنت).', '✅ Done! ' + d.ok + ' pages and files saved. «My Day» and the games now work offline (read-aloud needs the internet).') : T('⏳ حُفظ ' + N(d.ok) + ' من ' + N(d.total) + '…', '⏳ Saved ' + d.ok + ' of ' + d.total + '…'); };
    navigator.serviceWorker.controller.postMessage({ type: 'mk-offline', extra: acts }, [ch.port2]);
  }

  function texts() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lng-ar').forEach(function (e) { e.style.display = lang === 'ar' ? '' : 'none'; });
    document.querySelectorAll('.lng-en').forEach(function (e) { e.style.display = lang === 'en' ? '' : 'none'; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    document.title = T('تقرير الأسبوع', 'Weekly Report'); render();
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.dataset.lang; try { LS.setItem('bunyanLang', lang); } catch (e) {} texts(); }; });
  window.setLang = function (l) { lang = l; try { LS.setItem('bunyanLang', l); } catch (e) {} texts(); };
  texts();
})();
</script>
<script src="mk-citynav.js"></script>
<script src="mk-topbar.js"></script>
</body>
</html>
