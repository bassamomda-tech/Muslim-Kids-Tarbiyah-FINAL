<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتب التلوين | Colouring Books</title>
<meta name="description" content="كتب تلوين مجانية للأطفال: كلُّ صفحة آية أو حديث مع رسمٍ بالخطوط يلوّنه الطفل. Free colouring books: every page is an ayah or hadith with a line drawing to colour.">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Amiri:wght@700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1b2b44;--gold:#D4A017;--paper:#FFFDF6}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal','Nunito',sans-serif;color:var(--ink);background:#F3EBD8;min-height:100vh}
  html[dir="ltr"] body{font-family:'Nunito','Tajawal',sans-serif}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:center;padding:.8rem 1rem}
  .lang{display:flex;border:1.5px solid #C9B88A;border-radius:2rem;overflow:hidden}
  .lang button{background:transparent;border:none;font:800 .85rem inherit;padding:0 .85rem;min-height:40px;cursor:pointer;color:var(--ink)}
  .lang button.active{background:var(--gold);color:#fff}
  h1{margin:.2rem 1rem 0;text-align:center;font-size:1.7rem}
  .lead{text-align:center;margin:.2rem auto .6rem;max-width:620px;padding:0 1rem;font-weight:700;line-height:1.7;color:#5a4a22}
  .tabs{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:0 1rem}
  .tab,.btn{min-height:48px;padding:0 1.1rem;border-radius:999px;border:2px solid #C9B88A;background:#fff;font:900 1rem 'Tajawal',sans-serif;color:var(--ink);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.go{background:linear-gradient(135deg,#3BB36D,#1F7A44);color:#fff;border:none}
  .pages{max-width:820px;margin:1rem auto 4rem;padding:0 1rem;display:grid;gap:1.2rem}
  .pg{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:1rem 1rem 1.1rem;box-shadow:0 8px 20px rgba(0,0,0,.12);break-inside:avoid;page-break-inside:avoid}
  .pg .num{display:flex;justify-content:space-between;font-weight:900;color:#7A6A3A;font-size:.9rem}
  .pg .pic{border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;margin:.5rem 0 .7rem;background:#fff;aspect-ratio:12/5}
  .pg .pic svg{display:block;width:100%;height:100%}
  .pg .tx{font-family:'Amiri',serif;font-size:1.7rem;font-weight:700;text-align:center;line-height:2;color:#111}
  .pg .en{text-align:center;font-weight:800;line-height:1.6;margin-top:.1rem}
  .pg .src{text-align:center;font-weight:900;color:#7A6A3A;margin-top:.15rem}
  .pg .kid{margin-top:.6rem;padding:.55rem .8rem;border:2px dashed #C9B88A;border-radius:12px;font-weight:800;line-height:1.8;text-align:center}
  .pg .name{margin-top:.7rem;font-weight:900;color:#7A6A3A}
  .pg .name i{display:inline-block;width:55%;border-bottom:2px dotted #7A6A3A;vertical-align:bottom}
  .pg .one{margin-top:.6rem;text-align:center}
  @media print{
    body{background:#fff}.bar,h1,.lead,.tabs,.one,#mkTopbar,.mktb,.mk-dock,#mkDockBtn,#mkA11yBtn{display:none !important}
    .pages{margin:0;padding:0;max-width:none;gap:0}
    .pg{box-shadow:none;border-width:2px;margin:0 0 0;page-break-after:always;break-after:page;min-height:26cm;display:flex;flex-direction:column;justify-content:center}
    .pg.skip{display:none}
    .pg .pic{aspect-ratio:auto;height:11cm}
    .pg .tx{font-size:2rem}
  }
</style>
</head>
<body>
  <div class="bar"><div class="lang"><button data-lang="en">EN</button><button data-lang="ar" class="active">عربي</button></div></div>
  <h1 id="ttl"></h1>
  <p class="lead" id="lead"></p>
  <div class="tabs" id="tabs"></div>
  <main class="pages" id="pages" aria-live="polite"></main>

<script src="mk-system.js"></script>
<script src="my-day-data.js"></script>
<script src="story-pics.js"></script>
<script>
/* «كتب التلوين» — free colouring books made from the site's own reviewed texts (my-day-data.js):
   every page = one ayah or one hadith + a black-outline scene to colour (drawn by the scene
   illustrator in LINE mode: no faces, no people) + the child-level meaning + a line for the child's name.
   Print one page or the whole book. Nothing is downloaded and nothing costs anything. */
(function () {
  var D = window.MK_DAY || {}, lang = 'ar', book = 'ayat';
  try { lang = localStorage.getItem('bunyanLang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  function T(a, e) { return lang === 'en' ? e : a; }
  function t(o) { return o ? (o[lang] || o.ar || '') : ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function N(n) { return lang === 'ar' ? String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }) : String(n); }
  var BOOKS = [['ayat', '📖', 'آياتٌ ألوّنها', 'Ayat to colour'], ['hadith', '🕌', 'أحاديث ألوّنها', 'Hadith to colour']];
  function render() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
    document.title = T('كتب التلوين', 'Colouring Books');
    document.getElementById('ttl').textContent = '🖍️ ' + T('كتب التلوين', 'Colouring Books');
    document.getElementById('lead').textContent = T('كلُّ صفحةٍ آيةٌ أو حديث، ومعها رسمٌ بالخطوط تلوّنه بألوانك. اطبع صفحةً واحدة أو الكتاب كلَّه.', 'Every page is an ayah or a hadith with a line drawing for you to colour. Print one page or the whole book.');
    var list = D[book] || [];
    document.getElementById('tabs').innerHTML = BOOKS.map(function (b) { return '<button class="tab' + (b[0] === book ? ' on' : '') + '" data-b="' + b[0] + '">' + b[1] + ' ' + T(b[2], b[3]) + ' (' + N((D[b[0]] || []).length) + ')</button>'; }).join('') + '<button class="btn go" id="printAll">🖨️ ' + T('اطبع الكتاب كلَّه', 'Print the whole book') + '</button>';
    document.getElementById('pages').innerHTML = list.map(function (o, i) {
      return '<article class="pg" id="pg-' + i + '"><div class="num"><span>' + T(book === 'ayat' ? 'آيةٌ ألوّنها' : 'حديثٌ ألوّنه', book === 'ayat' ? 'An ayah to colour' : 'A hadith to colour') + '</span><span>' + N(i + 1) + ' / ' + N(list.length) + '</span></div>' +
        '<div class="pic" data-i="' + i + '"></div><div class="tx">' + esc(o.ar) + '</div>' + (lang === 'en' ? '<div class="en">' + esc(o.en) + '</div>' : '') + '<div class="src">' + esc(t(o.ref || o.src)) + '</div>' +
        (o.kid ? '<div class="kid">💡 ' + esc(t(o.kid)) + '</div>' : '') + '<div class="name">' + T('لوَّنها: ', 'Coloured by: ') + '<i></i></div><div class="one"><button class="btn" data-p="' + i + '">🖨️ ' + T('اطبع هذه الصفحة', 'Print this page') + '</button></div></article>';
    }).join('');
    document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { book = b.getAttribute('data-b'); render(); }; });
    document.getElementById('printAll').onclick = function () { document.querySelectorAll('.pg').forEach(function (p) { p.classList.remove('skip'); }); window.print(); };
    document.querySelectorAll('.one .btn').forEach(function (b) { b.onclick = function () { var n = b.getAttribute('data-p'); document.querySelectorAll('.pg').forEach(function (p) { p.classList.toggle('skip', p.id !== 'pg-' + n); }); window.print(); }; });
    /* draw the outlines a few at a time so the page stays responsive */
    var boxes = [].slice.call(document.querySelectorAll('.pic')), k = 0;
    (function next() {
      if (k >= boxes.length) return; var el = boxes[k], o = list[+el.getAttribute('data-i')]; k++;
      MKStoryPic.get({ id: 'col-' + o.id, kind: 'color', W: 720, era: 'old', title: '', emoji: '', text: (o.kid ? o.kid.ar + ' ' : '') + o.ar + ' ' + (o.en || '') }, function (svg) {
        if (svg && document.contains(el)) { el.innerHTML = svg; var g = el.querySelector('svg'); if (g) { g.setAttribute('preserveAspectRatio', 'xMidYMid meet'); g.setAttribute('role', 'img'); g.setAttribute('aria-label', T('رسمٌ للتلوين', 'A drawing to colour')); } }
        setTimeout(next, 0);
      });
    })();
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.dataset.lang; try { localStorage.setItem('bunyanLang', lang); } catch (e) {} render(); }; });
  window.setLang = function (l) { lang = l; render(); };
  window.addEventListener('afterprint', function () { document.querySelectorAll('.pg').forEach(function (p) { p.classList.remove('skip'); }); });
  render();
})();
</script>
<script src="mk-citynav.js"></script>
<script src="mk-topbar.js"></script>
</body>
</html>
