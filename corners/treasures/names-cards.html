<script>
/* Names of Allah cards. Each name is affirmed as Allah described Himself,
   without likening Him to His creation: «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ البَصِيرُ». */
(function () {
  var N = [
    /* ── قدرة وعظمة ── */
    { id:'allah', tg:'azama', n:'اللَّهُ', ar:'الله', en:'Allah — The One True God', sa:'الاسم الأعظم الجامع لكل الأسماء', se:'The greatest name, gathering all the names',
      ya:'﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾', ye:'"Allah — there is no god but Him. To Him belong the most beautiful names."', s:['طه: ٨','Ta-Ha 20:8'],
      ma:'«الله» هو اسمُ ربِّنا الذي خلقنا. هو وحدَه الذي نعبده ونحبّه أكثرَ من كل شيء. وكلُّ الأسماء الحسنى أسماؤه.', me:'"Allah" is the name of our Lord who created us. He alone is the One we worship and love more than anything. All the beautiful names are His.',
      ea:'حين أقول «بسم الله» قبل الأكل واللعب والمذاكرة، أتذكّر أنّ ربّي معي في كل شيء.', ee:'When I say "Bismillah" before eating, playing and studying, I remember my Lord is with me in everything.',
      da:'«بِسْمِ اللَّهِ» — أقولها قبل كل عمل جميل.', de:'"Bismillah — In the name of Allah" — I say it before every good deed.',
      q:['من هو الذي نعبده وحده؟','Who is the only One we worship?',[['الله سبحانه','Allah, glory be to Him',1],['الشمس','The sun',0],['الأصنام','Idols',0]],'أحسنت! نعبد الله وحده لا شريك له.','Well done! We worship Allah alone, with no partner.'] },
    { id:'ahad', tg:'azama', n:'الأَحَدُ', ar:'الأحد', en:'Al-Ahad — The One', sa:'واحدٌ لا شريك له ولا مثيل', se:'One, with no partner and nothing like Him',
      ya:'﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾', ye:'"Say: He is Allah, the One."', s:['الإخلاص: ١','Al-Ikhlas 112:1'],
      ma:'الله واحدٌ، ليس معه إلهٌ آخر. لا أحدَ يشبهه، ولا أحدَ يساعده في خلق الكون.', me:'Allah is One; there is no other god with Him. No one is like Him, and no one helps Him create the universe.',
      ea:'أطلب حاجتي من الله وحده، وأتوكّل عليه وحده، فقلبي مطمئنٌّ وغير مشتّت.', ee:'I ask Allah alone for what I need and rely on Him alone, so my heart is calm and not scattered.',
      da:'أقرأ سورة الإخلاص — وهي تعدل ثلث القرآن (رواه البخاري).', de:'I recite Surat al-Ikhlas — it equals a third of the Quran (al-Bukhari).',
      q:['ماذا يعني أنّ الله «أحد»؟','What does it mean that Allah is "Ahad"?',[['واحدٌ لا شريك له','One, with no partner',1],['له أصدقاء يساعدونه','He has friends who help Him',0],['يشبه الملوك','He is like kings',0]],'صحيح! الله واحدٌ لا شريك له.','Correct! Allah is One with no partner.'] },
    { id:'samad', tg:'azama', n:'الصَّمَدُ', ar:'الصمد', en:'As-Samad — The Self-Sufficient Master', sa:'الذي يحتاجه كلُّ شيء، ولا يحتاج إلى شيء', se:'Everything needs Him, and He needs nothing',
      ya:'﴿اللَّهُ الصَّمَدُ﴾', ye:'"Allah, the Eternal Refuge."', s:['الإخلاص: ٢','Al-Ikhlas 112:2'],
      ma:'كلُّ المخلوقات تحتاج إلى الله: الطيور في طعامها، والنبات في مائه، والإنسان في كل شيء. والله لا يحتاج إلى أحد.', me:'All creatures need Allah: birds for their food, plants for their water, people for everything. And Allah needs no one.',
      ea:'إذا ضاع شيءٌ مني أو خفتُ، أرفع يديّ وأدعو الله أوّلًا، لأنه هو الذي أقصده في كل حاجة.', ee:'If I lose something or feel afraid, I raise my hands and call on Allah first, because He is the One I turn to for every need.',
      da:'«يا الله، أنت الصمد، أعنّي ويسّر أمري».', de:'"O Allah, You are As-Samad — help me and make my matter easy."',
      q:['من الذي يحتاج إليه كلُّ شيء؟','Who does everything need?',[['الله الصمد','Allah, As-Samad',1],['لا أحد','No one',0],['الحيوانات','Animals',0]],'أحسنت! كلُّ شيءٍ يحتاج إلى الله.','Well done! Everything needs Allah.'] },
    { id:'malik', tg:'azama', n:'المَلِكُ', ar:'الملك', en:'Al-Malik — The King', sa:'مالكُ كلِّ شيء، وملكُ الملوك', se:'Owner of everything, King of all kings',
      ya:'﴿فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ﴾', ye:'"So exalted is Allah, the True King."', s:['طه: ١١٤','Ta-Ha 20:114'],
      ma:'كلُّ ما في الكون مُلكٌ لله: السماء والأرض، وأنا وألعابي أيضًا! ملوك الدنيا يموتون، والله هو الملك الحق الذي لا يزول.', me:'Everything in the universe belongs to Allah: the sky, the earth, me and even my toys! Kings of this world pass away; Allah is the True King who never ends.',
      ea:'أشارك ألعابي بسهولة، لأنها في الحقيقة نعمةٌ من الملك أعطاني إيّاها.', ee:'I share my toys easily, because they are really a gift from the King who gave them to me.',
      da:'«اللهم يا مالك المُلك، بارك لي فيما أعطيتني».', de:'"O Allah, Owner of all dominion, bless me in what You have given me."',
      q:['لمن تعود ألعابي في الحقيقة؟','To whom do my toys really belong?',[['لله الملك، وهي نعمةٌ منه','To Allah the King — a gift from Him',1],['لا أحد يملكها','No one owns them',0],['للمتجر','To the shop',0]],'صحيح! كلُّ شيءٍ مُلكٌ لله.','Correct! Everything belongs to Allah.'] },
    { id:'quddus', tg:'azama', n:'القُدُّوسُ', ar:'القدوس', en:'Al-Quddus — The Most Pure', sa:'المُنزَّه عن كل نقصٍ وعيب', se:'Free of every flaw and shortcoming',
      ya:'﴿هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ﴾', ye:'"He is Allah — there is no god but Him — the King, the Most Pure, the Source of Peace."', s:['الحشر: ٢٣','Al-Hashr 59:23'],
      ma:'القدوس يعني أنّ الله كاملٌ طاهر، ليس فيه أيُّ عيب. لا ينام، ولا ينسى، ولا يتعب، ولا يظلم أحدًا.', me:'Al-Quddus means Allah is perfect and pure, without any flaw. He never sleeps, forgets, tires, or wrongs anyone.',
      ea:'أُحبّ الطهارة: أنظّف قلبي من الكذب والحسد، وأنظّف جسمي وثيابي ومكاني.', ee:'I love purity: I clean my heart from lies and envy, and keep my body, clothes and room clean.',
      da:'كان النبي ﷺ يقول في ركوعه وسجوده: «سُبُّوحٌ قُدُّوسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوحِ» (رواه مسلم).', de:'The Prophet ﷺ would say in bowing and prostration: "Subbuhun Quddusun, Rabbul-mala\'ikati war-ruh — Glorified, Most Pure, Lord of the angels and the Spirit" (Muslim).',
      q:['هل ينام الله أو ينسى؟','Does Allah sleep or forget?',[['لا، فهو القدوس الكامل','No — He is Al-Quddus, the Perfect',1],['نعم أحيانًا','Yes, sometimes',0],['لا أعرف','I don\'t know',0]],'أحسنت! الله منزّهٌ عن كل نقص.','Well done! Allah is free of every flaw.'] },
    { id:'salam', tg:'rahma', n:'السَّلَامُ', ar:'السلام', en:'As-Salam — The Source of Peace', sa:'السالم من كل عيب، ومنه يأتي الأمان', se:'Free of every flaw; all peace comes from Him',
      ya:'﴿الْمَلِكُ الْقُدُّوسُ السَّلَامُ﴾', ye:'"The King, the Most Pure, the Source of Peace."', s:['الحشر: ٢٣','Al-Hashr 59:23'],
      ma:'الله هو السلام، ومنه يأتي الأمان والطمأنينة. ولذلك جعل تحيّتنا «السلام عليكم».', me:'Allah is As-Salam, and safety and calm come from Him. That is why our greeting is "As-salamu alaykum — peace be upon you".',
      ea:'أُفشي السلام على أهلي وأصدقائي، وأكون أنا سببًا في هدوء البيت لا في الصراخ.', ee:'I spread salam to my family and friends, and I try to bring calm to the home, not shouting.',
      da:'بعد الصلاة: «اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ» (رواه مسلم).', de:'After prayer: "Allahumma antas-salam wa minkas-salam, tabarakta ya dhal-jalali wal-ikram — O Allah, You are Peace and from You is peace; blessed are You, Owner of majesty and honour" (Muslim).',
      q:['ما تحيّة المسلمين التي فيها اسم «السلام»؟','Which Muslim greeting carries the name "As-Salam"?',[['السلام عليكم','As-salamu alaykum',1],['مرحبًا فقط','Just "hello"',0],['التلويح باليد فقط','Only waving',0]],'صحيح! نقول: السلام عليكم ورحمة الله.','Correct! We say: As-salamu alaykum wa rahmatullah.'] },
    { id:'khaliq', tg:'azama', n:'الخَالِقُ', ar:'الخالق', en:'Al-Khaliq — The Creator', sa:'الذي أوجد كلَّ شيء من العدم', se:'He brought everything into being from nothing',
      ya:'﴿هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾', ye:'"He is Allah, the Creator, the Originator, the Fashioner. To Him belong the most beautiful names."', s:['الحشر: ٢٤','Al-Hashr 59:24'],
      ma:'الله خلق السماء والنجوم والبحار والفراشات، وخلقني أنا أيضًا! نحن نصنع من أشياء موجودة، أمّا الله فيخلق من لا شيء.', me:'Allah created the sky, stars, seas and butterflies — and He created me too! We make things from what already exists; Allah creates from nothing.',
      ea:'أنظر إلى زهرةٍ أو نملةٍ وأقول: «سبحان الخالق!»، وأحترم كلَّ مخلوق ولا أؤذيه.', ee:'I look at a flower or an ant and say "Glory be to the Creator!", and I respect every creature and never harm it.',
      da:'«اللَّهُمَّ أَنْتَ حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي» (رواه أحمد وصحّحه الألباني).', de:'"O Allah, You made my form beautiful, so make my character beautiful" (Ahmad, graded sahih by al-Albani).',
      q:['من خلق الفراشة الملوّنة؟','Who created the colourful butterfly?',[['الله الخالق','Allah, the Creator',1],['خلقت نفسها','It created itself',0],['الرسّام','A painter',0]],'أحسنت! الله خالق كل شيء.','Well done! Allah is the Creator of everything.'] },
    { id:'qawiy', tg:'azama', n:'القَوِيُّ', ar:'القوي', en:'Al-Qawiyy — The All-Strong', sa:'صاحبُ القوّة الكاملة، لا يعجزه شيء', se:'Perfect in strength; nothing is beyond Him',
      ya:'﴿إِنَّ اللَّهَ لَقَوِيٌّ عَزِيزٌ﴾', ye:'"Indeed, Allah is All-Strong, All-Mighty."', s:['الحج: ٤٠','Al-Hajj 22:40'],
      ma:'قوّة الله لا حدود لها: يُنزل المطر، ويُجري الرياح، ويُمسك السماء. ولا يتعب أبدًا.', me:'Allah\'s strength has no limit: He sends the rain, drives the winds and holds up the sky — and He never gets tired.',
      ea:'لا أخاف من المتنمّر ولا أيأس، فأنا ألجأ إلى القوي. وأستعمل قوّتي في مساعدة الضعيف لا في ضربه.', ee:'I don\'t give in to fear of bullies or despair; I turn to the All-Strong. And I use my strength to help the weak, never to hit them.',
      da:'«لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ» — كنزٌ من كنوز الجنة (رواه البخاري ومسلم).', de:'"La hawla wa la quwwata illa billah — there is no power nor strength except through Allah" — a treasure of Paradise (al-Bukhari & Muslim).',
      q:['كيف أستعمل قوّتي كما يحبّ الله؟','How do I use my strength the way Allah loves?',[['أساعد الضعيف','I help the weak',1],['أضرب الصغار','I hit little ones',0],['أكسر الأشياء','I break things',0]],'رائع! القوّة الحقيقية في مساعدة الآخرين.','Great! True strength is helping others.'] },
    { id:'aziz', tg:'azama', n:'العَزِيزُ', ar:'العزيز', en:'Al-Aziz — The All-Mighty', sa:'الغالب الذي لا يُغلَب', se:'The Victorious who is never overcome',
      ya:'﴿سَبَّحَ لِلَّهِ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ﴾', ye:'"Whatever is in the heavens and the earth glorifies Allah, and He is the All-Mighty, the All-Wise."', s:['الحديد: ١','Al-Hadid 57:1'],
      ma:'العزيز هو الذي لا يغلبه أحد، ولا يستطيع أحدٌ أن يضرّه. ومن أطاعه أعطاه عزّةً وكرامة.', me:'Al-Aziz is the One no one can defeat or harm. Whoever obeys Him, He gives honour and dignity.',
      ea:'أفتخر بأني مسلم، ولا أترك الحقّ لأنّ الآخرين يضحكون مني، فعزّتي من الله.', ee:'I am proud to be Muslim and don\'t leave what is right because others laugh — my honour comes from Allah.',
      da:'«يا عزيز، أعزّني بطاعتك».', de:'"O All-Mighty, honour me through obeying You."',
      q:['من أين تأتي العزّة الحقيقية؟','Where does true honour come from?',[['من طاعة الله العزيز','From obeying Allah, Al-Aziz',1],['من الثياب الغالية','From expensive clothes',0],['من التكبّر على الناس','From arrogance',0]],'صحيح! العزّة لله ولمن أطاعه.','Correct! Honour belongs to Allah and those who obey Him.'] },
    { id:'hayy', tg:'azama', n:'الحَيُّ', ar:'الحي', en:'Al-Hayy — The Ever-Living', sa:'الحيّ الذي لا يموت أبدًا', se:'Living forever, never dying',
      ya:'﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ﴾', ye:'"Allah — there is no god but Him, the Ever-Living, the Sustainer of all. Neither drowsiness nor sleep overtakes Him."', s:['البقرة: ٢٥٥','Al-Baqarah 2:255'],
      ma:'كلُّ شيء في الدنيا يكبر ثم ينتهي، إلا الله، فهو الحيُّ دائمًا. كان قبل كل شيء، ويبقى بعد كل شيء.', me:'Everything in this world grows and then ends — except Allah, who is always living. He was before everything and remains after everything.',
      ea:'أتعلّق بالله الذي لا يموت، فحين أفقد شيئًا أحبّه أعرف أنّ ربّي باقٍ معي.', ee:'I attach my heart to Allah who never dies, so when I lose something I love, I know my Lord is still with me.',
      da:'«يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ» (رواه الترمذي وحسّنه الألباني).', de:'"Ya Hayyu ya Qayyum, bi-rahmatika astaghith — O Ever-Living, O Sustainer, by Your mercy I seek help" (at-Tirmidhi, graded hasan).',
      q:['أيُّ آيةٍ عظيمة فيها اسم «الحي»؟','Which great verse contains the name "Al-Hayy"?',[['آية الكرسي','Ayat al-Kursi',1],['لا توجد آية','There is no verse',0],['آية الدَّين فقط','Only the verse of debt',0]],'أحسنت! آية الكرسي أعظم آية في القرآن.','Well done! Ayat al-Kursi is the greatest verse in the Quran.'] },
    { id:'qayyum', tg:'azama', n:'القَيُّومُ', ar:'القيوم', en:'Al-Qayyum — The Sustainer of All', sa:'القائم بنفسه، المدبّر لكل شيء', se:'Self-subsisting, managing all things',
      ya:'﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾', ye:'"Allah — there is no god but Him, the Ever-Living, the Sustainer of all."', s:['آل عمران: ٢','Al Imran 3:2'],
      ma:'القيوم يدبّر أمر كل شيء في كل لحظة: يحرّك الشمس، ويرعى الطيور، ويحفظ قلبي وهو ينبض وأنا نائم.', me:'Al-Qayyum takes care of everything at every moment: He moves the sun, looks after the birds, and keeps my heart beating while I sleep.',
      ea:'أنام مطمئنًّا، لأنّ الذي يحفظني لا ينام. وأقرأ آية الكرسي قبل النوم.', ee:'I sleep peacefully, because the One who protects me never sleeps. I recite Ayat al-Kursi before bed.',
      da:'من قرأ آية الكرسي قبل نومه لم يزل عليه من الله حافظ حتى يصبح (رواه البخاري).', de:'Whoever recites Ayat al-Kursi before sleeping has a guardian from Allah until morning (al-Bukhari).',
      q:['ماذا أقرأ قبل النوم ليحفظني الله؟','What do I recite before sleeping so Allah protects me?',[['آية الكرسي','Ayat al-Kursi',1],['أغنية','A song',0],['لا شيء','Nothing',0]],'رائع! آية الكرسي حفظٌ لك حتى الصباح.','Great! Ayat al-Kursi guards you until morning.'] },
    { id:'ghaniy', tg:'ata', n:'الغَنِيُّ', ar:'الغني', en:'Al-Ghaniyy — The Self-Sufficient, Free of Need', sa:'لا يحتاج إلى أحد، وكلُّ الخلق يحتاجونه', se:'He needs no one; all creation needs Him',
      ya:'﴿يَا أَيُّهَا النَّاسُ أَنتُمُ الْفُقَرَاءُ إِلَى اللَّهِ ۖ وَاللَّهُ هُوَ الْغَنِيُّ الْحَمِيدُ﴾', ye:'"O people, you are the ones in need of Allah, while Allah is the Free of need, the Praiseworthy."', s:['فاطر: ١٥','Fatir 35:15'],
      ma:'الله لا يحتاج إلى صلاتنا ولا إلى طعامنا. نحن نصلّي لأننا نحن الذين نحتاج إلى الله ونحبّه.', me:'Allah doesn\'t need our prayer or our food. We pray because we are the ones who need Allah, and we love Him.',
      ea:'أصلّي وأنا أشعر أنّ الصلاة خيرٌ لي أنا، وأتواضع ولا أتكبّر على أحد.', ee:'I pray knowing that prayer is good for me, and I stay humble and never look down on anyone.',
      da:'«اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى» (رواه مسلم).', de:'"O Allah, I ask You for guidance, piety, chastity and sufficiency" (Muslim).',
      q:['لماذا نصلّي؟','Why do we pray?',[['لأننا نحتاج إلى الله ونحبّه','Because we need Allah and love Him',1],['لأنّ الله يحتاج صلاتنا','Because Allah needs our prayer',0],['ليرانا الناس','So people see us',0]],'صحيح! الله غنيٌّ عنّا ونحن الفقراء إليه.','Correct! Allah needs nothing; we are the ones in need of Him.'] },

    /* ── رحمة ولطف ── */
    { id:'rahman', tg:'rahma', n:'الرَّحْمَنُ', ar:'الرحمن', en:'Ar-Rahman — The Most Merciful', sa:'رحمته واسعة وسِعت كلَّ شيء', se:'His mercy is vast and covers everything',
      ya:'﴿الرَّحْمَٰنُ ۝ عَلَّمَ الْقُرْآنَ﴾', ye:'"The Most Merciful — taught the Quran."', s:['الرحمن: ١–٢','Ar-Rahman 55:1–2'],
      ma:'رحمة الله تشمل كلَّ المخلوقات: الأمّ التي تحضن طفلها، والقطّة التي ترضع صغارها — كلُّ ذلك من رحمة الله.', me:'Allah\'s mercy covers all creatures: a mother hugging her child, a cat feeding its kittens — all of that comes from Allah\'s mercy.',
      ea:'أرحم أخي الصغير، وأرفق بالحيوانات، لأنّ الراحمين يرحمهم الرحمن.', ee:'I am gentle with my little brother and kind to animals, because the Most Merciful has mercy on those who are merciful.',
      da:'﴿رَّبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ﴾ (المؤمنون: ١١٨).', de:'"My Lord, forgive and have mercy, for You are the best of those who show mercy" (Al-Mu\'minun 23:118).',
      q:['من الذي يرحمه الرحمن؟','Whom does the Most Merciful have mercy on?',[['الذين يرحمون غيرهم','Those who are merciful to others',1],['الذين يؤذون القطط','Those who hurt cats',0],['الذين يصرخون دائمًا','Those who always shout',0]],'أحسنت! «الراحمون يرحمهم الرحمن» (رواه أبو داود والترمذي).','Well done! "The merciful are shown mercy by the Most Merciful" (Abu Dawud & at-Tirmidhi).'] },
    { id:'rahim', tg:'rahma', n:'الرَّحِيمُ', ar:'الرحيم', en:'Ar-Rahim — The Especially Merciful', sa:'رحيمٌ بالمؤمنين في الدنيا والآخرة', se:'Especially merciful to the believers, now and in the Hereafter',
      ya:'﴿وَكَانَ بِالْمُؤْمِنِينَ رَحِيمًا﴾', ye:'"And He is ever Merciful to the believers."', s:['الأحزاب: ٤٣','Al-Ahzab 33:43'],
      ma:'الله رحيمٌ بعباده المؤمنين: يغفر لهم، ويفرحهم، ويُدخلهم الجنة برحمته. ورحمته بنا أعظم من رحمة أمّهاتنا.', me:'Allah is merciful to His believing servants: He forgives them, gives them joy, and admits them to Paradise by His mercy. His mercy to us is greater than our mothers\' mercy.',
      ea:'إذا أخطأتُ لا أيأس، بل أرجع إلى ربي الرحيم وأعتذر.', ee:'When I make a mistake I don\'t lose hope; I return to my Merciful Lord and say sorry.',
      da:'«بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ» — في أوّل كل سورة إلا سورة التوبة.', de:'"Bismillahir-Rahmanir-Rahim" — at the start of every surah except at-Tawbah.',
      q:['رحمة الله بنا أعظم من رحمة…','Allah\'s mercy to us is greater than the mercy of…',[['أمّهاتنا','Our mothers',1],['لا شيء، هي أقلّ','Nothing — it is less',0],['اللعبة','A toy',0]],'صحيح! كما أخبر النبي ﷺ: «لَلَّهُ أرحمُ بعباده من هذه بولدها» (رواه البخاري ومسلم).','Correct! The Prophet ﷺ said: "Allah is more merciful to His servants than this mother to her child" (al-Bukhari & Muslim).'] },
    { id:'rauf', tg:'rahma', n:'الرَّءُوفُ', ar:'الرؤوف', en:'Ar-Ra\'uf — The Most Kind', sa:'شديد الرأفة والرحمة بعباده', se:'Deeply kind and compassionate to His servants',
      ya:'﴿إِنَّ اللَّهَ بِالنَّاسِ لَرَءُوفٌ رَّحِيمٌ﴾', ye:'"Indeed Allah is, to the people, Most Kind and Merciful."', s:['البقرة: ١٤٣','Al-Baqarah 2:143'],
      ma:'الرأفة رحمةٌ رقيقةٌ جدًّا. الله لم يكلّفنا ما لا نطيق: المريض يصلّي جالسًا، والصغير لا يصوم حتى يقدر.', me:'Ra\'fah is a very tender mercy. Allah never asks more than we can bear: the sick may pray sitting, and the young don\'t fast until they are able.',
      ea:'أكون رقيقًا مع أصدقائي، وأقول كلامًا لطيفًا لمن هو حزين.', ee:'I am gentle with my friends and say kind words to anyone who is sad.',
      da:'«يا رؤوف، ارأف بي وبوالديّ».', de:'"O Most Kind, be kind to me and my parents."',
      q:['هل يكلّفنا الله ما لا نستطيع؟','Does Allah ask of us what we cannot do?',[['لا، فهو رؤوفٌ بنا','No — He is Most Kind to us',1],['نعم دائمًا','Yes, always',0],['لا أدري','I don\'t know',0]],'أحسنت! ﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾ (البقرة: ٢٨٦).','Well done! "Allah does not burden a soul beyond its capacity" (2:286).'] },
    { id:'latif', tg:'rahma', n:'اللَّطِيفُ', ar:'اللطيف', en:'Al-Latif — The Subtly Kind', sa:'يوصل الخير إلى عباده بطرقٍ خفيّة', se:'Brings good to His servants in hidden, gentle ways',
      ya:'﴿اللَّهُ لَطِيفٌ بِعِبَادِهِ يَرْزُقُ مَن يَشَاءُ﴾', ye:'"Allah is Subtly Kind to His servants; He provides for whom He wills."', s:['الشورى: ١٩','Ash-Shura 42:19'],
      ma:'اللطيف يرتّب لنا الخير من حيث لا ندري. مثل يوسف عليه السلام: أُلقي في البئر، ثم صار عزيز مصر! كان الله لطيفًا به في كل خطوة.', me:'Al-Latif arranges good for us in ways we don\'t see. Like Yusuf (peace be upon him): thrown into a well, then he became a minister of Egypt! Allah was kind to him at every step.',
      ea:'إذا حدث شيءٌ لا أحبّه أقول: «لعلّ فيه خيرًا»، وأثق أنّ ربي لطيف.', ee:'When something I don\'t like happens, I say "Maybe there is good in it", trusting that my Lord is Subtly Kind.',
      da:'قال يوسف عليه السلام: ﴿إِنَّ رَبِّي لَطِيفٌ لِّمَا يَشَاءُ﴾ (يوسف: ١٠٠).', de:'Yusuf said: "Indeed my Lord is Subtly Kind in what He wills" (Yusuf 12:100).',
      q:['أيُّ نبيٍّ قال: «إنّ ربي لطيفٌ لما يشاء»؟','Which prophet said "My Lord is Subtly Kind in what He wills"?',[['يوسف عليه السلام','Yusuf (AS)',1],['نوح عليه السلام','Nuh (AS)',0],['لا أحد','No one',0]],'صحيح! قالها يوسف بعد رحلةٍ طويلة من البئر إلى العرش.','Correct! Yusuf said it after a long journey from the well to the throne.'] },
    { id:'wadud', tg:'rahma', n:'الوَدُودُ', ar:'الودود', en:'Al-Wadud — The Most Loving', sa:'يحبّ عباده الصالحين ويحبّونه', se:'He loves His righteous servants and they love Him',
      ya:'﴿وَهُوَ الْغَفُورُ الْوَدُودُ﴾', ye:'"And He is the Forgiving, the Most Loving."', s:['البروج: ١٤','Al-Buruj 85:14'],
      ma:'الله يحبّ المؤمنين الذين يعملون الخير، ويجعل الناس يحبّونهم. وأجمل شيء أن يحبّني ربي!', me:'Allah loves the believers who do good, and makes people love them. The most beautiful thing is that my Lord loves me!',
      ea:'أفعل ما يحبّه الله: الصدق، والرحمة، والصلاة، وبرّ الوالدين — لأكون من أحبابه.', ee:'I do what Allah loves — honesty, mercy, prayer, kindness to parents — to be among His beloved.',
      da:'«اللهم إني أسألك حبَّك، وحبَّ من يحبُّك» (رواه الترمذي ٣٢٣٥ وصحّحه).', de:'"O Allah, I ask You for Your love and the love of those who love You" (at-Tirmidhi 3235, graded sahih).',
      q:['كيف أكون من أحباب الله الودود؟','How do I become beloved to Allah, Al-Wadud?',[['أفعل ما يحبّه الله','I do what Allah loves',1],['أكذب أحيانًا','I lie sometimes',0],['أترك الصلاة','I skip prayer',0]],'رائع! من أحبّ ما يحبّه الله أحبّه الله.','Great! Whoever loves what Allah loves, Allah loves him.'] },
    { id:'ghafur', tg:'rahma', n:'الغَفُورُ', ar:'الغفور', en:'Al-Ghafur — The Most Forgiving', sa:'يستر الذنوب ويمحوها', se:'Covers sins and wipes them away',
      ya:'﴿نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ﴾', ye:'"Inform My servants that I am the Forgiving, the Merciful."', s:['الحجر: ٤٩','Al-Hijr 15:49'],
      ma:'كلُّنا نُخطئ. والله الغفور يمحو أخطاءنا إذا ندمنا واستغفرنا، كأنّ الممحاة تمسح الورقة فتعود بيضاء.', me:'We all make mistakes. Al-Ghafur wipes them away when we feel sorry and seek forgiveness — like an eraser making the page clean again.',
      ea:'أقول «أستغفر الله» كثيرًا، وأسامح أصدقائي كما أحبّ أن يسامحني الله.', ee:'I say "Astaghfirullah" often, and I forgive my friends as I\'d love Allah to forgive me.',
      da:'«أَسْتَغْفِرُ اللَّهَ» — كان النبي ﷺ يستغفر في اليوم أكثر من سبعين مرة (رواه البخاري).', de:'"Astaghfirullah — I seek Allah\'s forgiveness." The Prophet ﷺ sought forgiveness more than seventy times a day (al-Bukhari).',
      q:['ماذا أفعل إذا أخطأت؟','What do I do when I make a mistake?',[['أندم وأقول: أستغفر الله','Feel sorry and say: Astaghfirullah',1],['أخفي الخطأ وأكرّره','Hide it and repeat it',0],['أيأس','Give up hope',0]],'أحسنت! الله يحبّ التائبين.','Well done! Allah loves those who repent.'] },
    { id:'tawwab', tg:'rahma', n:'التَّوَّابُ', ar:'التواب', en:'At-Tawwab — The Acceptor of Repentance', sa:'يقبل التوبة مرّةً بعد مرّة', se:'Accepts repentance again and again',
      ya:'﴿إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ﴾', ye:'"Indeed, He is the Acceptor of repentance, the Merciful."', s:['البقرة: ٣٧','Al-Baqarah 2:37'],
      ma:'حين أخطأ آدم عليه السلام تعلّم كلماتٍ من ربه فتاب، فتاب الله عليه. الله يفرح بتوبة عبده ويفتح له الباب دائمًا.', me:'When Adam (AS) made a mistake, he learned words from his Lord and repented, and Allah accepted it. Allah is glad when His servant repents and always keeps the door open.',
      ea:'إذا أخطأتُ في حقّ أحد أعتذر منه بسرعة، وأرجع إلى الله دون خجلٍ منه.', ee:'If I wrong someone I apologise quickly, and I return to Allah without being too shy to ask.',
      da:'«رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ» (رواه أبو داود وصحّحه الألباني).', de:'"My Lord, forgive me and accept my repentance; You are the Acceptor of repentance, the Merciful" (Abu Dawud, graded sahih).',
      q:['أوّل من تاب فتاب الله عليه:','The first to repent and be forgiven by Allah was:',[['آدم عليه السلام','Adam (AS)',1],['إبليس','Iblis',0],['فرعون','Pharaoh',0]],'صحيح! ﴿فَتَلَقَّىٰ آدَمُ مِن رَّبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ﴾.','Correct! "Then Adam received words from his Lord, and He accepted his repentance."'] },
    { id:'halim', tg:'rahma', n:'الحَلِيمُ', ar:'الحليم', en:'Al-Halim — The Forbearing', sa:'لا يعجل بالعقوبة، ويمهل عباده ليتوبوا', se:'Does not rush to punish; gives time to repent',
      ya:'﴿وَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ حَلِيمٌ﴾', ye:'"And know that Allah is Forgiving and Forbearing."', s:['البقرة: ٢٣٥','Al-Baqarah 2:235'],
      ma:'الحليم لا يغضب بسرعة ولا يعاقب فورًا، بل يعطي الناس فرصةً ليرجعوا ويصلحوا.', me:'Al-Halim doesn\'t rush to punish; He gives people a chance to come back and make things right.',
      ea:'إذا أغضبني أخي لا أنفجر، بل أهدأ وأتنفّس وأتكلّم بلطف — الحِلم من أجمل الأخلاق.', ee:'If my brother upsets me I don\'t explode; I calm down, breathe, and speak gently — forbearance is a beautiful character.',
      da:'«يا حليم، ارزقني الحِلم والهدوء».', de:'"O Forbearing, grant me patience and calm."',
      q:['إذا أغضبني أحد، ماذا يفعل الحليم؟','If someone makes me angry, what does a forbearing person do?',[['يهدأ ويتكلّم بلطف','Calms down and speaks gently',1],['يضرب فورًا','Hits right away',0],['يصرخ بصوتٍ عالٍ','Shouts loudly',0]],'أحسنت! قال النبي ﷺ لأشجّ عبد القيس: «إنّ فيك خصلتين يحبّهما الله: الحِلم والأناة» (رواه مسلم).','Well done! The Prophet ﷺ said to a companion: "You have two qualities Allah loves: forbearance and deliberation" (Muslim).'] },

    /* ── علم وحكمة ── */
    { id:'alim', tg:'ilm', n:'العَلِيمُ', ar:'العليم', en:'Al-Alim — The All-Knowing', sa:'يعلم كلَّ شيء: الظاهر والخفي', se:'Knows everything, seen and unseen',
      ya:'﴿قَالُوا سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنتَ الْعَلِيمُ الْحَكِيمُ﴾', ye:'"They said: Glory be to You! We have no knowledge except what You have taught us. You are the All-Knowing, the All-Wise."', s:['البقرة: ٣٢','Al-Baqarah 2:32'],
      ma:'الله يعلم عدد أوراق الشجر، وقطرات المطر، وما في قلبي قبل أن أقوله. لا يخفى عليه شيء.', me:'Allah knows the number of leaves on the trees, the drops of rain, and what is in my heart before I say it. Nothing is hidden from Him.',
      ea:'أحبّ طلب العلم وأسأل عمّا لا أعرف، وأتذكّر أنّ الله يعلم نيّتي الطيبة.', ee:'I love seeking knowledge and asking about what I don\'t know, remembering that Allah knows my good intention.',
      da:'﴿رَّبِّ زِدْنِي عِلْمًا﴾ (طه: ١١٤).', de:'"My Lord, increase me in knowledge" (Ta-Ha 20:114).',
      q:['هل يعلم الله ما في قلبي؟','Does Allah know what is in my heart?',[['نعم، فهو العليم','Yes — He is the All-Knowing',1],['لا','No',0],['فقط إذا قلته','Only if I say it',0]],'صحيح! الله يعلم السرّ وأخفى.','Correct! Allah knows the secret and what is even more hidden.'] },
    { id:'hakim', tg:'ilm', n:'الحَكِيمُ', ar:'الحكيم', en:'Al-Hakim — The All-Wise', sa:'يضع كلَّ شيء في مكانه الصحيح', se:'Puts everything in its right place',
      ya:'﴿وَهُوَ الْعَزِيزُ الْحَكِيمُ﴾', ye:'"And He is the All-Mighty, the All-Wise."', s:['الحديد: ١','Al-Hadid 57:1'],
      ma:'كلُّ ما خلقه الله فيه حكمة: الليل للراحة، والنهار للعمل، والمطر للزرع. وكلُّ ما أمرنا به خيرٌ لنا.', me:'Everything Allah created has wisdom: the night for rest, the day for work, the rain for crops. And everything He commands us is good for us.',
      ea:'أطيع أوامر الله حتى لو لم أفهم كل الحكمة بعد، لأنّ ربي حكيمٌ لا يأمر إلا بالخير.', ee:'I obey Allah\'s commands even if I don\'t yet understand all the wisdom, because my Wise Lord only commands what is good.',
      da:'«اللهم ارزقني الحكمة وفهم القرآن».', de:'"O Allah, grant me wisdom and understanding of the Quran."',
      q:['لماذا جعل الله الليل؟','Why did Allah make the night?',[['للراحة والنوم — بحكمة','For rest and sleep — with wisdom',1],['بلا سبب','For no reason',0],['للّعب طوال الليل','To play all night',0]],'أحسنت! كلُّ شيءٍ عند الحكيم بحكمة.','Well done! Everything from the All-Wise has wisdom.'] },
    { id:'khabir', tg:'ilm', n:'الخَبِيرُ', ar:'الخبير', en:'Al-Khabir — The All-Aware', sa:'يعلم دقائق الأمور وبواطنها', se:'Aware of the finest, innermost details',
      ya:'﴿أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ﴾', ye:'"Does He who created not know, while He is the Subtle, the All-Aware?"', s:['الملك: ١٤','Al-Mulk 67:14'],
      ma:'الخبير يعرف أدقَّ التفاصيل: يعرف لماذا أبكي، وماذا أحتاج، وما الذي يصلحني — أكثر مما أعرف أنا عن نفسي.', me:'Al-Khabir knows the finest details: why I cry, what I need, and what is good for me — more than I know about myself.',
      ea:'أخبر الله بكل ما يقلقني في دعائي، فهو خبيرٌ بحالي ويسمعني.', ee:'I tell Allah everything that worries me in my dua — He is fully aware of my state and hears me.',
      da:'«يا لطيف يا خبير، أصلح لي شأني كلَّه».', de:'"O Subtle, O All-Aware, set right all my affairs."',
      q:['من يعرف ما يصلحني أكثر من نفسي؟','Who knows what is good for me better than I do?',[['الله الخبير','Allah, Al-Khabir',1],['لا أحد','No one',0],['التلفاز','The TV',0]],'صحيح! الذي خلقنا أعلم بنا.','Correct! The One who created us knows us best.'] },
    { id:'sami', tg:'ilm', n:'السَّمِيعُ', ar:'السميع', en:'As-Sami — The All-Hearing', sa:'يسمع كلَّ صوتٍ ودعاء', se:'Hears every voice and every dua',
      ya:'﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾', ye:'"There is nothing like Him, and He is the All-Hearing, the All-Seeing."', s:['الشورى: ١١','Ash-Shura 42:11'],
      ma:'الله يسمع كلَّ الأصوات معًا: دعائي الهامس، وتسبيح الطيور، ونداء الناس بكل اللغات — ولا يشبهه شيء من خلقه.', me:'Allah hears all voices at once: my whispered dua, the birds\' glorification, people calling in every language — and nothing in creation is like Him.',
      ea:'أقول كلامًا طيبًا فقط، لأنّ ربي يسمعني. وأدعوه بثقة، فهو يسمع حتى الهمس.', ee:'I say only good words, because my Lord hears me. And I call on Him with confidence — He hears even a whisper.',
      da:'﴿رَبَّنَا تَقَبَّلْ مِنَّا ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ﴾ (البقرة: ١٢٧).', de:'"Our Lord, accept from us; You are the All-Hearing, the All-Knowing" (Al-Baqarah 2:127).',
      q:['هل يسمع الله دعائي إذا همستُ به؟','Does Allah hear my dua if I whisper it?',[['نعم، فهو السميع','Yes — He is the All-Hearing',1],['لا، يجب أن أصرخ','No, I must shout',0],['فقط بالعربية','Only in Arabic',0]],'أحسنت! الله يسمع كلَّ دعاء.','Well done! Allah hears every dua.'] },
    { id:'basir', tg:'ilm', n:'البَصِيرُ', ar:'البصير', en:'Al-Basir — The All-Seeing', sa:'يرى كلَّ شيء، في النور والظلام', se:'Sees everything, in light and in darkness',
      ya:'﴿إِنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ﴾', ye:'"Indeed, Allah is All-Seeing of what you do."', s:['البقرة: ١١٠','Al-Baqarah 2:110'],
      ma:'الله يرى النملة السوداء على الصخرة السوداء في الليلة المظلمة! ويرى أعمالي الطيبة حتى لو لم يرها أحد.', me:'Allah sees a black ant on a black rock on a dark night! And He sees my good deeds even if no one else does.',
      ea:'أعمل الخير في السرّ، وأترك الخطأ حتى لو كنت وحدي، لأنّ ربي يراني.', ee:'I do good in secret and avoid wrong even when alone, because my Lord sees me.',
      da:'«يا بصير، اجعلني أعمل ما يرضيك».', de:'"O All-Seeing, make me do what pleases You."',
      q:['أنا وحدي في الغرفة… هل يراني الله؟','I\'m alone in my room… does Allah see me?',[['نعم، فهو البصير','Yes — He is the All-Seeing',1],['لا','No',0],['فقط في النهار','Only in daytime',0]],'صحيح! الله يرانا في كل مكانٍ وزمان.','Correct! Allah sees us everywhere, at every time.'] },
    { id:'raqib', tg:'ilm', n:'الرَّقِيبُ', ar:'الرقيب', en:'Ar-Raqib — The Ever-Watchful', sa:'المطّلع على كل شيء دائمًا', se:'Always watching over everything',
      ya:'﴿إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾', ye:'"Indeed Allah is ever, over you, an Observer."', s:['النساء: ١','An-Nisa 4:1'],
      ma:'الله رقيبٌ علينا في كل لحظة، يحفظنا ويرى أعمالنا. ليس مثل الكاميرا التي تتعطّل — هو لا يغفل أبدًا.', me:'Allah watches over us at every moment, protecting us and seeing our deeds. Not like a camera that can break — He is never unaware.',
      ea:'أراقب نفسي قبل أن أتكلّم أو أفعل: «هل يرضى ربي عن هذا؟»', ee:'I check myself before I speak or act: "Would my Lord be pleased with this?"',
      da:'«اللهم اجعلني أخشاك كأني أراك».', de:'"O Allah, make me mindful of You as if I see You."',
      q:['ما السؤال الذي أسأله لنفسي قبل أن أفعل شيئًا؟','What do I ask myself before doing something?',[['هل يرضى ربي عن هذا؟','Would my Lord be pleased with this?',1],['هل يراني أبي فقط؟','Is only Dad watching?',0],['هل سأُعاقَب الآن؟','Will I be punished now?',0]],'رائع! هذه هي المراقبة.','Great! That is muraqabah — being mindful of Allah.'] },
    { id:'hadi', tg:'ilm', n:'الهَادِي', ar:'الهادي', en:'Al-Hadi — The Guide', sa:'يدلّ عباده على الطريق المستقيم', se:'Guides His servants to the straight path',
      ya:'﴿وَكَفَىٰ بِرَبِّكَ هَادِيًا وَنَصِيرًا﴾', ye:'"And sufficient is your Lord as a Guide and a Helper."', s:['الفرقان: ٣١','Al-Furqan 25:31'],
      ma:'الله هدانا إلى الإسلام، وأرسل لنا النبي ﷺ والقرآن ليدلّنا على الطريق إلى الجنة. ونحن نطلب الهداية في كل صلاة: ﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾.', me:'Allah guided us to Islam and sent us the Prophet ﷺ and the Quran to show the way to Paradise. We ask for guidance in every prayer: "Guide us to the straight path."',
      ea:'أشكر الله أنّه هداني، وأدعو لأصدقائي بالهداية، وأدلّ غيري على الخير.', ee:'I thank Allah for guiding me, pray for my friends\' guidance, and point others towards good.',
      da:'«اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي» (رواه مسلم).', de:'"O Allah, guide me and keep me on the right course" (Muslim).',
      q:['في أيّ سورة نطلب الهداية في كل ركعة؟','In which surah do we ask for guidance in every rak\'ah?',[['الفاتحة','Al-Fatihah',1],['الناس','An-Nas',0],['الكوثر','Al-Kawthar',0]],'صحيح! ﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾.','Correct! "Guide us to the straight path."'] },

    /* ── عطاء ورزق ── */
    { id:'razzaq', tg:'ata', n:'الرَّزَّاقُ', ar:'الرزاق', en:'Ar-Razzaq — The Provider', sa:'يرزق كلَّ المخلوقات', se:'Provides for every creature',
      ya:'﴿إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ﴾', ye:'"Indeed, it is Allah who is the Provider, the Possessor of strength, the Firm."', s:['الذاريات: ٥٨','Adh-Dhariyat 51:58'],
      ma:'من يُطعم السمكة في أعماق البحر؟ ومن يُطعم العصفور في عشّه؟ إنه الله الرزاق. وكلُّ طعامٍ في بيتنا رزقٌ منه.', me:'Who feeds the fish in the deep sea? Who feeds the little bird in its nest? Allah, the Provider. Every bit of food in our home is provision from Him.',
      ea:'لا أُسرف في الطعام ولا أرميه، وأشكر الله بعد الأكل، وأعطي غيري مما رزقني.', ee:'I don\'t waste food or throw it away; I thank Allah after eating and share what He gave me.',
      da:'﴿وَارْزُقْنَا وَأَنتَ خَيْرُ الرَّازِقِينَ﴾ (المائدة: ١١٤).', de:'"And provide for us, for You are the best of providers" (Al-Ma\'idah 5:114).',
      q:['من يُطعم العصفور في عشّه؟','Who feeds the little bird in its nest?',[['الله الرزاق','Allah, the Provider',1],['لا أحد','No one',0],['الشجرة','The tree',0]],'أحسنت! الله يرزق كلَّ مخلوق.','Well done! Allah provides for every creature.'] },
    { id:'wahhab', tg:'ata', n:'الوَهَّابُ', ar:'الوهاب', en:'Al-Wahhab — The Bestower', sa:'يعطي العطايا الكثيرة بلا مقابل', se:'Gives abundant gifts, asking nothing in return',
      ya:'﴿رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ﴾', ye:'"Our Lord, let not our hearts deviate after You have guided us, and grant us mercy from Yourself. You are the Bestower."', s:['آل عمران: ٨','Al Imran 3:8'],
      ma:'الله وهبني عينين أرى بهما، وأذنين أسمع بهما، وأهلًا يحبّونني — كلُّها هدايا بلا ثمن!', me:'Allah gave me eyes to see, ears to hear, and a family who loves me — all gifts, free of charge!',
      ea:'أعطي الهدايا لأصدقائي وأهلي بلا انتظار مقابل، كما يحبّ الوهاب.', ee:'I give gifts to friends and family without expecting anything back, as the Bestower loves.',
      da:'﴿رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ﴾ (آل عمران: ٨).', de:'"Our Lord, let not our hearts deviate after You have guided us, and grant us mercy from Yourself; You are the Bestower" (Al Imran 3:8).',
      q:['اذكر هديةً من الوهاب عندك الآن:','Name a gift from the Bestower you have right now:',[['عيناي وأهلي','My eyes and my family',1],['لا شيء','Nothing',0],['لا أعرف','I don\'t know',0]],'رائع! نِعَم الله لا تُحصى.','Great! Allah\'s blessings cannot be counted.'] },
    { id:'karim', tg:'ata', n:'الكَرِيمُ', ar:'الكريم', en:'Al-Karim — The Most Generous', sa:'كثير الخير والعطاء، يعطي قبل أن نسأل', se:'Abundant in goodness; gives before we even ask',
      ya:'﴿يَا أَيُّهَا الْإِنسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ﴾', ye:'"O mankind, what has deceived you concerning your Lord, the Most Generous?"', s:['الانفطار: ٦','Al-Infitar 6'],
      ma:'الكريم يعطي كثيرًا، ويعطي من لا يستحق، ويستحيي أن يردّ يدي فارغتين إذا دعوته.', me:'Al-Karim gives abundantly, even to those who don\'t deserve it, and is too generous to return my hands empty when I call on Him.',
      ea:'أكون كريمًا: أشارك طعامي، وأُكرم الضيف، وأتصدّق ولو بقليل.', ee:'I am generous: I share my food, honour guests, and give charity even if it\'s little.',
      da:'«إنّ ربكم حييٌّ كريم، يستحيي من عبده إذا رفع يديه إليه أن يردّهما صِفرًا» (رواه أبو داود والترمذي، صحيح).', de:'"Your Lord is Shy and Generous; He is shy, when His servant raises his hands to Him, to return them empty" (Abu Dawud & at-Tirmidhi, sahih).',
      q:['ماذا يفعل الكريم إذا رفعتُ يديّ بالدعاء؟','What does the Most Generous do when I raise my hands in dua?',[['لا يردّهما فارغتين','He doesn\'t return them empty',1],['يتجاهلني','He ignores me',0],['يغضب','He gets angry',0]],'أحسنت! فادعُ ربك دائمًا.','Well done! So always call on your Lord.'] },
    { id:'shakur', tg:'ata', n:'الشَّكُورُ', ar:'الشكور', en:'Ash-Shakur — The Most Appreciative', sa:'يجازي العمل القليل بالأجر الكثير', se:'Rewards a little deed with a great reward',
      ya:'﴿إِنَّ رَبَّنَا لَغَفُورٌ شَكُورٌ﴾', ye:'"Indeed, our Lord is Forgiving and Appreciative."', s:['فاطر: ٣٤','Fatir 35:34'],
      ma:'الشكور يقدّر أصغر عمل: ابتسامة، أو إماطة شوكة عن الطريق، أو شربة ماء لكلبٍ عطشان — ويعطي عليها أجرًا عظيمًا.', me:'Ash-Shakur values the smallest deed: a smile, removing a thorn from the path, water for a thirsty dog — and gives a great reward for it.',
      ea:'لا أحتقر العمل الصغير، وأشكر الناس الذين يساعدونني، فمن لا يشكر الناس لا يشكر الله.', ee:'I never look down on a small deed, and I thank people who help me — whoever doesn\'t thank people doesn\'t thank Allah.',
      da:'«اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ» (رواه أبو داود والنسائي، صحيح).', de:'"O Allah, help me to remember You, thank You, and worship You well" (Abu Dawud & an-Nasa\'i, sahih).',
      q:['رجلٌ سقى كلبًا عطشان، فماذا فعل الله؟','A man gave water to a thirsty dog. What did Allah do?',[['شكر له وغفر له','Appreciated it and forgave him',1],['لم يهتمّ','Didn\'t care',0],['عاقبه','Punished him',0]],'صحيح! «فشكر الله له فغفر له» (رواه البخاري ومسلم).','Correct! "So Allah appreciated it and forgave him" (al-Bukhari & Muslim).'] },
    { id:'hafiz', tg:'ata', n:'الحَفِيظُ', ar:'الحفيظ', en:'Al-Hafiz — The Protector', sa:'يحفظ عباده ويحفظ كلَّ شيء', se:'Protects His servants and preserves all things',
      ya:'﴿إِنَّ رَبِّي عَلَىٰ كُلِّ شَيْءٍ حَفِيظٌ﴾', ye:'"Indeed, my Lord is Guardian over all things."', s:['هود: ٥٧','Hud 11:57'],
      ma:'الله يحفظني في بيتي وفي الطريق وأنا نائم، ويحفظ القرآن من التغيير، ويحفظ السماء أن تقع.', me:'Allah protects me at home, on the road and while I sleep; He preserves the Quran from change and holds the sky from falling.',
      ea:'أحفظ حدود الله فيحفظني، كما قال النبي ﷺ: «احفظ الله يحفظك» (رواه الترمذي، صحيح).', ee:'I guard Allah\'s limits and He guards me, as the Prophet ﷺ said: "Be mindful of Allah and He will protect you" (at-Tirmidhi, sahih).',
      da:'﴿فَاللَّهُ خَيْرٌ حَافِظًا ۖ وَهُوَ أَرْحَمُ الرَّاحِمِينَ﴾ (يوسف: ٦٤).', de:'"Allah is the best Guardian, and He is the Most Merciful of the merciful" (Yusuf 12:64).',
      q:['ما معنى «احفظ الله يحفظك»؟','What does "Be mindful of Allah and He will protect you" mean?',[['أطيع الله فيحميني','I obey Allah and He protects me',1],['أحفظ الألعاب فقط','I only keep my toys safe',0],['لا معنى له','It has no meaning',0]],'أحسنت! من أطاع الله حفظه الله.','Well done! Whoever obeys Allah, Allah protects him.'] },
    { id:'wakil', tg:'ata', n:'الوَكِيلُ', ar:'الوكيل', en:'Al-Wakil — The Trustee', sa:'الذي نسلّم إليه أمورنا ونتوكّل عليه', se:'The One we entrust our affairs to and rely on',
      ya:'﴿وَقَالُوا حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ﴾', ye:'"And they said: Sufficient for us is Allah, and He is the best Trustee."', s:['آل عمران: ١٧٣','Al Imran 3:173'],
      ma:'حين أُلقي إبراهيم عليه السلام في النار قال: «حسبي الله ونعم الوكيل»، فجعل الله النار بردًا وسلامًا.', me:'When Ibrahim (AS) was thrown into the fire he said "Allah is sufficient for me, and He is the best Trustee," and Allah made the fire cool and safe.',
      ea:'أذاكر جيدًا ثم أتوكّل على الله في الامتحان، ولا أقلق كثيرًا.', ee:'I study well, then rely on Allah for the exam, without worrying too much.',
      da:'«حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ» — قالها إبراهيم حين أُلقي في النار (رواه البخاري).', de:'"Hasbunallahu wa ni\'mal-wakil" — Ibrahim said it when thrown into the fire (al-Bukhari).',
      q:['ماذا قال إبراهيم عليه السلام حين أُلقي في النار؟','What did Ibrahim (AS) say when thrown into the fire?',[['حسبي الله ونعم الوكيل','Allah is sufficient for me, the best Trustee',1],['أنا خائف جدًا','I\'m very scared',0],['لم يقل شيئًا','Nothing',0]],'صحيح! فجعلها الله بردًا وسلامًا.','Correct! And Allah made it cool and safe.'] },
    { id:'qarib', tg:'ata', n:'القَرِيبُ', ar:'القريب', en:'Al-Qarib — The Ever-Near', sa:'قريبٌ ممّن يدعوه بعلمه وإجابته', se:'Near to whoever calls Him, in knowledge and response',
      ya:'﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾', ye:'"And when My servants ask you about Me — indeed I am near. I respond to the call of the caller when he calls upon Me."', s:['البقرة: ١٨٦','Al-Baqarah 2:186'],
      ma:'لا أحتاج أن أصرخ ولا أن أذهب بعيدًا لأدعو الله. هو قريبٌ يسمعني ويعلم حالي ويجيبني.', me:'I don\'t need to shout or travel far to call on Allah. He is near — He hears me, knows my state and answers me.',
      ea:'أدعو الله في كل وقت: في السجود، وفي الطريق، وقبل النوم — بكلماتي البسيطة.', ee:'I call on Allah at any time — in sujood, on the road, before bed — in my own simple words.',
      da:'«يا قريب، اجعلني قريبًا منك».', de:'"O Ever-Near, make me close to You."',
      q:['أين يمكنني أن أدعو الله؟','Where can I call on Allah?',[['في أيّ مكانٍ وزمان','Anywhere, any time',1],['في المسجد فقط','Only in the mosque',0],['في رمضان فقط','Only in Ramadan',0]],'أحسنت! الله قريبٌ يجيب الدعاء.','Well done! Allah is near and answers dua.'] },
    { id:'mujib', tg:'ata', n:'المُجِيبُ', ar:'المجيب', en:'Al-Mujib — The Responder', sa:'يستجيب لمن دعاه', se:'Responds to whoever calls upon Him',
      ya:'﴿إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ﴾', ye:'"Indeed, my Lord is Near and Responsive."', s:['هود: ٦١','Hud 11:61'],
      ma:'الله يجيب الدعاء: إمّا أن يعطيني ما طلبت، أو يدفع عني شرًّا، أو يدّخره لي أجرًا في الآخرة. الدعاء لا يضيع أبدًا!', me:'Allah answers dua: He either gives me what I asked, protects me from a harm, or saves it as reward for me in the Hereafter. A dua is never lost!',
      ea:'أدعو ولا أستعجل ولا أيأس، وأستجيب أنا أيضًا حين يناديني أبي وأمي.', ee:'I make dua without rushing or giving up — and I respond quickly when my parents call me, too.',
      da:'﴿رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ﴾ (البقرة: ٢٠١).', de:'"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire" (Al-Baqarah 2:201).',
      q:['هل يضيع الدعاء إذا لم يتحقّق فورًا؟','Is a dua lost if it isn\'t answered right away?',[['لا، الله يجيبه بأفضل طريقة','No — Allah answers it in the best way',1],['نعم يضيع','Yes, it\'s lost',0],['لا أدعو مرةً أخرى','I won\'t pray again',0]],'صحيح! كما أخبر النبي ﷺ في الحديث الذي رواه أحمد بإسنادٍ جيّد.','Correct! As the Prophet ﷺ taught in a hadith narrated by Ahmad with a good chain.'] }
  ];

  /* vary where the right answer sits, so tapping the first option isn't a habit */
  function rot(a, k) { k = k % a.length; return a.slice(k).concat(a.slice(0, k)); }

    title: { ar: 'بطاقات أسماء الله الحسنى', en: 'Names of Allah Cards' },
    intro: { ar: '﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾ — اسمٌ واحد كلَّ أسبوع: نتعرّف عليه، نقرأ آيته، وندعو الله به.', en: '"And to Allah belong the best names, so call upon Him by them" (7:180) — one name a week: meet it, read its verse, and call on Allah by it.' },

    parents: {
      ar: '<h3>اسمٌ واحد في الأسبوع</h3><ul><li><b>السبت:</b> اعرضوا البطاقة، واقرؤوا الاسم وآيته بهدوء.</li><li><b>منتصف الأسبوع:</b> ابحثوا عن «أثر الاسم» في يومكم: مطرٌ نزل (الرزاق)، شفاءٌ من مرض (اللطيف)، خطأٌ تاب منه الطفل (التواب).</li><li><b>الجمعة:</b> ادعوا الله معًا بالاسم، واطلبوا من الطفل أن يرسم شيئًا يذكّره به.</li></ul><h3>منهجٌ سليم في تعليم الأسماء والصفات</h3><ul><li>نُثبت لله ما أثبته لنفسه من الأسماء والصفات، على الوجه اللائق بجلاله، <b>بلا تشبيهٍ بالمخلوقين ولا تعطيل</b>: ﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾.</li><li>تجنّبوا عباراتٍ مثل «الله مثل الأب» أو تصوير الله برسمٍ أو صورة؛ قولوا: «الله يسمعنا، ولا يشبهه أحد».</li><li>اختاروا الأسماء الثابتة في القرآن والسنّة الصحيحة، وتجنّبوا الأسماء غير الثابتة.</li><li>إذا سأل الطفل سؤالًا لا تعرفون جوابه (مثل «أين الله؟» أو «كيف يسمع؟») فأجيبوا بما ورد: ﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾، وأنّ الله يسمع ويرى كما يليق به، وقولوا بصدق: «سنسأل أهل العلم».</li></ul><h3>أنشطة بلا شاشة</h3><ul><li><b>صندوق النِّعم:</b> كلَّ يوم يضع الطفل ورقةً بنعمةٍ رآها، ويربطها باسمٍ من الأسماء.</li><li><b>جولة «سبحان الخالق»:</b> نزهةٌ قصيرة يعدّ فيها الطفل خمسة مخلوقات ويصفها.</li><li><b>لعبة المطابقة:</b> اطبعوا البطاقات، وافصلوا الاسم عن آيته، واطلبوا مطابقتهما.</li></ul><div class="tr-note">💡 الغاية أن يحبّ الطفل ربَّه ويطمئنّ إليه ويعظّمه، لا أن يحفظ قائمةً طويلة. اسمٌ واحد يعيشه الطفل خيرٌ من عشرة يردّدها.</div>',
      en: '<h3>One name a week</h3><ul><li><b>Saturday:</b> show the card and read the name and its verse calmly.</li><li><b>Midweek:</b> look for the name\'s "effect" in your day: rain fell (Ar-Razzaq), recovery from illness (Al-Latif), a mistake the child repented from (At-Tawwab).</li><li><b>Friday:</b> make dua together using the name, and ask your child to draw something that reminds them of it.</li></ul><h3>A sound approach to the names and attributes</h3><ul><li>We affirm for Allah what He affirmed for Himself, in the manner befitting His majesty, <b>without likening Him to creation and without denying</b>: "There is nothing like Him, and He is the All-Hearing, the All-Seeing" (42:11).</li><li>Avoid phrases like "Allah is like a father" or depicting Allah in any picture; say instead: "Allah hears us, and no one is like Him."</li><li>Stick to names established in the Quran and authentic Sunnah.</li><li>If your child asks something you can\'t answer ("Where is Allah?", "How does He hear?"), answer with what is revealed — "The Most Merciful rose over the Throne" (20:5) — that Allah hears and sees as befits Him, and honestly say "We\'ll ask people of knowledge."</li></ul><h3>Screen-free activities</h3><ul><li><b>Blessings box:</b> each day the child drops in a note about a blessing they noticed and links it to a name.</li><li><b>"Glory to the Creator" walk:</b> a short walk where the child counts and describes five creatures.</li><li><b>Matching game:</b> print the cards, separate names from verses, and match them.</li></ul><div class="tr-note">💡 The aim is for the child to love, trust and glorify their Lord — not to memorise a long list. One name truly lived beats ten recited.</div>'
