<script>
/* ════════════════════════════════════════════════════════════════
   أسئلة صعبة وأجوبة مطمئنة — the most common atheist objections to
   Islam, answered for children (≈7–12, ideally with a parent).
   Rules this page keeps:
   • exact Quran wording with surah:ayah; only sahih/hasan hadith with
     the collection and number;
   • no disputed "scientific miracle" claims and no over-claiming about
     science — we separate what science observes from what it can't say;
   • fair to people: never mock, always "a good question deserves a good
     answer".
   Each card: the question → «الجواب باختصار» on the back → an example →
   the evidence → a deeper note for older children → what to say to a
   friend → one check question.
   ════════════════════════════════════════════════════════════════ */
(function () {
  function card(id, icon, tag, title, back, ex, proof, src, older, say, quiz) {
    var secs = [
      { icon: '💡', h: { ar: 'مثالٌ يقرّب الفكرة', en: 'An example to make it clear' }, html: ex },
      { icon: '📖', h: { ar: 'من القرآن والسنة', en: 'From the Quran & Sunnah' }, html: { ar: proof.ar + '<div class="tr-src">📚 ' + src.ar + '</div>', en: proof.en + '<div class="tr-src">📚 ' + src.en + '</div>' } },
      { icon: '🧠', h: { ar: 'للأكبر سنًّا (٩ سنوات فأكثر)', en: 'For older kids (9+)' }, html: older },
      { icon: '💬', h: { ar: 'لو سألك صديق، قل له بلطف', en: 'If a friend asks, kindly say' }, html: say }
    ];
    return { id: id, icon: icon, tag: tag, title: title, back: back, sections: secs, quiz: quiz };
  }
  function q(qa, qe, right, w1, w2, fb) {
    return { q: { ar: qa, en: qe }, opts: [{ t: right, ok: true }, { t: w1 }, { t: w2 }], fb: fb };
  }

  var ITEMS = [

  /* ═════════════ الله والخلق ═════════════ */
  card('who-created-allah', '🌌', 'allah',
    { ar: 'إذا كان كلُّ شيءٍ له خالق، فمن خلق الله؟', en: 'If everything has a creator, who created Allah?' },
    { ar: 'الأشياءُ المخلوقة هي التي تحتاج إلى خالق. أمّا الله فهو <b>الأوّل</b> الذي ليس قبله شيء، لم يُخلَق ولم يبدأ. لو كان للخالق خالق، لاحتاج ذلك إلى خالقٍ آخر بلا نهاية، فلن يوجد شيءٌ أبدًا!', en: 'Created things are the ones that need a creator. Allah is <b>the First</b>, with nothing before Him — He was never created and never began. If the Creator needed a creator, that one would need another, forever — and nothing would ever exist!' },
    { ar: '<p>تخيّل صفًّا من قطع الدومينو تسقط واحدةً بعد الأخرى. لا بدّ أن يكون هناك <b>مَن دفع الأولى</b> وهو ليس قطعة دومينو. لو قلنا: «كلُّ قطعة دفعتها قطعةٌ قبلها» بلا بداية، لما سقطت أيُّ قطعة أصلًا!</p>', en: '<p>Imagine a row of dominoes falling one after another. There must be <b>someone who pushed the first one</b> — and he is not a domino. If every domino needed another domino before it, forever, not a single one would ever fall!</p>' },
    { ar: '﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<br>وقال النبيُّ ﷺ: «يأتي الشيطانُ أحدَكم فيقول: مَن خلق كذا؟ مَن خلق كذا؟ حتى يقول: مَن خلق ربَّك؟ فإذا بلغه فليستعذ بالله ولْيَنتَهِ».', en: '"Say: He is Allah, the One. Allah, the Eternal Refuge. He neither begets nor is born, nor is there any equivalent to Him."<br>The Prophet ﷺ said: "Shaytan comes to one of you and says: Who created this? Who created that? — until he says: Who created your Lord? When he reaches that, let him seek refuge in Allah and stop."' },
    { ar: 'سورة الإخلاص ١١٢: ١–٤ · والحديث: البخاري ٣٢٧٦، ومسلم ١٣٤', en: 'Al-Ikhlas 112:1–4 · Hadith: al-Bukhari 3276, Muslim 134' },
    { ar: '<p>السؤال نفسه فيه خطأ خفيّ: يفترض أن الله «شيءٌ مخلوق» ثم يسأل عن خالقه! هذا مثل أن تسأل: «ما اسمُ زوجة الرجل الأعزب؟». والنبيُّ ﷺ لم يغضب من وجود هذا السؤال في النفس، بل علّمنا أنه <b>وسوسة</b> نردّها بالاستعاذة والتوقّف عن الاسترسال — بعد أن نعرف الجواب.</p>', en: '<p>The question hides a mistake: it assumes Allah is a "created thing" and then asks who created Him! It\'s like asking "What is the name of the bachelor\'s wife?". The Prophet ﷺ didn\'t treat having this thought as a disaster — he taught us it is a <b>whisper</b> we push away by seeking refuge in Allah and not dwelling on it, once we know the answer.</p>' },
    { ar: '«اللهُ هو الأوّلُ الذي لم يُخلَق. لو احتاج الخالقُ إلى خالق، ما وُجد شيءٌ أبدًا.»', en: '"Allah is the First, who was never created. If the Creator needed a creator, nothing would ever exist."' },
    q('لماذا لا يحتاج اللهُ إلى خالق؟', 'Why doesn’t Allah need a creator?', { ar: 'لأنه الأوّلُ الذي ليس قبله شيء، وليس مخلوقًا', en: 'Because He is the First, with nothing before Him — He is not created' }, { ar: 'لأن العلماء لم يكتشفوا ذلك بعد', en: 'Because scientists haven’t found out yet' }, { ar: 'لأن السؤال ممنوع فقط', en: 'Only because the question is forbidden' }, { ar: 'أحسنت! المخلوق يحتاج خالقًا، والله ليس مخلوقًا.', en: 'Well done! Created things need a creator — Allah is not created.' })),

  card('cant-see-allah', '👁️', 'allah',
    { ar: 'كيف نؤمن بالله ونحن لا نراه؟', en: 'How can we believe in Allah when we can’t see Him?' },
    { ar: 'نحن نؤمن بأشياء كثيرة لا نراها لأننا نرى <b>آثارها</b>: الهواء، والجاذبية، وعقلك أنت! وآثارُ الله في كلِّ مكان: في السماء والمطر وجسمك. وعدم رؤيتنا لله الآن جزءٌ من الاختبار، والمؤمنون سيرونه في الجنة.', en: 'We believe in many things we can’t see because we see their <b>effects</b>: air, gravity — even your own mind! Allah’s signs are everywhere: the sky, the rain, your body. Not seeing Him now is part of the test — and believers will see Him in Paradise.' },
    { ar: '<p>هل رأيتَ الريح؟ لا، لكنك ترى الأشجار تتمايل فتعرف أنها موجودة. وهل رأيتَ أفكارك؟ لا، لكنك متأكد أنك تفكّر! وحين ترى بيتًا جميلًا مرتّبًا تعرف أن له بانيًا ولو لم تره.</p>', en: '<p>Have you seen the wind? No — but you see the trees sway and you know it’s there. Have you seen your thoughts? No — but you’re sure you think! When you see a neat, beautiful house you know it has a builder, even if you never met him.</p>' },
    { ar: '﴿لَّا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ ۖ وَهُوَ اللَّطِيفُ الْخَبِيرُ﴾<br>﴿وُجُوهٌ يَوْمَئِذٍ نَّاضِرَةٌ ۝ إِلَىٰ رَبِّهَا نَاظِرَةٌ﴾', en: '"Vision perceives Him not, but He perceives all vision; and He is the Subtle, the Acquainted."<br>"Some faces that Day will be radiant, looking at their Lord."' },
    { ar: 'الأنعام ٦: ١٠٣ · القيامة ٧٥: ٢٢–٢٣', en: 'Al-An‘am 6:103 · Al-Qiyamah 75:22–23' },
    { ar: '<p>طلب موسى عليه السلام أن يرى الله، فقال له ربُّه: ﴿لَن تَرَانِي وَلَٰكِنِ انظُرْ إِلَى الْجَبَلِ﴾، فلمّا تجلّى الله للجبل جعله دكًّا (الأعراف ٧: ١٤٣). أعيننا في الدنيا لا تتحمّل ذلك. ولو رأى الناسُ كلَّ شيء لما كان هناك اختبار، فاللهُ مدح ﴿الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ﴾ (البقرة ٢: ٣).</p>', en: '<p>Musa (peace be upon him) asked to see Allah, and his Lord said: "You will not see Me, but look at the mountain" — and when Allah manifested to it, it crumbled (Al-A‘raf 7:143). Our eyes in this world can’t bear it. And if people saw everything, there would be no test: Allah praises "those who believe in the unseen" (Al-Baqarah 2:3).</p>' },
    { ar: '«أنت لا ترى الهواءَ ولا عقلَك، لكنك متأكد أنهما موجودان من آثارهما. وآثارُ الله في كلّ مكان.»', en: '"You can’t see air or your own mind, but you’re sure they exist from their effects. Allah’s signs are everywhere."' },
    q('كيف نعرف أن الريح موجودة مع أننا لا نراها؟', 'How do we know the wind exists though we can’t see it?', { ar: 'من آثارها، مثل تمايل الأشجار', en: 'From its effects, like trees swaying' }, { ar: 'لا نعرف أبدًا', en: 'We never know' }, { ar: 'لأنها ملوّنة', en: 'Because it is coloured' }, { ar: 'صحيح! وكذلك نعرف الله من آثار خلقه.', en: 'Right! And we know Allah through the signs of His creation.' })),

  card('by-chance', '🧩', 'allah',
    { ar: 'الكون جاء صدفةً بلا خالق!', en: 'The universe came by chance, without a creator!' },
    { ar: 'الصدفة ليست شيئًا يصنع؛ هي مجرّد كلمة نقولها حين لا نعرف السبب. والعقل يقول: كلُّ شيءٍ له بداية لا بدّ له من مُوجِد. والكونُ له بداية، ومنظّمٌ بدقّةٍ مدهشة — والنظام الدقيق يدلّ على حكيمٍ قدير.', en: 'Chance isn’t a thing that makes anything; it’s just a word we use when we don’t know the cause. Reason says: everything that begins must have something that brings it about. The universe had a beginning and is ordered with amazing precision — and precise order points to a Wise, Powerful Maker.' },
    { ar: '<p>لو سكبتَ علبة حروفٍ على الأرض، هل ستتكوّن قصيدةٌ جميلة؟ ولو انتظرتَ ألف سنة؟ وكتابُ خلية واحدة في جسمك (الـDNA) فيه معلومات أكثر من مكتبة كاملة!</p>', en: '<p>If you spilled a box of letters on the floor, would a beautiful poem appear? Even if you waited a thousand years? And the "book" inside one single cell of your body (DNA) holds more information than a whole library!</p>' },
    { ar: '﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾<br>﴿إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾', en: '"Or were they created by nothing, or were they the creators [of themselves]?"<br>"Indeed, all things We created with predestination (in due measure)."' },
    { ar: 'الطور ٥٢: ٣٥ · القمر ٥٤: ٤٩', en: 'At-Tur 52:35 · Al-Qamar 54:49' },
    { ar: '<p>الآية تعرض كلَّ الاحتمالات: إمّا أن نكون جئنا من <b>لا شيء</b> (والعدم لا يصنع شيئًا)، وإمّا أن نكون <b>خلقنا أنفسنا</b> (وكيف يصنع الشيءُ نفسه قبل أن يوجد؟)، فلم يبقَ إلا أن لنا <b>خالقًا</b>. ويلاحظ العلماء اليوم أن قوانين الكون وأرقامه مضبوطة بدقّةٍ كبيرة تسمح بوجود الحياة. أمّا «الانفجار العظيم» فهو حديثٌ عن <b>كيف</b> بدأ الكون، ولا يجيب عن سؤال: <b>مَن</b> أوجده؟</p>', en: '<p>The ayah lists every option: either we came from <b>nothing</b> (and nothing makes nothing), or we <b>made ourselves</b> (how can something make itself before it exists?) — so the only option left is that we have a <b>Creator</b>. Scientists today note that the universe’s laws and numbers are finely set in a way that allows life. As for the "Big Bang", it talks about <b>how</b> the universe began; it doesn’t answer <b>who</b> brought it into being.</p>' },
    { ar: '«الصدفة لا تكتب قصيدة، ولا تبني بيتًا، فكيف تصنع كونًا كاملًا بهذا النظام؟»', en: '"Chance can’t write a poem or build a house — how could it make a whole universe this orderly?"' },
    q('ماذا يعني قول الله ﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ﴾؟', 'What does "Or were they created by nothing?" teach us?', { ar: 'أن الشيء لا يأتي من لا شيء، فلا بدّ من خالق', en: 'Nothing comes from nothing, so there must be a Creator' }, { ar: 'أن الصدفة تصنع كل شيء', en: 'That chance makes everything' }, { ar: 'أن الكون صنع نفسه', en: 'That the universe made itself' }, { ar: 'ممتاز! العدم لا يصنع، والشيء لا يخلق نفسه.', en: 'Excellent! Nothing makes nothing, and nothing creates itself.' })),

  card('evolution', '🧬', 'science',
    { ar: 'يقولون: الكائنات تطوّرت وحدها، فلا حاجة لخالق!', en: 'They say living things evolved by themselves, so no creator is needed!' },
    { ar: 'العلم يدرس <b>كيف</b> تعمل الأشياء وتتغيّر — وهذا لا يتعارض مع الإسلام. لكن وصفَ «كيف» لا يجيب عن «مَن» وضع هذه القوانين وأعطى الحياة. ونحن نؤمن بخبر الله أنه خلق آدم عليه السلام بيده، وأنه أبو البشر جميعًا.', en: 'Science studies <b>how</b> things work and change — that doesn’t clash with Islam. But describing "how" doesn’t answer "<b>who</b>" set these laws and gave life. And we believe what Allah told us: He created Adam (peace be upon him) with His hands, and he is the father of all humans.' },
    { ar: '<p>لو شرح لك مهندسٌ كيف تعمل محرّكات السيارة، فهل يعني ذلك أن السيارة لم يصنعها أحد؟ معرفةُ «كيف يعمل الشيء» لا تُلغي «مَن صنعه»، بل تزيدنا إعجابًا بصانعه.</p>', en: '<p>If an engineer explains how a car engine works, does that mean nobody made the car? Knowing "how it works" never cancels "who made it" — it makes us admire the maker even more.</p>' },
    { ar: '﴿قَالَ يَا إِبْلِيسُ مَا مَنَعَكَ أَن تَسْجُدَ لِمَا خَلَقْتُ بِيَدَيَّ﴾<br>﴿الَّذِي أَعْطَىٰ كُلَّ شَيْءٍ خَلْقَهُ ثُمَّ هَدَىٰ﴾', en: '"[Allah] said: O Iblis, what prevented you from prostrating to that which I created with My hands?"<br>"[He is the One] who gave each thing its form and then guided it."' },
    { ar: 'ص ٣٨: ٧٥ · طه ٢٠: ٥٠', en: 'Sad 38:75 · Ta-Ha 20:50' },
    { ar: '<p>يجب أن نفرّق بين أمرين: (١) ما يشاهده العلماء فعلًا، مثل تكيّف بعض الكائنات وتغيّر صفاتها عبر الأجيال — وهذا من سنن الله في خلقه؛ و(٢) ادّعاء بعض الناس أن ذلك كلَّه حدث «بلا خالق ولا حكمة» — وهذا ليس تجربةً علمية، بل رأيٌ فلسفيّ لا يستطيع المختبر إثباته. أمّا الإنسان فقد أخبرنا الله أنه خلق آدم خلقًا خاصًّا وكرّمه، وهذا خبرٌ صادق نؤمن به.</p>', en: '<p>We must separate two things: (1) what scientists actually observe, like some living things adapting and changing traits over generations — this is part of Allah’s ways in creation; and (2) the claim by some that all of it happened "with no Creator and no wisdom" — that isn’t a lab result but a philosophical opinion no experiment can prove. As for humans, Allah told us He created Adam in a special way and honoured him — a true report we believe.</p>' },
    { ar: '«العلم يشرح كيف تعمل الأشياء، لكنه لا يقول إنه لا يوجد مَن صنعها. والله أخبرنا أنه خلق آدم بيده.»', en: '"Science explains how things work, but it doesn’t say nobody made them. And Allah told us He created Adam with His hands."' },
    q('ماذا يفعل العلم؟', 'What does science do?', { ar: 'يشرح كيف تعمل الأشياء، ولا يُلغي وجودَ صانعها', en: 'Explains how things work — without cancelling their Maker' }, { ar: 'يثبت أنه لا يوجد خالق', en: 'Proves there is no creator' }, { ar: 'يمنع الإيمان بالله', en: 'Forbids believing in Allah' }, { ar: 'أحسنت! «كيف» شيء، و«مَن» شيءٌ آخر.', en: 'Well done! "How" is one question, "who" is another.' })),

  card('science-vs-religion', '🔬', 'science',
    { ar: 'العلم ضدّ الدين، والعلماء لا يؤمنون!', en: 'Science is against religion, and scientists don’t believe!' },
    { ar: 'الإسلام يأمر بالعلم، وأوّلُ كلمةٍ نزلت من القرآن: ﴿اقْرَأْ﴾. وعلماء مسلمون كثيرون صنعوا علومًا ما زال العالم يستفيد منها. وكثيرٌ من العلماء في كلِّ زمان آمنوا بالله، لأن العلم يكشف لنا روعة خلقه.', en: 'Islam commands seeking knowledge — the first word of the Quran revealed was "Read!". Many Muslim scholars built sciences the world still uses. And in every age many scientists have believed in Allah, because science reveals the wonder of His creation.' },
    { ar: '<p>الخوارزمي عالمٌ مسلم أسّس علم الجبر، ومن اسمه جاءت كلمة «خوارزمية» التي تعمل بها الحواسيب اليوم! وابن الهيثم درس الضوء وكيف نرى، وكان يجرّب بنفسه قبل أن يصدّق.</p>', en: '<p>Al-Khwarizmi, a Muslim scholar, founded algebra — and the word "algorithm", which computers run on today, comes from his name! Ibn al-Haytham studied light and how we see, testing things himself before believing them.</p>' },
    { ar: '﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ﴾<br>﴿قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾<br>﴿إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الْأَلْبَابِ﴾', en: '"Read in the name of your Lord who created."<br>"Say: Are those who know equal to those who do not know?"<br>"Indeed, in the creation of the heavens and the earth and the alternation of night and day are signs for those of understanding."' },
    { ar: 'العلق ٩٦: ١ · الزمر ٣٩: ٩ · آل عمران ٣: ١٩٠', en: 'Al-‘Alaq 96:1 · Az-Zumar 39:9 · Aal ‘Imran 3:190' },
    { ar: '<p>العلم التجريبيّ يجيب عن أسئلة «ماذا يحدث؟ وكيف؟» بالتجربة والقياس. أمّا أسئلة مثل: «لماذا نحن هنا؟ وما الصواب والخطأ؟ وماذا بعد الموت؟» فلا يقيسها أيُّ جهاز — وجوابها في الوحي. لذلك يتكاملان ولا يتصادمان: العلم يدرس كتابَ الله المنظور (الكون)، والوحي هو كتابُ الله المقروء.</p>', en: '<p>Experimental science answers "what happens, and how?" through experiments and measurement. But questions like "why are we here? what is right and wrong? what comes after death?" can’t be measured by any device — their answer is in revelation. So the two complete each other: science studies Allah’s visible book (the universe), and revelation is Allah’s recited book.</p>' },
    { ar: '«أوّلُ كلمةٍ في القرآن ﴿اقْرَأْ﴾. العلم يُرينا روعة خلق الله، ولا يتعارض مع الإيمان به.»', en: '"The first word of the Quran was ‘Read!’. Science shows us the wonder of Allah’s creation — it doesn’t clash with believing in Him."' },
    q('ما أوّلُ كلمةٍ نزلت من القرآن؟', 'What was the first word of the Quran revealed?', { ar: 'اقْرَأْ', en: '"Read"' }, { ar: 'نَمْ', en: '"Sleep"' }, { ar: 'اِلْعَبْ', en: '"Play"' }, { ar: 'صحيح! الإسلام دينُ العلم والقراءة.', en: 'Correct! Islam is a religion of knowledge and reading.' })),

  card('why-not-appear', '☁️', 'allah',
    { ar: 'لو كان الله موجودًا، لماذا لا يُظهر نفسه لنا لنؤمن كلّنا؟', en: 'If Allah exists, why doesn’t He show Himself so we all believe?' },
    { ar: 'لأن الدنيا <b>اختبار</b>. لو رأينا كلَّ شيءٍ بأعيننا لآمن الجميع رغمًا عنهم، ولما ظهر الصادقُ من غيره. لكنّ الله لم يتركنا بلا دليل: أعطانا عقلًا وفطرةً، وأرسل الرسل، وملأ الكون بآياته.', en: 'Because this life is a <b>test</b>. If we saw everything with our eyes, everyone would believe without choosing, and the sincere wouldn’t be distinguished from others. But Allah didn’t leave us without proof: He gave us reason and an inner nature (fitrah), sent messengers, and filled the universe with His signs.' },
    { ar: '<p>في الامتحان، لو أعطى المعلّمُ الطلابَ ورقةَ الأجوبة، فهل يبقى امتحان؟ لكنّ المعلّم الطيب يعلّمهم قبله، ويعطيهم الكتاب، ويشرح لهم. وهكذا الله: علّمنا وأرشدنا، ثم ترك لنا الاختيار.</p>', en: '<p>In an exam, if the teacher handed out the answer sheet, would there still be an exam? But a kind teacher teaches beforehand, gives the book, and explains. Allah is like that — and far greater: He taught and guided us, then left us the choice.</p>' },
    { ar: '﴿الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا﴾<br>﴿سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنفُسِهِمْ حَتَّىٰ يَتَبَيَّنَ لَهُمْ أَنَّهُ الْحَقُّ﴾', en: '"[He] who created death and life to test you as to which of you is best in deed."<br>"We will show them Our signs in the horizons and within themselves until it becomes clear to them that it is the truth."' },
    { ar: 'الملك ٦٧: ٢ · فصلت ٤١: ٥٣', en: 'Al-Mulk 67:2 · Fussilat 41:53' },
    { ar: '<p>الإيمان الذي يريده الله هو إيمانُ <b>محبّةٍ واختيار</b>، لا إيمانُ إجبار. ولهذا لا ينفع الإنسانَ إيمانُه إذا رأى العذاب أو طلعت الشمس من مغربها، لأنه صار إيمانًا بلا اختبار. والأدلّة التي أعطانا الله كافيةٌ لمن يبحث بصدق.</p>', en: '<p>The faith Allah wants is faith of <b>love and choice</b>, not compulsion. That’s why faith doesn’t benefit someone once they see the punishment or when the sun rises from the west — it’s no longer a test. The proofs Allah has given are enough for anyone who searches sincerely.</p>' },
    { ar: '«لو رأينا كلَّ شيء لما كان هناك اختبار. والله أعطانا عقلًا ورسلًا وآياتٍ في كلّ مكان.»', en: '"If we saw everything there would be no test. Allah gave us minds, messengers and signs everywhere."' },
    q('لماذا لا نرى الله في الدنيا؟', 'Why don’t we see Allah in this world?', { ar: 'لأن الدنيا اختبار، وأعطانا الله أدلّةً كافية', en: 'Because life is a test, and Allah gave us enough proofs' }, { ar: 'لأنه غير موجود', en: 'Because He doesn’t exist' }, { ar: 'لأنه لا يهتمّ بنا', en: 'Because He doesn’t care about us' }, { ar: 'أحسنت! نؤمن بالغيب بالأدلّة، وسيراه المؤمنون في الجنة.', en: 'Well done! We believe in the unseen through proofs — and believers will see Him in Paradise.' })),

  card('fitrah', '🧭', 'allah',
    { ar: 'أنت مسلمٌ فقط لأن أهلك مسلمون!', en: 'You’re only Muslim because your parents are!' },
    { ar: 'كلُّ طفلٍ يولد على <b>الفطرة</b>: في قلبه معرفةٌ بأن له ربًّا. والأهلُ يعلّمون، لكنّ المسلم مأمورٌ أن <b>يفهم ويتأكّد بنفسه</b> بالعقل والدليل — ولهذا نتعلّم هذه الأجوبة!', en: 'Every child is born upon the <b>fitrah</b>: a heart that knows it has a Lord. Parents teach, but a Muslim is commanded to <b>understand and be sure himself</b>, through reason and proof — that’s exactly why we’re learning these answers!' },
    { ar: '<p>تعلّمتَ من أهلك أن النار تحرق — وهذا صحيح! وحين كبرتَ فهمتَ لماذا. أن تتعلّم شيئًا من أهلك لا يجعله خطأ؛ المهمّ: هل عليه دليل؟ والإسلام عليه أدلّةٌ كثيرة.</p>', en: '<p>You learned from your parents that fire burns — and it’s true! When you grew up, you understood why. Learning something from your parents doesn’t make it wrong; what matters is: is there proof for it? And Islam has many proofs.</p>' },
    { ar: '﴿فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا﴾<br>﴿فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ﴾<br>وقال النبيُّ ﷺ: «كلُّ مولودٍ يُولَد على الفطرة».', en: '"The fitrah of Allah upon which He has created people."<br>"So know that there is no deity except Allah."<br>The Prophet ﷺ said: "Every child is born upon the fitrah."' },
    { ar: 'الروم ٣٠: ٣٠ · محمد ٤٧: ١٩ · الحديث: البخاري ١٣٨٥، ومسلم ٢٦٥٨', en: 'Ar-Rum 30:30 · Muhammad 47:19 · Hadith: al-Bukhari 1385, Muslim 2658' },
    { ar: '<p>القرآن نفسه ذمّ مَن يقول: ﴿إِنَّا وَجَدْنَا آبَاءَنَا عَلَىٰ أُمَّةٍ﴾ (الزخرف ٤٣: ٢٢) — أي مَن يتّبع الآباء بلا تفكير. فالإسلام لا يريدك مقلّدًا، بل مقتنعًا. ولاحظ: هذه الحجّة لو صحّت لانطبقت على الملحد أيضًا، فكثيرٌ منهم أخذ رأيه من بيئته!</p>', en: '<p>The Quran itself criticises those who say "We found our fathers upon a religion" (Az-Zukhruf 43:22) — following parents without thinking. Islam doesn’t want you to be a blind follower but convinced. And notice: if this argument were valid, it would apply to atheists too — many took their view from their surroundings!</p>' },
    { ar: '«أهلي علّموني، لكنّي فهمتُ الأدلّة وتأكّدتُ بنفسي. والقرآن يطلب منّا أن نفكّر.»', en: '"My parents taught me, but I understood the proofs and made sure myself. The Quran asks us to think."' },
    q('ماذا يريد الإسلام من المسلم؟', 'What does Islam want from a Muslim?', { ar: 'أن يفهم ويتأكّد بالدليل، لا أن يقلّد فقط', en: 'To understand and be sure through proof, not just copy' }, { ar: 'ألّا يسأل أبدًا', en: 'Never to ask anything' }, { ar: 'أن يقلّد الناس دائمًا', en: 'Always to copy people' }, { ar: 'رائع! الإيمان عن فهمٍ ويقين.', en: 'Great! Faith with understanding and certainty.' })),

  /* ═════════════ الشرّ والقدر ═════════════ */
  card('evil-pain', '🌧️', 'evil',
    { ar: 'إذا كان الله رحيمًا، فلماذا يوجد الألم والشرّ في العالم؟', en: 'If Allah is merciful, why is there pain and evil in the world?' },
    { ar: 'الدنيا ليست الجنة؛ هي <b>دار اختبار</b> قصيرة. أكثرُ الشرّ يصنعه الناس بظلمهم، والله أعطاهم الاختيار ليحاسبهم بالعدل. وفي الألم حِكَمٌ كثيرة: يقوّينا، ويعلّمنا الصبر والرحمة، ويمحو الذنوب — والعدلُ الكامل يوم القيامة.', en: 'This world isn’t Paradise; it’s a short <b>place of testing</b>. Most evil is done by people through their wrongdoing — Allah gave them choice so He can judge them justly. Pain carries many wisdoms: it strengthens us, teaches patience and mercy, and wipes away sins — and perfect justice comes on the Day of Judgment.' },
    { ar: '<p>الطبيبُ يعطي الطفلَ حقنةً تؤلمه قليلًا، والطفلُ يبكي ولا يفهم. لكنّ أمّه تعرف أنها لمصلحته. نحن لا نرى إلا جزءًا صغيرًا من الصورة، والله يرى الصورة كلّها.</p>', en: '<p>A doctor gives a child an injection that hurts a little; the child cries and doesn’t understand. But his mother knows it’s for his good. We only see a small part of the picture — Allah sees all of it.</p>' },
    { ar: '﴿وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ﴾<br>وقال النبيُّ ﷺ: «عجبًا لأمر المؤمن، إنّ أمره كلَّه خير… إن أصابته سرّاءُ شكر فكان خيرًا له، وإن أصابته ضرّاءُ صبر فكان خيرًا له».', en: '"Perhaps you dislike a thing and it is good for you."<br>The Prophet ﷺ said: "How amazing is the affair of the believer — all of it is good… If something good happens he is grateful, and that is good for him; if something bad befalls him he is patient, and that is good for him."' },
    { ar: 'البقرة ٢: ٢١٦ · الحديث: مسلم ٢٩٩٩', en: 'Al-Baqarah 2:216 · Hadith: Muslim 2999' },
    { ar: '<p>لاحظ شيئًا مهمًّا: لكي يقول أحدٌ «هذا شرٌّ وظلم» يحتاج إلى <b>مقياسٍ ثابت</b> للخير والشرّ. لو لم يكن هناك خالقٌ حكيم، فمِن أين جاء هذا المقياس؟ ولماذا يكون ظلمُ القويّ للضعيف «خطأً» حقًّا؟ فسؤالُ الشرّ نفسه يدلّ على أننا مخلوقون بفطرةٍ تعرف العدل. ولو لم يكن هناك يومُ حساب، لضاع حقُّ كلِّ مظلومٍ مات ولم يُنصَف — والله وعد ألّا يضيع حقّ.</p>', en: '<p>Notice something important: to say "this is evil and unjust" one needs a <b>fixed standard</b> of good and evil. If there were no wise Creator, where would that standard come from? Why would the strong oppressing the weak be truly "wrong"? The question of evil itself shows we were created with a fitrah that knows justice. And if there were no Day of Judgment, every wronged person who died without justice would be lost forever — but Allah promised no right will be lost.</p>' },
    { ar: '«الدنيا اختبارٌ قصير وليست الجنة. أكثر الشرّ من ظلم الناس، والله سيحكم بينهم بالعدل يوم القيامة.»', en: '"This life is a short test, not Paradise. Most evil comes from people’s wrongdoing, and Allah will judge between them with justice on the Day of Judgment."' },
    q('ما الذي يفعله المؤمن إذا أصابه شيءٌ مؤلم؟', 'What does a believer do when something painful happens?', { ar: 'يصبر، فيكون ذلك خيرًا له', en: 'He is patient — and it becomes good for him' }, { ar: 'يترك الإيمان', en: 'He gives up faith' }, { ar: 'يظنّ أن الله لا يحبّه', en: 'He thinks Allah doesn’t love him' }, { ar: 'أحسنت! أمر المؤمن كلّه خير.', en: 'Well done! All of the believer’s affair is good.' })),

  card('children-suffer', '🩹', 'evil',
    { ar: 'لماذا يمرض الأطفال الصغار أو يموتون، وهم لم يفعلوا شيئًا؟', en: 'Why do little children get sick or die when they did nothing wrong?' },
    { ar: 'هذا سؤالٌ يُحزن القلب، والحزنُ عليه رحمةٌ وضعها الله فينا. لكنّ الله لا يظلم أحدًا: الطفلُ الذي يموت صغيرًا مكانُه <b>الجنة</b>، وصبرُ أهله له أجرٌ عظيم، وما يصيب المؤمن من ألمٍ يُكفِّر عنه. والدنيا ليست النهاية.', en: 'This is a question that saddens the heart — and that sadness is a mercy Allah placed in us. But Allah wrongs no one: a child who dies young goes to <b>Paradise</b>, his family’s patience has a great reward, and whatever pain befalls a believer expiates for him. This world isn’t the end.' },
    { ar: '<p>تخيّل طفلًا يسافر من بيتٍ صغير إلى قصرٍ جميلٍ واسع فيه كلُّ ما يحبّ، وينتظر فيه أهله. نحن نبكي لفراقه — وهذا طبيعي — لكنّه انتقل إلى مكانٍ أفضل بكثير.</p>', en: '<p>Imagine a child travelling from a small house to a wide, beautiful palace with everything he loves, where he waits for his family. We cry at the parting — that’s natural — but he moved to a far better place.</p>' },
    { ar: 'لمّا مات إبراهيم ابنُ النبيّ ﷺ وهو رضيع، قال ﷺ: «إنّ له مُرضِعًا في الجنة». ورأى النبيُّ ﷺ إبراهيمَ عليه السلام في الجنة وحوله أطفال، وقال: «وأمّا الوِلدان الذين حوله فكلُّ مولودٍ مات على الفطرة».<br>﴿إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ﴾', en: 'When Ibrahim, the Prophet’s ﷺ baby son, died, he ﷺ said: "He has a wet-nurse in Paradise." And the Prophet ﷺ saw Ibrahim (peace be upon him) in Paradise surrounded by children, and said: "As for the children around him, they are every child who died upon the fitrah."<br>"Indeed, Allah does not do injustice even the weight of an atom."' },
    { ar: 'البخاري ١٣٨٢، و٧٠٤٧ · النساء ٤: ٤٠', en: 'Al-Bukhari 1382 and 7047 · An-Nisa 4:40' },
    { ar: '<p>بكى النبيُّ ﷺ عند موت ابنه إبراهيم وقال: «إنّ العين تدمع، والقلب يحزن، ولا نقول إلا ما يرضي ربَّنا» (البخاري ١٣٠٣). فالحزن ليس ضعفَ إيمان. والمرضُ والموتُ جزءٌ من قوانين هذه الدنيا التي جعلها الله دار ابتلاء، ويوجد فيها الأطباءُ والدواءُ والرحمة. ومَن يرى الحياة الدنيا وحدها يظنّها ظلمًا، أمّا مَن يرى الآخرة فيعرف أن العدل يكتمل هناك.</p>', en: '<p>The Prophet ﷺ wept when his son Ibrahim died and said: "The eyes shed tears and the heart grieves, but we only say what pleases our Lord" (al-Bukhari 1303). So sadness isn’t weak faith. Illness and death are part of the laws of this world, which Allah made a place of trial — and in it He also placed doctors, medicine and mercy. Whoever sees only this life thinks it unfair; whoever sees the Hereafter knows justice is completed there.</p>' },
    { ar: '«الله لا يظلم أحدًا. الطفل الذي يموت صغيرًا في الجنة، وأهلُه الصابرون لهم أجرٌ عظيم.»', en: '"Allah wrongs no one. A child who dies young is in Paradise, and his patient family has a great reward."' },
    q('أين يذهب الطفلُ المسلم إذا مات صغيرًا؟', 'Where does a young Muslim child go if he dies?', { ar: 'إلى الجنة', en: 'To Paradise' }, { ar: 'لا يذهب إلى أيّ مكان', en: 'Nowhere' }, { ar: 'يُعاقَب', en: 'He is punished' }, { ar: 'نعم، كما أخبر النبيُّ ﷺ. والله لا يظلم أحدًا.', en: 'Yes, as the Prophet ﷺ told us. Allah wrongs no one.' })),

  card('qadar-choice', '✍️', 'evil',
    { ar: 'إذا كان الله كتب كلّ شيء، فلماذا يحاسبني؟ أنا مُجبَر!', en: 'If Allah wrote everything, why hold me accountable? I’m forced!' },
    { ar: 'الله <b>يعلم</b> ما ستختاره لأنه يعلم كلّ شيء، لكنّ علمه لا <b>يُجبرك</b>. أنت تختار فعلًا: تقرّر أن تصدق أو تكذب، وتشعر بذلك في نفسك. ولهذا كان الحسابُ عدلًا.', en: 'Allah <b>knows</b> what you will choose because He knows everything — but His knowledge doesn’t <b>force</b> you. You really choose: you decide to tell the truth or lie, and you feel it inside yourself. That’s why accountability is just.' },
    { ar: '<p>المعلّم الخبير يعرف من خبرته أيّ طالبٍ مجتهد سينجح وأيّ طالبٍ مهمل سيرسب. فهل معرفته هي التي جعلت الطالب يرسب؟ لا! الطالب هو الذي أهمل. ولله المثلُ الأعلى: علمُه كاملٌ لا يخطئ، ولا يُجبر أحدًا.</p>', en: '<p>An experienced teacher knows which hard-working student will pass and which careless one will fail. Did his knowledge make the student fail? No! The student neglected his work. And Allah’s example is far higher: His knowledge is perfect and never wrong — and it forces no one.</p>' },
    { ar: '﴿إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا﴾<br>﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾<br>وقال النبيُّ ﷺ: «اعملوا، فكلٌّ ميسَّرٌ لما خُلِق له».', en: '"Indeed, We guided him to the way, be he grateful or ungrateful."<br>"Allah does not burden a soul beyond its capacity."<br>The Prophet ﷺ said: "Work, for each person will be eased towards what he was created for."' },
    { ar: 'الإنسان ٧٦: ٣ · البقرة ٢: ٢٨٦ · الحديث: البخاري ٤٩٤٩، ومسلم ٢٦٤٧', en: 'Al-Insan 76:3 · Al-Baqarah 2:286 · Hadith: al-Bukhari 4949, Muslim 2647' },
    { ar: '<p>لاحظ: الله لا يحاسب الإنسان على ما لا اختيار له فيه — لا على لونه، ولا طوله، ولا على ما فعله ناسيًا أو مُكرَهًا أو وهو مجنون أو طفلٌ صغير. يحاسبه فقط على ما اختاره بإرادته. ولا أحدَ منّا يعرف ما كُتب له، فلا يصحّ أن يحتجّ بالقدر على تركِ الخير؛ بل نعمل، ونسأل الله التوفيق.</p>', en: '<p>Notice: Allah doesn’t hold a person accountable for what he didn’t choose — not his colour or height, nor what he did while forgetting, under compulsion, while insane, or as a small child. He holds him accountable only for what he chose by his own will. And none of us knows what was written for him, so no one can use destiny as an excuse to leave good deeds; we work, and ask Allah for success.</p>' },
    { ar: '«الله يعلم ما سأختار، لكنّه لا يُجبرني. أنا أختار فعلًا، ولهذا الحسابُ عدل.»', en: '"Allah knows what I’ll choose, but He doesn’t force me. I really choose — that’s why accountability is fair."' },
    q('هل علمُ الله بما سنفعله يُجبرنا عليه؟', 'Does Allah’s knowledge of what we’ll do force us to do it?', { ar: 'لا، نحن نختار فعلًا والله يعلم اختيارنا', en: 'No — we really choose, and Allah knows our choice' }, { ar: 'نعم، نحن مثل الآلات', en: 'Yes, we are like machines' }, { ar: 'لا يعلم الله ما سنفعل', en: 'Allah doesn’t know what we’ll do' }, { ar: 'أحسنت! العلمُ شيء والإجبارُ شيءٌ آخر.', en: 'Well done! Knowing is one thing, forcing is another.' })),

  card('why-created', '🌱', 'allah',
    { ar: 'لماذا خلقنا الله؟ هل يحتاج إلى عبادتنا؟', en: 'Why did Allah create us? Does He need our worship?' },
    { ar: 'الله <b>غنيٌّ</b> لا يحتاج إلى أحد؛ لو عبده الناس كلُّهم ما زاد ذلك في ملكه شيئًا. نحن الذين نحتاج إليه. خلقنا لنعرفه ونعبده، وفي ذلك <b>سعادتُنا</b> نحن وراحةُ قلوبنا، ثم الجنة.', en: 'Allah is <b>Self-Sufficient</b> and needs no one; if all people worshipped Him it would add nothing to His kingdom. We are the ones who need Him. He created us to know and worship Him — and in that lies <b>our</b> happiness, our hearts’ peace, and then Paradise.' },
    { ar: '<p>الأمُّ حين تقول لطفلها: «اشرب الماء، ونَم مبكّرًا» — هل تستفيد هي؟ لا، هو المستفيد! والعبادة كذلك: الصلاة راحةٌ لنا، والصدق والرحمة يجعلان حياتنا أجمل.</p>', en: '<p>When a mother tells her child "drink water and sleep early", does she benefit? No — he does! Worship is like that: prayer gives us rest, and truthfulness and mercy make our lives more beautiful.</p>' },
    { ar: '﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾<br>﴿يَا أَيُّهَا النَّاسُ أَنتُمُ الْفُقَرَاءُ إِلَى اللَّهِ ۖ وَاللَّهُ هُوَ الْغَنِيُّ الْحَمِيدُ﴾<br>﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ﴾', en: '"I did not create the jinn and mankind except to worship Me."<br>"O mankind, you are those in need of Allah, while Allah is the Free of need, the Praiseworthy."<br>"Did you think that We created you uselessly and that to Us you would not be returned?"' },
    { ar: 'الذاريات ٥١: ٥٦ · فاطر ٣٥: ١٥ · المؤمنون ٢٣: ١١٥', en: 'Adh-Dhariyat 51:56 · Fatir 35:15 · Al-Mu’minun 23:115' },
    { ar: '<p>العبادة في الإسلام ليست الصلاة فقط؛ هي كلُّ ما يحبّه الله: برُّ الوالدين، وإتقانُ الدراسة، ومساعدةُ المحتاج، والكلمةُ الطيبة. ومَن لا يؤمن بالله يبقى سؤالُه: «لماذا أنا هنا؟» بلا جواب. أمّا المسلم فيعرف أن لحياته معنى وهدفًا.</p>', en: '<p>Worship in Islam isn’t only prayer; it’s everything Allah loves: being good to parents, studying well, helping the needy, a kind word. Someone who doesn’t believe in Allah is left with "why am I here?" unanswered; a Muslim knows his life has meaning and purpose.</p>' },
    { ar: '«الله لا يحتاجنا، نحن نحتاجه. خلقنا لنعرفه ونعبده، وفي ذلك سعادتنا.»', en: '"Allah doesn’t need us — we need Him. He created us to know and worship Him, and in that is our happiness."' },
    q('مَن المستفيد من عبادتنا لله؟', 'Who benefits from our worship of Allah?', { ar: 'نحن، لأن الله غنيٌّ عنّا', en: 'We do — Allah needs nothing from us' }, { ar: 'الله يحتاجها', en: 'Allah needs it' }, { ar: 'لا أحد', en: 'No one' }, { ar: 'صحيح! الله هو الغنيّ الحميد.', en: 'Correct! Allah is the Self-Sufficient, the Praiseworthy.' })),

  /* ═════════════ القرآن والنبي ﷺ ═════════════ */
  card('quran-from-allah', '📖', 'revelation',
    { ar: 'كيف نعرف أن القرآن من عند الله وليس من تأليف إنسان؟', en: 'How do we know the Quran is from Allah, not written by a man?' },
    { ar: 'لأنه <b>تحدّى</b> الناس جميعًا أن يأتوا بسورةٍ مثله فعجزوا — وهم أفصحُ العرب. ولا يوجد فيه تناقض مع أنه نزل في ٢٣ سنة. وحُفظ كما هو حرفًا حرفًا ١٤٠٠ سنة. والنبيُّ ﷺ كان لا يقرأ ولا يكتب.', en: 'Because it <b>challenged</b> all people to produce even one surah like it, and they couldn’t — though they were the most eloquent Arabs. It has no contradictions though revealed over 23 years. It has been preserved letter by letter for 1,400 years. And the Prophet ﷺ couldn’t read or write.' },
    { ar: '<p>اليوم يحفظ القرآنَ كاملًا ملايينُ المسلمين في كلّ العالم، حتى أطفالٌ في عمرك! لو حاول أحدٌ أن يغيّر حرفًا واحدًا لصحّحه له طفلٌ صغير في أيّ مسجد. أيُّ كتابٍ آخر في الدنيا هكذا؟</p>', en: '<p>Today millions of Muslims all over the world have memorised the whole Quran — even children your age! If someone changed a single letter, a small child in any mosque would correct him. What other book in the world is like that?</p>' },
    { ar: '﴿وَإِن كُنتُمْ فِي رَيْبٍ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا بِسُورَةٍ مِّن مِّثْلِهِ﴾<br>﴿أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ ۚ وَلَوْ كَانَ مِنْ عِندِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا﴾<br>﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾', en: '"And if you are in doubt about what We sent down upon Our servant, then produce a surah like it."<br>"Do they not reflect upon the Quran? If it had been from other than Allah, they would have found within it much contradiction."<br>"Indeed, it is We who sent down the Reminder, and indeed, We will be its guardian."' },
    { ar: 'البقرة ٢: ٢٣ · النساء ٤: ٨٢ · الحجر ١٥: ٩', en: 'Al-Baqarah 2:23 · An-Nisa 4:82 · Al-Hijr 15:9' },
    { ar: '<p>توجد مخطوطاتٌ قديمةٌ جدًّا للقرآن، منها «مخطوطة برمنغهام» التي قدّر فحصُ الكربون عُمرَ رَقِّها بأنه يرجع إلى زمنٍ قريبٍ من زمن النبيّ ﷺ، ونصُّها يوافق مصحفنا اليوم. وفي القرآن آياتٌ تعاتب النبيَّ ﷺ نفسه (مثل سورة عبس)، ولو كان هو المؤلف لما عاتب نفسه أمام الناس إلى يوم القيامة.</p>', en: '<p>Very old Quran manuscripts exist, such as the "Birmingham manuscript", whose parchment radiocarbon testing dated close to the Prophet’s ﷺ time — and its text matches our mushaf today. The Quran even contains verses gently correcting the Prophet ﷺ himself (like Surah ‘Abasa); had he been the author, he wouldn’t have corrected himself before people until the end of time.</p>' },
    { ar: '«القرآن تحدّى العالم أن يأتوا بسورةٍ مثله فعجزوا، ومحفوظٌ حرفًا حرفًا، والنبيُّ ﷺ ما كان يقرأ ولا يكتب.»', en: '"The Quran challenged the world to produce a surah like it and they couldn’t; it’s preserved letter by letter; and the Prophet ﷺ couldn’t read or write."' },
    q('ما التحدّي الذي جاء به القرآن؟', 'What challenge did the Quran make?', { ar: 'أن يأتي الناس بسورةٍ مثله', en: 'That people produce a surah like it' }, { ar: 'أن يجروا أسرع من الريح', en: 'That people run faster than the wind' }, { ar: 'أن يكتبوا أطول كتاب', en: 'That people write the longest book' }, { ar: 'أحسنت! ولم يستطع أحدٌ ذلك.', en: 'Well done! And no one could.' })),

  card('prophet-truthful', '🌙', 'revelation',
    { ar: 'كيف نعرف أن محمدًا ﷺ نبيٌّ حقًّا؟', en: 'How do we know Muhammad ﷺ is truly a prophet?' },
    { ar: 'عاش بين قومه ٤٠ سنة يسمّونه <b>«الصادق الأمين»</b>، ولم يكذب قطّ. وجاء بالقرآن وهو لا يقرأ ولا يكتب، وعاش زاهدًا لم يطلب مالًا ولا مُلكًا، وصبر على الأذى. ومَن لا يكذب على الناس، كيف يكذب على الله؟', en: 'He lived among his people for 40 years and they called him <b>"the Truthful, the Trustworthy"</b>; he never lied. He brought the Quran though he couldn’t read or write, lived simply without seeking wealth or kingship, and was patient under harm. Someone who never lied to people — would he lie about Allah?' },
    { ar: '<p>لو كان عندك صديقٌ لم يكذب عليك مرّةً واحدة في ٤٠ سنة، ثم أخبرك بخبرٍ مهمٍّ جدًّا، فهل تصدّقه؟ وأعداءُ النبيّ ﷺ أنفسُهم كانوا يضعون أماناتهم عنده!</p>', en: '<p>If you had a friend who never lied to you once in 40 years, and then he told you something very important — would you believe him? Even the Prophet’s ﷺ enemies kept their valuables with him for safekeeping!</p>' },
    { ar: 'سأل هرقلُ (ملكُ الروم) أبا سفيان — وكان يومها عدوًّا للنبيّ ﷺ: «هل كنتم تتّهمونه بالكذب قبل أن يقول ما قال؟» قال: لا. فقال هرقل: «ما كان ليَذَرَ الكذبَ على الناس ويكذبَ على الله».<br>﴿وَمَا كُنتَ تَتْلُو مِن قَبْلِهِ مِن كِتَابٍ وَلَا تَخُطُّهُ بِيَمِينِكَ﴾', en: 'Heraclius (the Roman emperor) asked Abu Sufyan — at that time an enemy of the Prophet ﷺ: "Did you ever accuse him of lying before he said what he said?" He said: No. Heraclius said: "He would not refrain from lying to people and then lie about Allah."<br>"And you did not recite before it any scripture, nor did you write one with your right hand."' },
    { ar: 'البخاري ٧ · العنكبوت ٢٩: ٤٨', en: 'Al-Bukhari 7 · Al-‘Ankabut 29:48' },
    { ar: '<p>انظر إلى أدلّةٍ مجتمعة: صدقُه قبل النبوّة، وأخلاقُه العالية، ودعوتُه لنفس ما دعا إليه الأنبياء قبله (عبادة الله وحده)، وأنه لم يطلب لنفسه شيئًا من الدنيا — كان ينام على حصيرٍ يؤثّر في جنبه — وأن دعوته انتشرت وبقيت. وقال الله: ﴿فَقَدْ لَبِثْتُ فِيكُمْ عُمُرًا مِّن قَبْلِهِ ۚ أَفَلَا تَعْقِلُونَ﴾ (يونس ١٠: ١٦).</p>', en: '<p>Look at the proofs together: his truthfulness before prophethood, his outstanding character, calling to the very same message as earlier prophets (worship Allah alone), seeking nothing worldly for himself — he slept on a mat that left marks on his side — and his message spreading and lasting. Allah says: "I had remained among you a lifetime before it. Then will you not reason?" (Yunus 10:16).</p>' },
    { ar: '«كان يُلقَّب بالصادق الأمين ٤٠ سنة، وحتى أعداؤه شهدوا أنه لم يكذب. فكيف يكذب على الله؟»', en: '"He was called the Truthful, the Trustworthy for 40 years, and even his enemies testified he never lied. How would he lie about Allah?"' },
    q('بماذا كان قومُ النبيّ ﷺ يلقّبونه قبل النبوّة؟', 'What did his people call the Prophet ﷺ before prophethood?', { ar: 'الصادق الأمين', en: 'The Truthful, the Trustworthy' }, { ar: 'الملك', en: 'The King' }, { ar: 'الغنيّ', en: 'The Rich' }, { ar: 'صحيح! وشهد بذلك حتى أعداؤه.', en: 'Correct! Even his enemies bore witness to it.' })),

  card('many-religions', '🗺️', 'revelation',
    { ar: 'هناك أديان كثيرة، فكيف نعرف أن الإسلام هو الصحيح؟', en: 'There are many religions — how do we know Islam is the right one?' },
    { ar: 'كثرةُ الآراء لا تعني أن كلّها صحيح ولا أن كلّها خطأ. نبحث عن <b>الدليل</b>: الإسلام يدعو لعبادة الله وحده كما دعا كلُّ الأنبياء، وكتابُه محفوظ، ونبيُّه صادقٌ بشهادة أعدائه، وعقائده يقبلها العقل السليم.', en: 'Many opinions don’t mean all are right or all are wrong. We look for <b>proof</b>: Islam calls to worship Allah alone as every prophet did, its Book is preserved, its Prophet was truthful by his enemies’ own testimony, and its beliefs sit well with sound reason.' },
    { ar: '<p>لو قال لك عشرةُ طلّاب عشرةَ أجوبةٍ مختلفة لمسألة حساب: ٢ + ٢، هل نقول «لا يوجد جوابٌ صحيح»؟ لا! نتحقّق بالدليل، فنجد أن الجواب الصحيح واحد.</p>', en: '<p>If ten students gave ten different answers to 2 + 2, would we say "there is no right answer"? No! We check with proof — and find there is one right answer.</p>' },
    { ar: '﴿وَمَا أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدُونِ﴾<br>﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾', en: '"And We sent not before you any messenger except that We revealed to him that there is no deity except Me, so worship Me."<br>"Say: Produce your proof, if you should be truthful."' },
    { ar: 'الأنبياء ٢١: ٢٥ · البقرة ٢: ١١١', en: 'Al-Anbiya 21:25 · Al-Baqarah 2:111' },
    { ar: '<p>الإسلام ليس دينًا «جديدًا» منفصلًا؛ هو الرسالة نفسها التي جاء بها نوح وإبراهيم وموسى وعيسى عليهم السلام: عبادة الله وحده. والمسلم يؤمن بكلّ الأنبياء ويحبّهم. والقرآن يطلب «البرهان» — أي الدليل — ولا يطلب منك أن تؤمن بلا عقل.</p>', en: '<p>Islam isn’t a separate "new" religion; it’s the same message brought by Nuh, Ibrahim, Musa and ‘Isa (peace be upon them): worship Allah alone. A Muslim believes in and loves all the prophets. And the Quran asks for "burhan" — proof — it never asks you to believe without reason.</p>' },
    { ar: '«كثرة الأديان لا تعني أنه لا يوجد حقّ. نبحث بالدليل، والإسلام هو رسالة كلّ الأنبياء: عبادة الله وحده.»', en: '"Many religions doesn’t mean there’s no truth. We look for proof — and Islam is the message of all prophets: worship Allah alone."' },
    q('ماذا كانت رسالة كلّ الأنبياء؟', 'What was the message of all the prophets?', { ar: 'عبادة الله وحده', en: 'Worship Allah alone' }, { ar: 'عبادة الأصنام', en: 'Worship idols' }, { ar: 'لا شيء مشترك بينهم', en: 'They had nothing in common' }, { ar: 'أحسنت! وهذه رسالة الإسلام.', en: 'Well done! And that is the message of Islam.' })),

  /* ═════════════ الدين والأخلاق والمجتمع ═════════════ */
  card('morals-without-god', '⚖️', 'life',
    { ar: 'يمكن أن نكون طيبين بلا دين، فلماذا نحتاج إلى الله؟', en: 'We can be good without religion, so why do we need Allah?' },
    { ar: 'صحيح أن كثيرًا من الناس عندهم أخلاقٌ طيبة — وهذا من <b>الفطرة</b> التي وضعها الله في كلّ إنسان. لكنّ السؤال: من أين جاء مقياسُ الخير والشرّ أصلًا؟ ولماذا يكون الظلم خطأً حقًّا؟ الدين يعطينا مقياسًا ثابتًا، وسببًا لنكون طيبين حتى حين لا يرانا أحد.', en: 'It’s true that many people have good manners — that’s the <b>fitrah</b> Allah placed in every human. But the question is: where does the very standard of good and evil come from? Why is injustice truly wrong? Religion gives a fixed standard, and a reason to be good even when no one is watching.' },
    { ar: '<p>في مباراة كرة قدم بلا حَكَمٍ ولا قوانين، مَن يقرّر أن الفعل خطأ؟ كلُّ فريقٍ سيقول: «أنا على حق!». الإسلام يعطينا القوانين العادلة والحَكَمَ العادل.</p>', en: '<p>In a football match with no referee and no rules, who decides what is a foul? Each team would say "we’re right!". Islam gives us fair rules and a just Judge.</p>' },
    { ar: '﴿وَنَفْسٍ وَمَا سَوَّاهَا ۝ فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا﴾<br>وقال النبيُّ ﷺ: «إنما بُعثتُ لأتمّم صالحَ الأخلاق».', en: '"And [by] the soul and He who proportioned it, and inspired it [with discernment of] its wickedness and its righteousness."<br>The Prophet ﷺ said: "I was only sent to perfect good character."' },
    { ar: 'الشمس ٩١: ٧–٨ · الحديث: أحمد ٨٩٥٢، والبخاري في الأدب المفرد ٢٧٣، وصحّحه الألباني', en: 'Ash-Shams 91:7–8 · Hadith: Ahmad 8952; al-Bukhari, al-Adab al-Mufrad 273; graded sahih by al-Albani' },
    { ar: '<p>نحن لا نقول إن غير المسلم لا يمكن أن يكون أمينًا أو رحيمًا — هذا غير صحيح وغير عادل. نقول: الأخلاق تحتاج إلى <b>أساسٍ</b> يجعلها حقيقيةً وثابتة، لا مجرّد ذوقٍ يتغيّر من شخصٍ لآخر ومن زمنٍ لآخر. والإيمان بالله واليوم الآخر يجعلك أمينًا حتى في غرفةٍ مغلقة لا يراك فيها أحد.</p>', en: '<p>We don’t say a non-Muslim can’t be honest or kind — that’s untrue and unfair. We say morals need a <b>foundation</b> that makes them real and fixed, not just a taste that changes from person to person and age to age. Believing in Allah and the Last Day keeps you honest even in a locked room where no one sees you.</p>' },
    { ar: '«الأخلاق الطيبة من الفطرة التي وضعها الله فينا. والدين يعطينا مقياسًا ثابتًا، ويجعلنا طيّبين حتى حين لا يرانا أحد.»', en: '"Good character comes from the fitrah Allah put in us. Religion gives a fixed standard and keeps us good even when no one sees."' },
    q('من أين جاء حبُّ الخير في قلوب الناس؟', 'Where does love of good in people’s hearts come from?', { ar: 'من الفطرة التي خلقها الله فيهم', en: 'From the fitrah Allah created in them' }, { ar: 'من الصدفة', en: 'From chance' }, { ar: 'من التلفاز', en: 'From television' }, { ar: 'أحسنت! ﴿فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا﴾', en: 'Well done! "And inspired it with its wickedness and its righteousness."' })),

  card('spread-by-sword', '🕊️', 'life',
    { ar: 'يقولون: الإسلام انتشر بالسيف وأجبر الناس!', en: 'They say Islam spread by the sword and forced people!' },
    { ar: 'القرآن يقول بوضوح: ﴿لَا إِكْرَاهَ فِي الدِّينِ﴾. وأكبرُ بلدٍ مسلمٍ اليوم — إندونيسيا — لم يدخلها جيشٌ مسلم، بل أسلم أهلُها لمّا رأوا أخلاقَ التجّار المسلمين. وعاش اليهود والنصارى قرونًا في بلاد المسلمين محافظين على دينهم.', en: 'The Quran says clearly: "There is no compulsion in religion." The largest Muslim country today — Indonesia — was never entered by a Muslim army; its people embraced Islam after seeing the character of Muslim traders. And Jews and Christians lived for centuries in Muslim lands keeping their religion.' },
    { ar: '<p>هل يستطيع أحدٌ أن يُجبرك أن <b>تحبّ</b> شيئًا بقلبك؟ لا! الإيمان في القلب، والقلبُ لا يُجبَر. ولهذا قال الله: لا إكراه في الدين.</p>', en: '<p>Can anyone force you to <b>love</b> something in your heart? No! Faith is in the heart, and the heart can’t be forced. That’s why Allah said: no compulsion in religion.</p>' },
    { ar: '﴿لَا إِكْرَاهَ فِي الدِّينِ ۖ قَد تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ﴾<br>﴿وَقُلِ الْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَاءَ فَلْيُؤْمِن وَمَن شَاءَ فَلْيَكْفُرْ﴾', en: '"There shall be no compulsion in religion; the right course has become clear from the wrong."<br>"And say: The truth is from your Lord, so whoever wills — let him believe; and whoever wills — let him disbelieve."' },
    { ar: 'البقرة ٢: ٢٥٦ · الكهف ١٨: ٢٩', en: 'Al-Baqarah 2:256 · Al-Kahf 18:29' },
    { ar: '<p>نعم، خاض المسلمون معاركَ في التاريخ — كما فعلت كلُّ الدول — لكنّ الحروب كانت مع الجيوش والحكّام، لا لإجبار الناس على تغيير عقيدتهم. والدليل: بقاء الكنائس والمعابد القديمة، وبقاء ملايين النصارى في مصر والشام إلى اليوم، وانتشار الإسلام في بلادٍ كثيرة في أفريقيا وآسيا عن طريق التجارة والعلماء والأخلاق.</p>', en: '<p>Yes, Muslims fought battles in history — as every state has — but wars were with armies and rulers, not to force people to change their beliefs. The proof: old churches and temples still stand, millions of Christians remain in Egypt and the Levant to this day, and Islam spread in many lands of Africa and Asia through trade, scholars and good character.</p>' },
    { ar: '«القرآن يقول: لا إكراه في الدين. وأكبر بلدٍ مسلم اليوم أسلم بالأخلاق والتجارة، لا بالسيف.»', en: '"The Quran says there’s no compulsion in religion. The largest Muslim country today embraced Islam through character and trade, not the sword."' },
    q('ماذا يقول القرآن عن إجبار الناس على الدين؟', 'What does the Quran say about forcing people into religion?', { ar: '﴿لَا إِكْرَاهَ فِي الدِّينِ﴾', en: '"There is no compulsion in religion"' }, { ar: 'يجب إجبارهم', en: 'They must be forced' }, { ar: 'لم يذكر شيئًا', en: 'It says nothing' }, { ar: 'صحيح! الإيمانُ في القلب ولا يُجبَر.', en: 'Correct! Faith is in the heart and can’t be forced.' })),

  card('women', '🌷', 'life',
    { ar: 'يقولون: الإسلام ظلم المرأة!', en: 'They say Islam wronged women!' },
    { ar: 'الإسلام كرّم المرأة: جعل أجرَها عند الله مثل الرجل، وأعطاها حقَّ التعلّم والمِلك والميراث، وجعل برَّ الأمّ من أعظم الأعمال عند الله. والنبيُّ ﷺ قال: «خيرُكم خيرُكم لأهله». وإذا ظلم بعضُ الناس النساء، فهذا خطؤهم هم، لا خطأ الإسلام.', en: 'Islam honoured women: their reward with Allah is like men’s; it gave them the right to learn, own property and inherit; and made kindness to one’s mother among the greatest deeds before Allah. The Prophet ﷺ said: "The best of you are those best to their families." If some people wrong women, that is their mistake, not Islam’s.' },
    { ar: '<p>لو قاد شخصٌ سيارته بسرعةٍ وخالف إشارة المرور، هل نلوم قانونَ المرور؟ لا، نلوم السائق! وهكذا: مَن يظلم المرأة يخالف الإسلام نفسه.</p>', en: '<p>If someone speeds and runs a red light, do we blame the traffic law? No — we blame the driver! Likewise: whoever wrongs a woman is going against Islam itself.</p>' },
    { ar: '﴿مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً﴾<br>وقال النبيُّ ﷺ: «خيرُكم خيرُكم لأهله، وأنا خيرُكم لأهلي»، وقال: «إنما النساءُ شقائقُ الرجال».', en: '"Whoever does righteousness, whether male or female, while a believer — We will surely cause him to live a good life."<br>The Prophet ﷺ said: "The best of you are the best to their families, and I am the best of you to my family," and: "Women are the twin halves of men."' },
    { ar: 'النحل ١٦: ٩٧ · الترمذي ٣٨٩٥ (صحيح) · أبو داود ٢٣٦، والترمذي ١١٣ (حسّنه الألباني)', en: 'An-Nahl 16:97 · At-Tirmidhi 3895 (sahih) · Abu Dawud 236, at-Tirmidhi 113 (graded hasan by al-Albani)' },
    { ar: '<p>قبل الإسلام كان بعضُ العرب يدفنون البنات أحياءً، فحرّم الإسلام ذلك وذمّه في القرآن (التكوير ٨١: ٨–٩). وكانت خديجةُ رضي الله عنها تاجرةً ناجحة، وعائشةُ رضي الله عنها من أعلم الصحابة يتعلّم منها الرجال. وفي الإسلام أحكامٌ تختلف بين الرجل والمرأة، لأن العدل ليس أن يكون كلُّ شيءٍ متطابقًا، بل أن يأخذ كلٌّ ما يناسبه — مع المساواة في الكرامة والأجر.</p>', en: '<p>Before Islam some Arabs buried baby girls alive; Islam forbade it and condemned it in the Quran (At-Takwir 81:8–9). Khadijah (may Allah be pleased with her) was a successful merchant, and ‘A’ishah (may Allah be pleased with her) was among the most learned Companions, with men learning from her. Some rulings in Islam differ between men and women, because justice isn’t making everything identical, but giving each what suits them — with equality in dignity and reward.</p>' },
    { ar: '«الإسلام جعل أجر المرأة مثل الرجل، وأعطاها حقوقها، والنبيُّ ﷺ قال: خيركم خيركم لأهله.»', en: '"Islam made a woman’s reward like a man’s, gave her rights, and the Prophet ﷺ said: the best of you are the best to their families."' },
    q('مَن قال: «خيرُكم خيرُكم لأهله»؟', 'Who said: "The best of you are the best to their families"?', { ar: 'النبيُّ محمد ﷺ', en: 'The Prophet Muhammad ﷺ' }, { ar: 'لم يقلها أحد', en: 'No one said it' }, { ar: 'ملحدٌ مشهور', en: 'A famous atheist' }, { ar: 'أحسنت! والإسلام يأمر بإكرام المرأة.', en: 'Well done! Islam commands honouring women.' })),

  /* ═════════════ الآخرة والدعاء ═════════════ */
  card('afterlife', '🌅', 'akhira',
    { ar: 'لا يوجد شيءٌ بعد الموت؛ نموت وينتهي كلّ شيء!', en: 'There’s nothing after death; we die and that’s the end!' },
    { ar: 'الذي خلقنا أوّلَ مرّةٍ من لا شيء، قادرٌ أن يعيدنا — وهذا أسهل. والعدلُ يحتاج إلى يوم حساب: كم من ظالمٍ مات ولم يُعاقَب، وكم من مظلومٍ لم يأخذ حقّه! لو كان الموت هو النهاية لضاع العدل.', en: 'The One who created us the first time from nothing is able to bring us back — and that is even easier. And justice needs a Day of Reckoning: how many oppressors died unpunished, and how many victims never got their right! If death were the end, justice would be lost.' },
    { ar: '<p>لو صنع نجّارٌ كرسيًّا من الصفر، ثم انكسر، هل يصعب عليه أن يعيد صنعه؟ بل يكون أسهلَ عليه! والله يُحيي الأرضَ الميتة بالمطر كلَّ سنة أمام أعيننا.</p>', en: '<p>If a carpenter made a chair from scratch and it broke, would it be hard for him to make it again? It would be easier! And Allah brings dead land back to life with rain every year before our eyes.</p>' },
    { ar: '﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ ۖ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ ۝ قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ﴾<br>﴿أَمْ نَجْعَلُ الْمُتَّقِينَ كَالْفُجَّارِ﴾', en: '"And he presents for Us an example and forgets his own creation. He says: Who will give life to bones while they are disintegrated? Say: He will give them life who produced them the first time; and He is, of all creation, Knowing."<br>"Or should We treat the righteous like the wicked?"' },
    { ar: 'يس ٣٦: ٧٨–٧٩ · ص ٣٨: ٢٨', en: 'Ya-Sin 36:78–79 · Sad 38:28' },
    { ar: '<p>في قلب كلّ إنسانٍ شوقٌ إلى العدل وإلى البقاء — ونحن نحزن على الظلم حتى لو لم يقع علينا. هذا الشوقُ له جواب: يومٌ يُوفّى فيه كلُّ إنسانٍ عمله. والإيمان بالآخرة يجعل المسلم يعمل الخير ولا ييأس، لأنه يعرف أنّ لا شيءَ يضيع عند الله.</p>', en: '<p>Every human heart longs for justice and for lasting — we grieve over injustice even when it isn’t done to us. That longing has an answer: a Day when everyone is fully repaid for their deeds. Belief in the Hereafter makes a Muslim do good and never despair, knowing nothing is lost with Allah.</p>' },
    { ar: '«مَن خلقنا أوّل مرّة قادرٌ أن يعيدنا. ولو كان الموت هو النهاية لضاع حقُّ كلِّ مظلوم.»', en: '"The One who created us the first time can bring us back. If death were the end, every wronged person’s right would be lost."' },
    q('ما الدليل الذي ذكره القرآن على البعث؟', 'What proof of resurrection does the Quran give?', { ar: 'أن الذي خلقنا أوّلَ مرّة قادرٌ أن يعيدنا', en: 'The One who created us the first time can bring us back' }, { ar: 'لا يوجد دليل', en: 'There is no proof' }, { ar: 'أن الناس لا يموتون', en: 'That people don’t die' }, { ar: 'ممتاز! الإعادة أهون من البدء.', en: 'Excellent! Bringing back is easier than beginning.' })),

  card('hell-unfair', '🔥', 'akhira',
    { ar: 'لماذا يعذّب الله الناس؟ وماذا عن الذين لم يسمعوا عن الإسلام؟', en: 'Why does Allah punish people? And what about those who never heard of Islam?' },
    { ar: 'الله <b>عدلٌ</b> لا يظلم أحدًا، و<b>رحمتُه سبقت غضبه</b>. لا يعاقب أحدًا لم تبلغه الرسالة بوضوح. والعقابُ لمن عرف الحقَّ وعانده وظلم — كما يعاقب القاضي العادلُ المجرمَ حتى يأخذ المظلومُ حقَّه.', en: 'Allah is <b>Just</b> and wrongs no one, and <b>His mercy outstrips His anger</b>. He doesn’t punish anyone whom the message didn’t clearly reach. Punishment is for those who knew the truth, stubbornly rejected it and did wrong — just as a fair judge punishes a criminal so the victim gets his right.' },
    { ar: '<p>هل نحبّ قاضيًا يترك اللصّ والظالم بلا عقاب؟ لا، هذا ظلمٌ للمظلومين! لكن القاضي العادل لا يعاقب طفلًا لا يعرف القانون. والله أعدلُ العادلين وأرحمُ الراحمين.</p>', en: '<p>Would we like a judge who lets thieves and oppressors go free? No — that’s unfair to the victims! But a fair judge doesn’t punish a child who didn’t know the law. And Allah is the most just of judges and the most merciful of the merciful.</p>' },
    { ar: '﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا﴾<br>وقال النبيُّ ﷺ: قال الله تعالى: «إنّ رحمتي سبقت غضبي».', en: '"And never would We punish until We sent a messenger."<br>The Prophet ﷺ said that Allah said: "My mercy outstrips My anger."' },
    { ar: 'الإسراء ١٧: ١٥ · الحديث: البخاري ٧٤٢٢ بهذا اللفظ، ومسلم ٢٧٥١ بلفظ «إنّ رحمتي تغلب غضبي»', en: 'Al-Isra 17:15 · Hadith: al-Bukhari 7422 (this wording); Muslim 2751 with the wording "My mercy prevails over My anger"' },
    { ar: '<p>الذين لم تبلغهم الرسالة — أو بلغتهم مشوّهةً لا تقوم بها الحجّة — أمرُهم إلى الله العدل؛ وقد ورد في أحاديث أنّ منهم مَن يُمتحَن يوم القيامة (رواه أحمد وغيره، وصحّحه جماعةٌ من العلماء). ودورُنا نحن ليس أن نحكم على الناس، بل أن نبلّغ الحقّ بالحكمة والأخلاق الحسنة، وندعو للناس بالهداية.</p>', en: '<p>Those whom the message never reached — or reached so distorted that the proof wasn’t established — their matter is with Allah, the Just; hadiths mention that some of them will be tested on the Day of Judgment (reported by Ahmad and others; graded authentic by a number of scholars). Our role isn’t to judge people, but to convey the truth with wisdom and good character, and pray for people’s guidance.</p>' },
    { ar: '«الله عادلٌ ورحمته سبقت غضبه، ولا يعاقب مَن لم تبلغه الرسالة. ودوري أن أكون قدوةً حسنة، لا أن أحكم على الناس.»', en: '"Allah is just and His mercy outstrips His anger; He doesn’t punish those the message didn’t reach. My role is to be a good example, not to judge people."' },
    q('هل يعاقب الله مَن لم تبلغه الرسالة؟', 'Does Allah punish those whom the message never reached?', { ar: 'لا، ﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا﴾', en: 'No — "never would We punish until We sent a messenger"' }, { ar: 'نعم، دائمًا', en: 'Yes, always' }, { ar: 'لا أحد يعرف أيّ شيء', en: 'No one knows anything' }, { ar: 'أحسنت! الله عدلٌ ورحيم.', en: 'Well done! Allah is just and merciful.' })),

  card('dua-not-answered', '🤲', 'akhira',
    { ar: 'دعوتُ الله ولم يحدث ما طلبت، فهل الدعاء لا يُستجاب؟', en: 'I prayed to Allah and didn’t get what I asked — is dua not answered?' },
    { ar: 'كلُّ دعاءٍ صادقٍ يُستجاب، لكن بإحدى <b>ثلاث طرق</b>: إمّا أن يعطيك الله ما طلبت، أو يدّخر لك أجرَه في الآخرة، أو يمنع عنك شرًّا بمثله. والله يعطيك ما هو خيرٌ لك، لا ما تظنّه أنت خيرًا فقط.', en: 'Every sincere dua is answered — in one of <b>three ways</b>: Allah gives you what you asked, or saves its reward for you in the Hereafter, or turns away a harm from you of the same size. Allah gives you what is truly best for you, not only what you think is best.' },
    { ar: '<p>لو طلب طفلٌ صغير من أمّه سكّينًا حادّة ليلعب بها، هل تعطيه؟ لا، لأنها تحبّه! وتعطيه شيئًا أفضل. ونحن أحيانًا نطلب أشياء لا نعرف أنها تضرّنا.</p>', en: '<p>If a small child asked his mother for a sharp knife to play with, would she give it? No — because she loves him! She gives him something better. Sometimes we ask for things without knowing they’d harm us.</p>' },
    { ar: '﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾<br>وقال النبيُّ ﷺ: «ما من مسلمٍ يدعو بدعوةٍ ليس فيها إثمٌ ولا قطيعةُ رحم، إلا أعطاه الله بها إحدى ثلاث: إمّا أن تُعجَّل له دعوتُه، وإمّا أن يدّخرها له في الآخرة، وإمّا أن يصرف عنه من السوء مثلها».', en: '"And your Lord says: Call upon Me; I will respond to you."<br>The Prophet ﷺ said: "No Muslim makes a dua with no sin or cutting of family ties in it, except that Allah gives him one of three: either his dua is answered quickly, or it is stored for him in the Hereafter, or an equal harm is turned away from him."' },
    { ar: 'غافر ٤٠: ٦٠ · الحديث: أحمد ١١١٣٣، وصحّحه الألباني (صحيح الأدب المفرد ٥٤٧)', en: 'Ghafir 40:60 · Hadith: Ahmad 11133; graded sahih by al-Albani (Sahih al-Adab al-Mufrad 547)' },
    { ar: '<p>والدعاءُ نفسه عبادةٌ وراحة، حتى قبل أن يتحقّق ما نطلب: نشعر أن لنا ربًّا قريبًا يسمعنا. ومن آداب الدعاء ألّا نستعجل؛ قال النبيُّ ﷺ: «يُستجاب لأحدكم ما لم يَعجَل، يقول: دعوتُ فلم يُستجَب لي» (البخاري ٦٣٤٠، ومسلم ٢٧٣٥).</p>', en: '<p>Dua itself is worship and comfort, even before what we ask for happens: we feel we have a near Lord who hears us. One manner of dua is not to be hasty; the Prophet ﷺ said: "You will be answered as long as you are not hasty, saying: I prayed but was not answered" (al-Bukhari 6340, Muslim 2735).</p>' },
    { ar: '«الدعاء يُستجاب دائمًا بإحدى ثلاث: يعطيك الله ما طلبت، أو يدّخر لك أجره، أو يحميك من شرّ.»', en: '"Dua is always answered in one of three ways: you get what you asked, its reward is saved for you, or you’re protected from a harm."' },
    q('بكم طريقةٍ يستجيب الله الدعاء؟', 'In how many ways does Allah answer dua?', { ar: 'ثلاث طرق', en: 'Three ways' }, { ar: 'طريقة واحدة فقط', en: 'Only one way' }, { ar: 'لا يستجيب أبدًا', en: 'He never answers' }, { ar: 'صحيح! يعطي، أو يدّخر، أو يصرف السوء.', en: 'Correct! He gives, saves the reward, or turns away harm.' })),

  card('reason-enough', '🧠', 'life',
    { ar: 'عقلي يكفيني، ولا أحتاج إلى دين!', en: 'My mind is enough — I don’t need religion!' },
    { ar: 'العقلُ نعمةٌ عظيمة من الله، والإسلام يمدحه ويخاطبه. لكنّ العقل مثلُ <b>العين</b>: تحتاج إلى <b>نور</b> لترى. يعرف العقلُ أن لنا خالقًا، لكنّه وحده لا يعرف ماذا يريد منّا الخالق، ولا ماذا بعد الموت — وهذا ما يخبرنا به الوحي.', en: 'The mind is a great blessing from Allah, and Islam praises it and addresses it. But the mind is like the <b>eye</b>: it needs <b>light</b> to see. Reason can know we have a Creator, but on its own it can’t know what the Creator wants from us or what comes after death — that’s what revelation tells us.' },
    { ar: '<p>عينك قويّة، لكن في غرفةٍ مظلمةٍ تمامًا لا ترى شيئًا. هل تقول: «عيني تكفيني، لا أحتاج إلى مصباح»؟ العقل هو العين، والوحي هو النور.</p>', en: '<p>Your eyes are strong, but in a pitch-dark room you see nothing. Would you say "my eyes are enough, I don’t need a lamp"? Reason is the eye; revelation is the light.</p>' },
    { ar: '﴿كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَعْقِلُونَ﴾<br>﴿قَدْ جَاءَكُم مِّنَ اللَّهِ نُورٌ وَكِتَابٌ مُّبِينٌ﴾', en: '"Thus Allah makes clear to you His verses that you might use reason."<br>"There has come to you from Allah a light and a clear Book."' },
    { ar: 'البقرة ٢: ٢٤٢ · المائدة ٥: ١٥', en: 'Al-Baqarah 2:242 · Al-Ma’idah 5:15' },
    { ar: '<p>تتكرّر في القرآن عبارات: «أفلا تعقلون؟»، «لعلّكم تتفكّرون». فالإسلام لا يطلب منك أن تُطفئ عقلك. لكن عقول الناس تختلف وتخطئ وتتأثّر بالهوى؛ لو كان العقل وحده يكفي لما اختلف العقلاء في كلّ شيء. ولهذا رحمنا الله بالوحي: يهدي العقلَ ولا يلغيه.</p>', en: '<p>The Quran repeats: "Will you not reason?", "so that you may reflect". Islam never asks you to switch off your mind. But people’s minds differ, err and are swayed by desires; if reason alone were enough, wise people wouldn’t disagree about everything. So Allah mercifully sent revelation: it guides reason, it doesn’t cancel it.</p>' },
    { ar: '«العقل مثل العين، والوحي مثل النور. العين القويّة لا ترى في الظلام.»', en: '"Reason is like the eye and revelation like the light. Even strong eyes can’t see in the dark."' },
    q('ما علاقة العقل بالوحي؟', 'How do reason and revelation relate?', { ar: 'العقل كالعين، والوحي كالنور يهديها', en: 'Reason is like the eye, revelation like the light guiding it' }, { ar: 'الوحي يلغي العقل', en: 'Revelation cancels reason' }, { ar: 'لا علاقة بينهما', en: 'They have nothing to do with each other' }, { ar: 'رائع! يتكاملان ولا يتعارضان.', en: 'Great! They complete each other, never clash.' }))
  ];

    parents: {
      ar: '<h3>🛡️ لماذا هذه الصفحة؟</h3><p>أطفالنا اليوم يسمعون هذه الأسئلة مبكّرًا: من صديق في المدرسة، أو من فيديو قصير، أو من لعبة. الطفل الذي سمع السؤالَ أوّلَ مرّةٍ من أهله <b>مع جوابه</b> يكون أكثر طمأنينة ممّن فاجأه السؤال وحده. والهدف ليس تعليمَ الطفل الشبهات، بل <b>بناءُ يقينٍ هادئ</b> وطريقةِ تفكيرٍ سليمة.</p><h3>📏 حسب العمر</h3><ul><li><b>٤–٧ سنوات:</b> لا نفتح الشبهات. نبني الأساس: حبّ الله، والتأمّل في خلقه، وقصص الأنبياء. وإذا سأل الطفلُ سؤالًا من هذه، نجيب بجملة «قلها لصديقك» فقط.</li><li><b>٨–١٠ سنوات:</b> بطاقةٌ واحدة في الأسبوع: الجواب المختصر + المثال + الدليل.</li><li><b>١١ سنة فأكثر:</b> أضيفوا قسم «للأكبر سنًّا»، وتحاوروا: «كيف تردّ أنت؟».</li></ul><h3>💚 كيف نتعامل مع سؤال الطفل؟</h3><ol><li><b>امدح السؤال:</b> «سؤالٌ ذكيّ! أحبّ أنك سألتني أنا». لا تغضب ولا تتّهمه — الغضب يجعله يسأل غيرك.</li><li><b>اسأله أوّلًا:</b> «من أين سمعته؟ وماذا تظنّ أنت؟» لتعرف حجم السؤال الحقيقي.</li><li><b>أجب بقدر السؤال:</b> جملةٌ أو مثالٌ واحد يكفي الصغير.</li><li><b>«لا أعرف، لنبحث معًا»</b> جوابٌ ممتاز وصادق، ثم ارجعوا إلى أهل العلم الموثوقين.</li><li><b>علّمه هديَ النبيّ ﷺ في الوساوس:</b> يستعيذ بالله، ثم يترك الاسترسال، ويشغل نفسه بالنافع.</li><li><b>اجعل البيت مكانًا آمنًا للأسئلة</b> — فهو خيرٌ من الإنترنت.</li></ol><h3>⚠️ احذر</h3><ul><li>السخرية من أصحاب الشبهات أو من غير المسلمين؛ نحن نردّ الفكرة لا نهين الشخص.</li><li>المبالغة في «الإعجاز العلمي» أو ذكر معلوماتٍ غير مؤكّدة؛ الجواب الضعيف يضرّ أكثر ممّا ينفع.</li><li>تركُ الطفل وحده مع مقاطع النقاش والجدل على الإنترنت.</li></ul><div class="tr-note">📚 الأدلّة في هذه البطاقات من القرآن الكريم والأحاديث الصحيحة والحسنة مع ذكر مصادرها. ونوصي بمراجعتها مع طالب علمٍ موثوق، وبالرجوع إلى أهل العلم في أيّ سؤالٍ أعمق.</div>',
      en: '<h3>🛡️ Why this page?</h3><p>Today our children hear these questions early: from a school friend, a short video, or a game. A child who first hears the question from their parents <b>together with its answer</b> is far calmer than one surprised by the question alone. The aim isn’t to teach doubts, but to <b>build calm certainty</b> and a sound way of thinking.</p><h3>📏 By age</h3><ul><li><b>4–7:</b> don’t open doubts. Build the foundation: love of Allah, reflecting on His creation, stories of the prophets. If the child asks one of these, answer with the "tell your friend" sentence only.</li><li><b>8–10:</b> one card a week: short answer + example + proof.</li><li><b>11+:</b> add the "older kids" section and discuss: "how would you answer?".</li></ul><h3>💚 How to handle a child’s question</h3><ol><li><b>Praise the question:</b> "Smart question! I’m glad you asked me." Don’t get angry or accuse — anger makes them ask someone else.</li><li><b>Ask first:</b> "Where did you hear it? What do you think?" to learn the real size of the question.</li><li><b>Answer to the size of the question:</b> one sentence or example is enough for little ones.</li><li><b>"I don’t know — let’s find out together"</b> is an excellent, honest answer; then consult trustworthy scholars.</li><li><b>Teach the Prophet’s ﷺ guidance on whispers:</b> seek refuge in Allah, stop dwelling, and get busy with something beneficial.</li><li><b>Make home a safe place for questions</b> — far better than the internet.</li></ol><h3>⚠️ Avoid</h3><ul><li>Mocking people with doubts or non-Muslims; we answer ideas, we don’t insult people.</li><li>Exaggerated "scientific miracle" claims or unverified information; a weak answer harms more than it helps.</li><li>Leaving the child alone with online debate videos.</li></ul><div class="tr-note">📚 The proofs on these cards are from the Quran and authentic (sahih/hasan) hadith with sources. We recommend reviewing them with a trustworthy student of knowledge, and consulting scholars for any deeper question.</div>'
