        '<li><b>صندوق المواقف:</b> اكتبوا أسماء القصص على أوراق صغيرة، واسحبوا واحدة كلّ ليلة قبل النوم.</li></ul>' +
        '<div class="tr-note">📚 جميع المواقف هنا من أحاديث صحيحة، والمصدر مذكور في نهاية كلّ قصّة. الربط القصصي بين الأحداث من صياغتنا لتقريبها للأطفال، أمّا ما نُسب إلى النبيّ ﷺ من كلام فهو بلفظ الرواية أو بمعناها الواضح.</div>',
      en: '<h3>How to tell the Prophet\'s ﷺ moments to our children</h3><ul>' +
        '<li><b>One story per sitting</b> is enough. A short story that is understood beats five that are forgotten.</li>' +
        '<li><b>Pause before the ending</b> and ask: "What do you think the Prophet ﷺ did?" then "What would you have done?" — let the child think before you reveal it.</li>' +
        '<li>Read in a calm, warm voice, and show the characters\' feelings (Abu Umayr\'s sadness, Anas\'s joy) without overdoing it.</li>' +
        '<li><b>No fear tactics:</b> the goal is for the child to love the Prophet ﷺ and follow him, not to be afraid. Focus on the mercy and beauty in each moment.</li>' +
        '<li>Link the story to a real moment in the child\'s day: "Remember how the Prophet ﷺ smiled at the Bedouin? Shall we try that with your brother?"</li>' +
        '<li>Send salawat on the Prophet ﷺ whenever his name is mentioned, so the child picks up the habit from you.</li></ul>' +
        '<h3>Screen-free activities</h3><ul>' +
        '<li><b>Act it out:</b> hand out roles (Anas, the children in the market…) and act out the story with puppets or yourselves.</li>' +
        '<li><b>"Manner of the week" board:</b> choose one manner (gentleness, forgiveness, mercy to animals) and add a star each time a family member practices it.</li>' +
        '<li><b>Story jar:</b> write the story names on slips of paper and draw one each night before bed.</li></ul>' +
        '<div class="tr-note">📚 All moments here come from authentic hadiths; the source is given at the end of each story. The narrative linking is our own wording to bring it close to children; words attributed to the Prophet ﷺ follow the narration\'s wording or its clear meaning.</div>'
    },
