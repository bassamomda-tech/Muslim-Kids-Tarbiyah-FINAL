<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاني الأذكار والأدعية | Meanings of Adhkar & Duas</title>
<meta name="description" content="بطاقات مجانية لأذكار الطفل اليومية: النصّ، معاني الكلمات، ماذا أقول لربّي، ومتى أقوله — مع يومي مع الأذكار ونسخة للطباعة.">
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Nunito:wght@400;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tr.css">
<style>
  /* «يومي مع الأذكار» — calm vertical timeline */
  .dz-line{position:relative;max-width:620px;margin:0 auto;padding-inline-start:2.2rem}
  .dz-line::before{content:'';position:absolute;top:.6rem;bottom:.6rem;inset-inline-start:.95rem;width:3px;border-radius:3px;background:var(--line)}
  .dz-stop{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:.8rem 1rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
  .dz-stop::before{content:attr(data-ic);position:absolute;inset-inline-start:-2.2rem;top:.6rem;width:2rem;height:2rem;border-radius:50%;background:var(--paper);border:2px solid var(--acc);display:grid;place-items:center;font-size:1rem}
  .dz-stop h4{color:var(--acc);font-size:1rem;margin-bottom:.15rem}
  .dz-stop .when{color:var(--muted);font-size:.85rem;margin-bottom:.4rem}
  .dz-links{display:flex;flex-wrap:wrap;gap:.4rem}
  .dz-links button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.3rem .8rem;font-weight:700;font-size:.88rem;color:var(--ink)}
  .dz-links button:hover,.dz-links button:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
  .dz-links button.done::after{content:' ⭐'}
</style>
</head>
<body>
<div id="tr-root"></div>
<script>
/* Meanings of adhkar & duas — only authentic (sahih/hasan) narrations or Quran.
   Each card: exact text · word meanings · whole meaning in kid language ·
   when to say it and what happens (only rewards that are authentically reported). */
(function () {
  function B(a, e) { return { ar: a, en: e }; }
  function W(list) { /* [[wordAr, meaningAr, wordEn, meaningEn], …] */
    return B('<ul>' + list.map(function (x) { return '<li><b>' + x[0] + '</b>: ' + x[1] + '</li>'; }).join('') + '</ul>',
             '<ul>' + list.map(function (x) { return '<li><b>' + x[2] + '</b>: ' + x[3] + '</li>'; }).join('') + '</ul>');
  }
  /* rotate options by a stable per-card amount so the right answer isn't always first */
  function rot(a, id) { var n = 0; for (var i = 0; i < id.length; i++) n += id.charCodeAt(i); n = n % a.length; return a.slice(n).concat(a.slice(0, n)); }
  function D(o) {
    return {
      id: o.id, tag: o.tag, icon: o.icon, title: o.title, sub: o.sub, matn: o.matn, source: o.src,
      sections: [
        { icon: '🔤', h: B('معاني الكلمات', 'Word meanings'), html: W(o.words) },
        { icon: '💡', h: B('ماذا أقول لربّي؟', 'What am I telling my Lord?'), html: o.mean },
        { icon: '🌱', h: B('متى أقوله وماذا يحدث؟', 'When do I say it, and what happens?'), html: o.when }
      ],
      quiz: { q: o.q[0], opts: rot(o.q[1].map(function (x) { return { t: B(x[0], x[1]), ok: !!x[2] }; }), o.id), fb: o.q[2] }
    };
  }

  var ITEMS = [
    /* ───────── صباح ومساء ───────── */
    D({ id: 'morning', tag: 'morning', icon: '🌅',
      title: B('أذكار الصباح والمساء', 'Morning & evening'), sub: B('أبدأ يومي مع الله', 'I start my day with Allah'),
      matn: B('اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.<br><small>(وفي المساء: اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ)</small>',
        'O Allah, by You we enter the morning, by You we enter the evening, by You we live, by You we die, and to You is the resurrection.<br><small>(In the evening: …and to You is the final return.)</small>'),
      src: B('رواه أبو داود والترمذي، وقال: حسن', 'Abu Dawud & Tirmidhi (hasan)'),
      words: [['بِكَ أَصْبَحْنَا', 'بفضلك ونعمتك جاء علينا الصباح', 'By You we enter the morning', 'by Your grace the morning came to us'],
              ['النُّشُورُ', 'القيام من القبور يوم القيامة', 'Resurrection', 'rising again on the Day of Judgement'],
              ['الْمَصِيرُ', 'المرجع والنهاية', 'Final return', 'where everything ends up']],
      mean: B('يا ربّي، أنت الذي أعطيتني هذا الصباح الجميل. كلُّ يومي منك وبك، وأنا راجعٌ إليك.', 'O my Lord, You gave me this beautiful morning. My whole day is from You and with You, and I will return to You.'),
      when: B('بعد صلاة الفجر وفي أوّل الصباح، وفي المساء بعد العصر أو المغرب. أبدأ يومي وأنا أتذكّر أنّ الله معي.', 'After Fajr in the early morning, and in the evening after Asr or Maghrib. I start my day remembering that Allah is with me.'),
      q: [B('متى نقول «بِكَ أَصْبَحْنَا»؟', 'When do we say "by You we enter the morning"?'), [['في الصباح', 'In the morning', 1], ['عند الأكل فقط', 'Only when eating'], ['عند الغضب', 'When angry']]] }),

    D({ id: 'bismillah-protect', tag: 'morning', icon: '🛡️',
      title: B('ذكر الحماية', 'The protection dhikr'), sub: B('ثلاث مرّات صباحًا ومساءً', 'Three times, morning & evening'),
      matn: B('بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ.', 'In the name of Allah, with whose name nothing on earth or in the heaven can cause harm, and He is the All-Hearing, the All-Knowing.'),
      src: B('رواه أبو داود والترمذي، وقال: حسن صحيح', 'Abu Dawud & Tirmidhi (hasan sahih)'),
      words: [['لَا يَضُرُّ', 'لا يؤذي', 'Cannot harm', 'cannot hurt'], ['السَّمِيعُ', 'الذي يسمع كلّ شيء', 'All-Hearing', 'hears everything'], ['الْعَلِيمُ', 'الذي يعلم كلّ شيء', 'All-Knowing', 'knows everything']],
      mean: B('أبدأ باسم ربّي القويّ. إذا كان الله معي فلا شيء يستطيع أن يؤذيني إلا بإذنه، وهو يسمعني ويعلم حالي.', 'I begin with the name of my strong Lord. If Allah is with me, nothing can hurt me except by His permission — He hears me and knows how I am.'),
      when: B('ثلاث مرّات في الصباح وثلاثًا في المساء. أخبر النبيُّ ﷺ أنّ من قالها ثلاثًا لم يضرّه شيء حتى يمسي، ومن قالها مساءً لم يضرّه شيء حتى يصبح.', 'Three times in the morning and three in the evening. The Prophet ﷺ told us whoever says it three times, nothing will harm him until evening — and in the evening, until morning.'),
      q: [B('كم مرّة نقول هذا الذكر في الصباح؟', 'How many times do we say it in the morning?'), [['مرّة واحدة', 'Once'], ['ثلاث مرّات', 'Three times', 1], ['عشر مرّات', 'Ten times']]] }),

    D({ id: 'subhanallah-100', tag: 'morning', icon: '🌳',
      title: B('سبحان الله وبحمده', 'SubhanAllahi wa bihamdih'), sub: B('مئة مرّة في اليوم', 'A hundred times a day'),
      matn: B('سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.', 'Glory be to Allah, and praise be to Him.'),
      src: B('رواه مسلم، ورواه البخاري ومسلم بلفظ: «في يوم مئة مرّة»', 'Muslim; and Bukhari & Muslim with "a hundred times a day"'),
      words: [['سُبْحَانَ اللَّهِ', 'الله منزّه عن كلّ نقص، كاملٌ في كلّ شيء', 'SubhanAllah', 'Allah is perfect, free from every flaw'], ['وَبِحَمْدِهِ', 'وأشكره وأمدحه على نعمه', 'Wa bihamdih', 'and I praise and thank Him']],
      mean: B('يا الله، أنت الكامل الذي لا عيب فيه، وأنا أحمدك على كلّ نعمك عليّ.', 'O Allah, You are perfect with no flaw at all, and I praise You for all Your gifts to me.'),
      when: B('في الصباح والمساء وفي أيّ وقت. قال النبيّ ﷺ: من قالها في يومٍ مئة مرّة حُطّت خطاياه وإن كانت مثل زبد البحر (متفق عليه). كلمتان خفيفتان على اللسان ثقيلتان في الميزان.', 'Morning, evening and anytime. The Prophet ﷺ said whoever says it a hundred times in a day, his sins are wiped away even if they were like the foam of the sea (Bukhari & Muslim). Light on the tongue, heavy on the scale.'),
      q: [B('ماذا يحدث لمن قالها مئة مرّة في اليوم؟', 'What happens to whoever says it 100 times a day?'), [['تُمحى خطاياه', 'His sins are wiped away', 1], ['يصير غنيًّا', 'He becomes rich'], ['لا شيء', 'Nothing']]] }),

    D({ id: 'four-words', tag: 'morning', icon: '💎',
      title: B('أحبّ الكلام إلى الله', 'The words Allah loves most'), sub: B('أربع كلمات', 'Four words'),
      matn: B('سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ.', 'Glory be to Allah, praise be to Allah, there is no god but Allah, and Allah is the Greatest.'),
      src: B('رواه مسلم', 'Muslim'),
      words: [['الْحَمْدُ لِلَّهِ', 'الشكر والثناء كلّه لله', 'Alhamdulillah', 'all thanks and praise belong to Allah'], ['لَا إِلَهَ إِلَّا اللَّهُ', 'لا أعبد أحدًا إلا الله', 'La ilaha illallah', 'I worship no one but Allah'], ['اللَّهُ أَكْبَرُ', 'الله أعظم من كلّ شيء', 'Allahu akbar', 'Allah is greater than everything']],
      mean: B('أُنزّه ربّي، وأشكره، وأُوحّده، وأعظّمه — كلّ ذلك في جملة واحدة قصيرة!', 'I declare my Lord perfect, thank Him, worship Him alone, and glorify Him — all in one short sentence!'),
      when: B('في أيّ وقت: في السيارة، في الطريق، وأنا أنتظر. قال النبيّ ﷺ: «أحبّ الكلام إلى الله أربع… لا يضرّك بأيّهنّ بدأت».', 'Anytime: in the car, on the way, while waiting. The Prophet ﷺ said: "The most beloved words to Allah are four… it does not matter which you begin with."'),
      q: [B('كم كلمة من أحبّ الكلام إلى الله؟', 'How many are the words Allah loves most?'), [['أربع', 'Four', 1], ['اثنتان', 'Two'], ['سبع', 'Seven']]] }),

    D({ id: 'sayyid-istighfar', tag: 'morning', icon: '👑',
      title: B('سيّد الاستغفار', 'The master of seeking forgiveness'), sub: B('أعظم دعاء للتوبة', 'The greatest dua of repentance'),
      matn: B('اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.',
        'O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as much as I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessings upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.'),
      src: B('رواه البخاري', 'Bukhari'),
      words: [['عَهْدِكَ', 'وعدي لك أن أعبدك وحدك', 'Your covenant', 'my promise to worship You alone'], ['أَبُوءُ', 'أعترف وأُقرّ', 'I acknowledge', 'I admit'], ['ذَنْبِي', 'خطئي', 'My sin', 'my mistake']],
      mean: B('يا ربّي، أنت خلقتني وأنا أحبّك وأحاول أن أطيعك. أعترف بنعمك الكثيرة، وأعترف بأخطائي، فسامحني؛ فلا أحد يسامح غيرك.', 'O my Lord, You created me; I love You and try to obey You. I admit Your many gifts and I admit my mistakes, so forgive me — no one forgives but You.'),
      when: B('في الصباح وفي المساء. قال النبيّ ﷺ: من قالها في النهار موقنًا بها فمات من يومه قبل أن يمسي فهو من أهل الجنة، ومن قالها في الليل كذلك.', 'Morning and evening. The Prophet ﷺ said whoever says it during the day with firm belief and dies that day before evening is among the people of Paradise — and likewise at night.'),
      q: [B('من الذي يغفر الذنوب؟', 'Who forgives sins?'), [['الله وحده', 'Allah alone', 1], ['أصدقائي', 'My friends'], ['لا أحد', 'No one']]] }),

    D({ id: 'quls', tag: 'morning', icon: '✋',
      title: B('المعوّذات', 'The three Quls'), sub: B('الإخلاص والفلق والناس', 'Al-Ikhlas, Al-Falaq, An-Nas'),
      matn: B('قُلْ هُوَ اللَّهُ أَحَدٌ… · قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ… · قُلْ أَعُوذُ بِرَبِّ النَّاسِ…<br><small>(السور الثلاث كاملة: الإخلاص ١١٢، الفلق ١١٣، الناس ١١٤)</small>', 'Say: He is Allah, the One… · Say: I seek refuge in the Lord of daybreak… · Say: I seek refuge in the Lord of mankind…<br><small>(the three full surahs: 112, 113, 114)</small>'),
      src: B('القرآن الكريم؛ وفضلها صباحًا ومساءً رواه أبو داود والترمذي (حسن صحيح)، وقبل النوم رواه البخاري', 'The Quran; their morning/evening virtue: Abu Dawud & Tirmidhi (hasan sahih); at bedtime: Bukhari'),
      words: [['أَحَدٌ', 'واحدٌ لا شريك له', 'Ahad', 'One, with no partner'], ['الْفَلَقِ', 'الصبح حين يطلع', 'Al-Falaq', 'the daybreak'], ['أَعُوذُ', 'أحتمي وألتجئ', "A'udhu", 'I seek protection']],
      mean: B('أقول: ربّي واحد لا مثيل له، وأطلب منه أن يحميني من كلّ شرّ — من الظلام، ومن الحسد، ومن وسوسة الشيطان.', 'I say: my Lord is One, with none like Him, and I ask Him to protect me from every harm — from darkness, from envy, and from Shaytan\'s whispers.'),
      when: B('ثلاث مرّات صباحًا ومساءً، قال النبيّ ﷺ: «تكفيك من كلّ شيء». وقبل النوم: كان النبيّ ﷺ يجمع كفّيه وينفث فيهما ويقرؤها ثم يمسح بهما جسده، ثلاث مرّات.', 'Three times morning and evening — the Prophet ﷺ said: "They will suffice you against everything." At bedtime the Prophet ﷺ would cup his hands, blow lightly into them, recite them, and wipe over his body — three times.'),
      q: [B('ماذا قال النبيّ ﷺ عن المعوّذات صباحًا ومساءً؟', 'What did the Prophet ﷺ say about the Quls morning & evening?'), [['تكفيك من كلّ شيء', 'They suffice you against everything', 1], ['تُقرأ مرّة في السنة', 'Read once a year'], ['للكبار فقط', 'Only for adults']]] }),

    D({ id: 'ayat-kursi', tag: 'morning', icon: '🌌',
      title: B('آية الكرسي', 'Ayat al-Kursi'), sub: B('أعظم آية في القرآن', 'The greatest verse in the Quran'),
      matn: B('اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ',
        'Allah — there is no god but He, the Ever-Living, the Sustainer of all. Neither drowsiness nor sleep overtakes Him. To Him belongs whatever is in the heavens and the earth. Who could intercede with Him except by His permission? He knows what is before them and what is behind them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and the earth, and guarding them does not tire Him. He is the Most High, the Most Great.'),
      src: B('سورة البقرة: ٢٥٥؛ وفضلها عند النوم رواه البخاري، وأنها أعظم آية رواه مسلم', 'Al-Baqarah 2:255; its bedtime virtue: Bukhari; "greatest verse": Muslim'),
      words: [['الْحَيُّ', 'الحيّ الذي لا يموت أبدًا', 'Al-Hayy', 'the Ever-Living who never dies'], ['الْقَيُّومُ', 'القائم بأمر كلّ شيء، يدبّر الكون', "Al-Qayyum", 'who takes care of everything'], ['سِنَةٌ', 'نعاس خفيف', 'Sinah', 'light drowsiness'], ['لَا يَئُودُهُ', 'لا يُتعبه ولا يُثقله', "La ya'uduh", 'does not tire Him']],
      mean: B('ربّي حيّ لا ينام أبدًا، يحفظ السماوات والأرض كلّها ولا يتعب، ويعلم كلّ شيء. فإذا نمتُ أنا، فهو لا ينام ويحفظني.', 'My Lord is Ever-Living and never sleeps. He guards all the heavens and the earth without tiring, and He knows everything. When I sleep, He does not — and He protects me.'),
      when: B('قبل النوم، وبعد كلّ صلاة، وفي الصباح والمساء. أخبر النبيّ ﷺ أنّ من قرأها عند نومه لا يزال عليه من الله حافظ، ولا يقربه شيطان حتى يصبح.', 'Before sleeping, after each prayer, and morning and evening. The Prophet ﷺ told us whoever reads it at bedtime has a guardian from Allah, and no shaytan comes near him until morning.'),
      q: [B('هل ينام الله سبحانه؟', 'Does Allah ever sleep?'), [['لا، أبدًا', 'No, never', 1], ['نعم في الليل', 'Yes, at night'], ['أحيانًا', 'Sometimes']]] }),

    /* ───────── يومي في البيت ───────── */
    D({ id: 'wake', tag: 'home', icon: '☀️',
      title: B('عند الاستيقاظ', 'When I wake up'), sub: B('أوّل كلمة في يومي', 'The first words of my day'),
      matn: B('الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ.', 'Praise be to Allah who gave us life after He had caused us to die, and to Him is the resurrection.'),
      src: B('رواه البخاري', 'Bukhari'),
      words: [['أَحْيَانَا', 'أيقظنا وأعادنا للحياة', 'Gave us life', 'woke us up again'], ['أَمَاتَنَا', 'النوم يشبه الموت الصغير', 'Caused us to die', 'sleep is like a small death'], ['النُّشُورُ', 'البعث يوم القيامة', 'Resurrection', 'rising again on the Last Day']],

      matn: B('أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.', 'I bear witness that there is no god but Allah alone, with no partner, and I bear witness that Muhammad is His servant and Messenger.'),

    D({ id: 'adhan', tag: 'masjid', icon: '📢',

      matn: B('أُردّد مع المؤذّن مثل ما يقول، ثم أقول:<br>أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبًّا، وَبِمُحَمَّدٍ رَسُولًا، وَبِالْإِسْلَامِ دِينًا.', 'I repeat what the muadhin says, then say:<br>I bear witness that there is no god but Allah alone, with no partner, and that Muhammad is His servant and Messenger. I am pleased with Allah as Lord, with Muhammad as Messenger, and with Islam as religion.'),

      words: [['رَضِيتُ', 'أنا سعيد وراضٍ', 'Raditu', 'I am pleased and content'], ['دِينًا', 'طريقًا أعيش عليه', 'Dinan', 'the way I live by']],
      mean: B('أنا فرحان بربّي الله، وبنبيّي محمد ﷺ، وبديني الإسلام!', "I'm happy with my Lord Allah, my Prophet Muhammad ﷺ, and my religion Islam!"),
      when: B('حين أسمع الأذان أوقف اللعب وأردّد. وعند «حيّ على الصلاة» و«حيّ على الفلاح» أقول: لا حول ولا قوّة إلا بالله (مسلم). وأخبر النبيّ ﷺ أنّ من قال «رضيت بالله ربًّا…» غُفر له ذنبه.', 'When I hear the adhan I pause my play and repeat. At "hayya \'ala-s-salah" and "hayya \'ala-l-falah" I say: la hawla wa la quwwata illa billah (Muslim). The Prophet ﷺ said whoever says "I am pleased with Allah as Lord…" is forgiven.'),
      q: [B('ماذا أفعل حين أسمع الأذان؟', 'What do I do when I hear the adhan?'), [['أردّد مع المؤذّن', 'Repeat after the muadhin', 1], ['أرفع صوت التلفاز', 'Turn up the TV'], ['أتجاهله', 'Ignore it']]] }),

    D({ id: 'ride', tag: 'masjid', icon: '🚗',

      matn: B('﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ﴾', '"Glory be to the One who has subjected this to us, and we could not have done it ourselves. And surely to our Lord we will return."'),

      words: [['سَخَّرَ', 'ذلّل وجعله في خدمتنا', 'Sakhkhara', 'made it serve us'], ['مُقْرِنِينَ', 'قادرين عليه بأنفسنا', 'Muqrinin', 'able to control it by ourselves'], ['لَمُنقَلِبُونَ', 'لراجعون', 'Lamunqalibun', 'will surely return']],

    onTab: function (tab, TR) { if (tab === 'day') { var p = window.TR_PAGE.panels[0]; p.render(document.querySelector('[data-panel="day"]'), TR); } },
    parents: {
      ar: '<div class="tr-note">🧭 <b>للأذكار ثلاثة أماكن، لكلٍّ دوره:</b> <a href="../little-district/pages/ibada-journeys.html?j=adhkar">درع البطل</a> في واحة العبادة لـ<b>الحفظ</b> خطوةً خطوة · هذه الصفحة لـ<b>فهم المعنى</b> · <a href="../little-district/pages/hasanat.html">حاسبة الحسنات</a> في ركن الأهل لـ<b>التطبيق اليومي</b>.</div><h3>كيف نعلّم الأذكار دون ضغط؟</h3><ul><li><b>ذكرٌ واحد في الأسبوع</b>: ابدأ بأذكار المواقف المتكرّرة (الأكل، النوم، الخروج).</li><li><b>كن أنت القدوة</b>: قُل الذكر بصوتٍ مسموع أمام طفلك؛ الطفل يقلّد قبل أن يحفظ.</li><li><b>اشرح المعنى قبل الحفظ</b>: سؤال «ماذا نقول لربّنا الآن؟» يجعل الذكر حديثًا مع الله لا كلمات تُردَّد.</li><li><b>اربط الذكر بالمكان</b>: ألصق بطاقة دعاء الخروج على الباب، ودعاء الطعام قرب المائدة.</li><li>لا عقاب على النسيان؛ ذكّر بلطف: «نسينا شيئًا جميلًا… ماذا نقول؟».</li></ul><h3>أفكار تفاعلية</h3><ul><li><b>لعبة «ماذا نقول؟»</b>: تذكر موقفًا (عطسة، مطر، باب) ويجيب الطفل بالذكر.</li><li><b>عقد الأذكار</b>: خرزة في خيط عن كلّ ذكر أتقنه الطفل خلال الشهر.</li><li><b>دقائق الصباح الخمس</b>: بعد الفجر أو قبل المدرسة، تقرؤون معًا ٣ أذكار فقط بهدوء.</li></ul><div class="tr-note">💡 أذكار الأطفال الأساسية بالترتيب المقترح: الأكل ← النوم والاستيقاظ ← الخلاء ← الخروج والدخول ← المسجد ← المشاعر ← الصباح والمساء.</div>',
      en: '<div class="tr-note">🧭 <b>Adhkar live in three places, each with one job:</b> <a href="../little-district/pages/ibada-journeys.html?j=adhkar">Hero\'s Shield</a> in the Worship Oasis to <b>memorize</b> step by step · this page to <b>understand the meaning</b> · the <a href="../little-district/pages/hasanat.html">Good-Deeds Counter</a> in the Parents corner for <b>daily practice</b>.</div><h3>How to teach adhkar without pressure</h3><ul><li><b>One dhikr a week</b>: start with recurring moments (eating, sleeping, going out).</li><li><b>Be the example</b>: say the dhikr aloud in front of your child — children imitate before they memorize.</li><li><b>Explain the meaning before memorizing</b>: asking "What are we telling our Lord now?" turns it into a conversation with Allah, not words repeated.</li><li><b>Link the dhikr to a place</b>: stick the leaving-home card on the door and the eating dua near the table.</li><li>No punishment for forgetting; remind gently: "We forgot something beautiful… what do we say?"</li></ul><h3>Interactive ideas</h3><ul><li><b>"What do we say?" game</b>: name a situation (a sneeze, rain, a door) and the child answers with the dhikr.</li><li><b>Adhkar necklace</b>: one bead on a string for each dhikr the child masters during the month.</li><li><b>Five morning minutes</b>: after Fajr or before school, read just 3 adhkar together calmly.</li></ul><div class="tr-note">💡 Suggested order for children: eating → sleeping & waking → toilet → leaving & entering → masjid → feelings → morning & evening.</div>'
    },
    worksheet: {
      ar: '<h3>✏️ ورقة نشاط: أذكاري اليوم</h3><p>صِل كلّ موقف بذكره (اكتب الرقم):</p><p>١- قبل الأكل &nbsp;&nbsp; ٢- عند العطاس &nbsp;&nbsp; ٣- عند الخروج من البيت &nbsp;&nbsp; ٤- قبل النوم &nbsp;&nbsp; ٥- حين أغضب</p><p>( ) بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا &nbsp; ( ) بِسْمِ اللَّهِ &nbsp; ( ) أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ &nbsp; ( ) الْحَمْدُ لِلَّهِ &nbsp; ( ) بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ</p><p>الذكر الذي أتعلّمه هذا الأسبوع:</p><div class="ws-line"></div><p>معناه بكلماتي:</p><div class="ws-line"></div><div class="ws-line"></div><p>ارسم المكان الذي أقول فيه هذا الذكر:</p><div class="ws-box"></div><p>☐ السبت ☐ الأحد ☐ الإثنين ☐ الثلاثاء ☐ الأربعاء ☐ الخميس ☐ الجمعة — ضع ✓ كلّ يوم تذكّرته بنفسي</p>',
      en: '<h3>✏️ Activity sheet: My adhkar today</h3><p>Match each moment with its dhikr (write the number):</p><p>1- Before eating &nbsp;&nbsp; 2- When sneezing &nbsp;&nbsp; 3- Leaving home &nbsp;&nbsp; 4- Before sleeping &nbsp;&nbsp; 5- When angry</p><p>( ) Bismika Allahumma amutu wa ahya &nbsp; ( ) Bismillah &nbsp; ( ) A\'udhu billahi mina-sh-shaytani-r-rajim &nbsp; ( ) Alhamdulillah &nbsp; ( ) Bismillah, tawakkaltu \'ala Allah</p><p>The dhikr I\'m learning this week:</p><div class="ws-line"></div><p>Its meaning in my words:</p><div class="ws-line"></div><div class="ws-line"></div><p>Draw the place where I say this dhikr:</p><div class="ws-box"></div><p>☐ Sat ☐ Sun ☐ Mon ☐ Tue ☐ Wed ☐ Thu ☐ Fri — tick each day I remembered it myself</p>'
