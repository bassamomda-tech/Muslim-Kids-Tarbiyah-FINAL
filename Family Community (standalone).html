document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:2rem;padding:.45rem 1rem;text-decoration:none;font-weight:800;font-size:.82rem}\n  .who{display:flex;align-items:center;gap:.4rem;font-weight:800;font-size:.85rem}\n  .who .av{width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:1rem}\n  .lang{display:flex;border:1.5px solid var(--line);border-radius:2rem;overflow:hidden}\n  .lang button{background:transparent;border:none;color:var(--ink);font-weight:800;padding:.3rem .8rem;font-size:.78rem;cursor:pointer;font-family:inherit}\n  .lang button.active{background:var(--gold);color:#10243d}\n  .wrap{max-width:920px;margin:0 auto;padding:1.6rem 1rem 4rem}\n\n  .tabs{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:1.1rem;padding:.3rem;margin-bottom:1.4rem;max-width:420px}\n  .tabs button{flex:1;background:transparent;border:none;color:var(--muted);font-weight:800;padding:.6rem;border-radius:.8rem;cursor:pointer;font-family:inherit;font-size:.92rem}\n  .tabs button.active{background:var(--c);color:#fff}\n\n  .gate{text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:1.4rem;padding:2rem 1.4rem;max-width:460px;margin:1rem auto}\n  .gate .ic{font-size:2.6rem}\n  .gate h2{font-size:1.3rem;font-weight:900;margin:.3rem 0}\n  .gate p{color:var(--muted);line-height:1.7;margin-bottom:1rem}\n  .gate a{display:inline-block;background:var(--gold);color:#10243d;border-radius:2rem;padding:.6rem 1.4rem;font-weight:800;text-decoration:none}\n\n  .panel{display:none}.panel.active{display:block}\n  .add{display:flex;gap:.6rem;margin-bottom:1.2rem}\n  .add input,.add textarea{flex:1;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);border-radius:1rem;padding:.7rem .9rem;font-family:inherit;font-size:.95rem;resize:vertical}\n  .add button{background:var(--c);color:#fff;border:none;border-radius:1rem;padding:0 1.2rem;font-weight:800;font-family:inherit;cursor:pointer}\n\n  .ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}\n  .ch-card{background:var(--card);border:1.5px solid var(--line);border-radius:1.3rem;padding:1.1rem;display:flex;flex-direction:column;gap:.5rem}\n  .ch-top{display:flex;align-items:center;gap:.6rem}\n  .ch-ic{font-size:1.8rem}\n  .ch-t{font-weight:900;font-size:1.05rem;line-height:1.35}\n  .ch-d{color:var(--muted);font-size:.84rem;line-height:1.6;flex:1}\n  .ch-meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-weight:700}\n  .ch-bar{height:8px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}\n  .ch-bar i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .4s}\n  .ch-acts{display:flex;gap:.5rem;align-items:center}\n  .ch-join{flex:1;background:var(--c);color:#fff;border:none;border-radius:.9rem;padding:.55rem;font-weight:800;font-family:inherit;cursor:pointer;font-size:.88rem}\n  .ch-join.joined{background:rgba(31,138,91,.2);color:#a8f0c4;border:1px solid rgba(31,138,91,.5)}\n  .ch-step{width:38px;height:38px;border-radius:.8rem;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-weight:900;font-size:1.1rem;cursor:pointer}\n  .new-ch{background:rgba(41,128,185,.1);border:1.5px dashed var(--c);border-radius:1.3rem;padding:1.1rem;display:flex;flex-direction:column;gap:.6rem}\n  .new-ch input{border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);border-radius:.8rem;padding:.6rem .8rem;font-family:inherit}\n  .new-ch button{background:var(--c);color:#fff;border:none;border-radius:.8rem;padding:.6rem;font-weight:800;font-family:inherit;cursor:pointer}\n\n  .post{background:var(--card);border:1.5px solid var(--line);border-radius:1.2rem;padding:1rem 1.1rem;margin-bottom:.8rem}\n  .post-h{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}\n  .post-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.1rem}\n  .post-who{font-weight:800}.post-time{color:var(--muted);font-size:.74rem;margin-inline-start:auto}\n  .post-text{line-height:1.75;font-size:.95rem}\n  .post-foot{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}\n  .post-like{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:2rem;padding:.25rem .8rem;font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit}\n  .post-mini{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--muted);border-radius:2rem;padding:.25rem .7rem;font-weight:700;font-size:.76rem;cursor:pointer;font-family:inherit;opacity:.85}\n  .post-mini:hover{opacity:1;border-color:rgba(229,115,115,.6);color:#ffb4b4}\n  .post-mini.mk-blocked{opacity:.6;cursor:default;border-color:var(--line);color:var(--muted)}\n  .live-note{font-family:ui-monospace,monospace;font-size:.72rem;color:#90A4AE;background:rgba(0,0,0,.22);border-radius:.6rem;padding:.5rem .8rem;margin-bottom:1.2rem;text-align:center}\n  .en-only{display:none}\n  html[dir=\"ltr\"] .ar-only{display:none}\n  html[dir=\"ltr\"] .en-only{display:inline}\n\n  /* admin composer + announcements */\n  .admin-box{background:linear-gradient(160deg,rgba(232,181,48,.14),rgba(232,181,48,.05));border:1.5px solid var(--gold);border-radius:1.2rem;padding:1rem 1.1rem;margin-bottom:1.2rem}\n  .admin-box-h{font-weight:900;color:var(--gold-lt);margin-bottom:.7rem;font-size:.95rem}\n  .admin-kinds{display:flex;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap}\n  .admin-kinds .kbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);border-radius:2rem;padding:.4rem .9rem;font-weight:800;font-size:.82rem;cursor:pointer;font-family:inherit}\n  .admin-kinds .kbtn.active{background:var(--gold);color:#10243d;border-color:var(--gold)}\n  .admin-box textarea{width:100%;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);border-radius:1rem;padding:.7rem .9rem;font-family:inherit;font-size:.95rem;resize:vertical;margin-bottom:.7rem}\n  .admin-post-btn{background:var(--gold);color:#10243d;border:none;border-radius:1rem;padding:.6rem 1.4rem;font-weight:900;font-family:inherit;cursor:pointer}\n  .post.admin{border-color:var(--gold);background:linear-gradient(160deg,rgba(232,181,48,.1),rgba(255,255,255,.05));position:relative}\n  .post .pin{position:absolute;top:.7rem;inset-inline-end:.9rem;font-size:1rem}\n  .admin-badge{background:var(--gold);color:#10243d;border-radius:2rem;padding:.1rem .55rem;font-size:.68rem;font-weight:900;margin-inline-start:.4rem}\n  .admin-badge.sm{padding:.05rem .3rem;font-size:.6rem;margin-inline-start:.25rem}\n  .kind-tag{display:inline-block;background:rgba(41,128,185,.18);border:1px solid rgba(41,128,185,.5);color:#bfe0f7;border-radius:2rem;padding:.15rem .7rem;font-size:.74rem;font-weight:800;margin-bottom:.5rem}\n  .comments{margin-top:.7rem;border-top:1px solid var(--line);padding-top:.7rem}\n  .comment{background:rgba(255,255,255,.04);border-radius:.8rem;padding:.5rem .7rem;margin-bottom:.5rem;position:relative}\n  .c-del{position:absolute;top:.4rem;inset-inline-end:.5rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;opacity:.7}\n  .c-del:hover{opacity:1;color:#ffb4b4}\n  .post-mini.del:hover{border-color:rgba(229,115,115,.6);color:#ffb4b4}\n  .comment .c-av{font-size:.95rem;margin-inline-end:.35rem}\n  .comment .c-who{font-weight:800;font-size:.82rem}\n  .comment .c-time{color:var(--muted);font-size:.7rem;margin-inline-start:.4rem}\n  .comment .c-text{line-height:1.6;font-size:.88rem;margin-top:.25rem}\n  .c-empty{color:var(--muted);font-size:.82rem;text-align:center;padding:.4rem 0 .7rem}\n  .comment-add{display:flex;gap:.5rem;margin-top:.5rem}\n  .comment-add input{flex:1;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);border-radius:.8rem;padding:.5rem .7rem;font-family:inherit;font-size:.88rem}\n  .comment-add button{background:var(--c);color:#fff;border:none;border-radius:.8rem;padding:0 1rem;font-weight:800;font-family:inherit;cursor:pointer}\n<\u002Fstyle>\n<style id=\"__antiflash\">html{background:#081E36;color-scheme:dark}<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n  <div class=\"header\">\n    <a class=\"back-btn\" href=\"../../index.html\"><span class=\"ar-only\">↩️ المدينة<\u002Fspan><span class=\"en-only\">↩️ City<\u002Fspan><\u002Fa>\n    <div class=\"who\" id=\"who\"><\u002Fdiv>\n    <div class=\"lang\"><button data-lang=\"en\">EN<\u002Fbutton><button data-lang=\"ar\" class=\"active\">عربي<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"wrap\">\n    <div id=\"gate\"><\u002Fdiv>\n    <div id=\"main\" style=\"display:none\">\n      <div class=\"live-note\" id=\"liveNote\"><\u002Fdiv>\n      <div class=\"tabs\">\n        <button id=\"tabCh\" class=\"active\" onclick=\"showTab('ch')\">🎯 <span class=\"ar-only\">التحدّيات<\u002Fspan><span class=\"en-only\">Challenges<\u002Fspan><\u002Fbutton>\n        <button id=\"tabDisc\" onclick=\"showTab('disc')\">💬 <span class=\"ar-only\">نقاش الأهل<\u002Fspan><span class=\"en-only\">Parents' Talk<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n\n      <section class=\"panel active\" id=\"panel-ch\">\n        <div class=\"new-ch\">\n          <b>➕ <span class=\"ar-only\">أنشئ تحدّياً جديداً<\u002Fspan><span class=\"en-only\">Create a new challenge<\u002Fspan><\u002Fb>\n          <input id=\"ncTitle\" placeholder=\"\">\n          <input id=\"ncDesc\" placeholder=\"\">\n          <button onclick=\"createChallenge()\"><span class=\"ar-only\">أنشئ التحدّي<\u002Fspan><span class=\"en-only\">Create challenge<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"ch\" id=\"chGrid\" style=\"margin-top:1.2rem\"><\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"panel\" id=\"panel-disc\">\n        <div class=\"admin-box\" id=\"adminBox\" style=\"display:none\">\n          <div class=\"admin-box-h\">🛡️ <span class=\"ar-only\">لوحة المشرف — انشُر باسمك الرسمي (مثبّت أعلى النقاش)<\u002Fspan><span class=\"en-only\">Admin panel — post in your official name (pinned to the top)<\u002Fspan><\u002Fdiv>\n          <div class=\"admin-kinds\">\n            <button type=\"button\" class=\"kbtn active\" data-kind=\"announcement\">📢 <span class=\"ar-only\">إعلان<\u002Fspan><span class=\"en-only\">Announcement<\u002Fspan><\u002Fbutton>\n            <button type=\"button\" class=\"kbtn\" data-kind=\"request\">💬 <span class=\"ar-only\">طلب آراء<\u002Fspan><span class=\"en-only\">Ask for input<\u002Fspan><\u002Fbutton>\n            <button type=\"button\" class=\"kbtn\" data-kind=\"initiative\">🚀 <span class=\"ar-only\">مبادرة<\u002Fspan><span class=\"en-only\">Initiative<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <textarea id=\"adminInput\" rows=\"3\" placeholder=\"\"><\u002Ftextarea>\n          <button class=\"admin-post-btn\" onclick=\"adminPost()\"><span class=\"ar-only\">انشُر كمشرف 📌<\u002Fspan><span class=\"en-only\">Post as admin 📌<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"admin-box\" id=\"bcBox\" style=\"display:none;border-style:dashed\">\n          <div class=\"admin-box-h\">📣 <span class=\"ar-only\">إشعار للموقع كامل — يظهر كشريط واضح أعلى كل صفحة<\u002Fspan><span class=\"en-only\">Site-wide notice — shows as a clear bar on top of every page<\u002Fspan><\u002Fdiv>\n          <div class=\"admin-kinds\" id=\"bcAud\">\n            <button type=\"button\" class=\"kbtn active\" data-aud=\"all\">🌍 <span class=\"ar-only\">الجميع<\u002Fspan><span class=\"en-only\">Everyone<\u002Fspan><\u002Fbutton>\n            <button type=\"button\" class=\"kbtn\" data-aud=\"kids\">🧒 <span class=\"ar-only\">الأطفال (الأركان)<\u002Fspan><span class=\"en-only\">Kids (corners)<\u002Fspan><\u002Fbutton>\n            <button type=\"button\" class=\"kbtn\" data-aud=\"parents\">👪 <span class=\"ar-only\">الأهل<\u002Fspan><span class=\"en-only\">Parents<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <textarea id=\"bcAr\" rows=\"2\" placeholder=\"نص الرسالة بالعربية…\" dir=\"rtl\"><\u002Ftextarea>\n          <textarea id=\"bcEn\" rows=\"2\" placeholder=\"English text (optional)…\" dir=\"ltr\"><\u002Ftextarea>\n          <button class=\"admin-post-btn\" onclick=\"sendBroadcast()\"><span class=\"ar-only\">أرسل الإشعار 📣<\u002Fspan><span class=\"en-only\">Send notice 📣<\u002Fspan><\u002Fbutton>\n          <span id=\"bcMsg\" style=\"margin-inline-start:.6rem;font-weight:800;color:var(--gold-lt)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"add\">\n          <textarea id=\"postInput\" rows=\"2\" placeholder=\"\"><\u002Ftextarea>\n          <button onclick=\"addPost()\"><span class=\"ar-only\">انشُر<\u002Fspan><span class=\"en-only\">Post<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"postList\"><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script src=\"32a02c31-7c61-4d16-9228-b676ca24a94f\"><\u002Fscript>\n<script src=\"50b749ae-b425-450e-8662-bbb0eab97a29\"><\u002Fscript>\n<script src=\"2dfeb015-0d45-499b-bfee-acc62784dbf0\"><\u002Fscript>\n<script src=\"2e6ed380-8e37-4002-8ed0-676ee41098ea\"><\u002Fscript>\n<script defer=\"\" src=\"cb989ac9-64be-4c95-814f-be2d606a778c\"><\u002Fscript>\n<script src=\"10d672fc-391d-4a25-a5de-7cd7c23895ee\"><\u002Fscript>\n<script src=\"6db33526-e33a-40aa-bc0f-39b9f2feebf6\"><\u002Fscript>\n<script>\n  var lang=(window.MK&&MK.lang&&MK.lang())||localStorage.getItem('bunyanLang')||'ar';\n  function t(a,e){ return lang==='ar'?a:e; }\n  function txo(o){ return o?(lang==='ar'?(o.ar||o):(o.en||o.ar||o)):''; }\n  function ago(ts){ var s=Math.floor((Date.now()-ts)/1000); if(s<60)return t('الآن','now'); var m=Math.floor(s/60); if(m<60)return m+t(' د',' m'); var h=Math.floor(m/60); if(h<24)return h+t(' س',' h'); return Math.floor(h/24)+t(' ي',' d'); }\n\n  function applyLang(){\n    document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';\n    document.querySelectorAll('.ar-only').forEach(function(e){e.style.display=lang==='ar'?'':'none';});\n    document.querySelectorAll('.en-only').forEach(function(e){e.style.display=lang==='en'?'':'none';});\n    document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang);});\n    document.getElementById('ncTitle').placeholder=t('عنوان التحدّي (مثال: حفظ جزء عمّ)','Challenge title');\n    document.getElementById('ncDesc').placeholder=t('وصفٌ قصير','Short description');\n    document.getElementById('postInput').placeholder=t('شارِك تجربتك أو سؤالك مع الأهل…','Share your experience or question…');\n    var ai=document.getElementById('adminInput'); if(ai) ai.placeholder=t('اكتب إعلاناً أو مبادرةً أو اطلب آراء الأهل…','Write an announcement, an initiative, or ask families for input…');\n    var live=(window.MKAuth&&MKAuth.isLive&&MKAuth.isLive());\n    document.getElementById('liveNote').textContent=live\n      ? t('☁️ مجتمعٌ مباشر · يمكنك الإبلاغ عن أيّ منشور أو حجب أيّ مستخدم','☁️ Live community · you can report any post or block any user')\n      : t('🔒 يعمل محليّاً الآن · جاهزٌ للربط بحسابٍ سحابيٍّ ليتشارك الجميع','🔒 Runs locally now · ready to connect to a cloud account so everyone shares');\n    boot();\n  }\n  document.querySelectorAll('.lang button').forEach(function(b){ b.onclick=function(){ lang=b.dataset.lang; try{localStorage.setItem('bunyanLang',lang);}catch(e){} applyLang(); }; });\n\n  function boot(){\n    MKAuth.refresh().then(function(u){\n      var gate=document.getElementById('gate'), main=document.getElementById('main'), who=document.getElementById('who');\n      if(!u){\n        main.style.display='none'; who.innerHTML='';\n        gate.style.display='block';\n        gate.innerHTML='<div class=\"gate\"><div class=\"ic\">👥<\u002Fdiv><h2>'+t('مجتمعُ العائلات','Family Community')+'<\u002Fh2>'\n          +'<p>'+t('سجِّل دخولَك لِتشارِكَ في التحدّياتِ وتتفاعَلَ مع عائلاتٍ أخرى.','Log in to join challenges and connect with other families.')+'<\u002Fp>'\n          +'<a href=\"account.html?lang='+lang+'\">'+t('تسجيل الدخول / حساب جديد ←','Log in / Sign up →')+'<\u002Fa><\u002Fdiv>';\n        return;\n      }\n      gate.style.display='none'; main.style.display='block';\n      who.innerHTML='<span class=\"av\">'+(u.avatar||'🧑')+'<\u002Fspan><span>'+escapeHtml(u.name)+'<\u002Fspan>';\n      document.getElementById('adminBox').style.display = (MKAuth.isAdmin&&MKAuth.isAdmin()) ? 'block' : 'none';\n      document.getElementById('bcBox').style.display = (MKAuth.isAdmin&&MKAuth.isAdmin()) ? 'block' : 'none';\n      try{ localStorage.setItem('mkcomm:lastSeenAdmin', String(Date.now())); }catch(e){}\n      if(window.MKNotify) MKNotify.refresh();\n      renderChallenges(); renderPosts();\n    });\n  }\n\n  function showTab(id){\n    document.getElementById('tabCh').classList.toggle('active',id==='ch');\n    document.getElementById('tabDisc').classList.toggle('active',id==='disc');\n    document.getElementById('panel-ch').classList.toggle('active',id==='ch');\n    document.getElementById('panel-disc').classList.toggle('active',id==='disc');\n  }\n\n  function renderChallenges(){\n    MKAuth.listChallenges().then(function(list){\n      document.getElementById('chGrid').innerHTML=list.map(function(c){\n        var pct=c.days?Math.round((c.myProgress||0)/c.days*100):0;\n        var join=c.joined\n          ? '<button class=\"ch-join joined\" disabled>✓ '+t('مشترك','Joined')+'<\u002Fbutton><button class=\"ch-step\" onclick=\"stepChallenge(\\''+c.id+'\\','+c.days+')\">＋<\u002Fbutton>'\n          : '<button class=\"ch-join\" onclick=\"joinChallenge(\\''+c.id+'\\')\">'+t('انضمّ','Join')+'<\u002Fbutton>';\n        return '<div class=\"ch-card\"><div class=\"ch-top\"><span class=\"ch-ic\">'+c.icon+'<\u002Fspan><span class=\"ch-t\">'+txo(c.title)+'<\u002Fspan><\u002Fdiv>'\n          +'<div class=\"ch-d\">'+txo(c.desc)+'<\u002Fdiv>'\n          +(c.joined?'<div class=\"ch-bar\"><i style=\"width:'+pct+'%\"><\u002Fi><\u002Fdiv><div class=\"ch-meta\"><span>'+(c.myProgress||0)+'/'+c.days+' '+t('يوم','days')+'<\u002Fspan><span>'+pct+'%<\u002Fspan><\u002Fdiv>':'')\n          +'<div class=\"ch-meta\"><span>👥 '+c.members+' '+t('مشارك','members')+'<\u002Fspan><span>'+(c.days)+' '+t('يوم','days')+'<\u002Fspan><\u002Fdiv>'\n          +'<div class=\"ch-acts\">'+join+'<\u002Fdiv><\u002Fdiv>';\n      }).join('');\n    });\n  }\n  function joinChallenge(id){ MKAuth.joinChallenge(id).then(renderChallenges); }\n  function stepChallenge(id,days){\n    MKAuth.listChallenges().then(function(list){\n      var c=list.find(function(x){return x.id===id;}); var p=Math.min((c.myProgress||0)+1,days);\n      MKAuth.setChallengeProgress(id,p).then(renderChallenges);\n    });\n  }\n  function createChallenge(){\n    var title=document.getElementById('ncTitle').value.trim();\n    var desc=document.getElementById('ncDesc').value.trim();\n    if(!title){ document.getElementById('ncTitle').focus(); return; }\n    MKAuth.createChallenge({ title:{ar:title,en:title}, desc:{ar:desc,en:desc}, days:7, icon:'🎯' }).then(function(){\n      document.getElementById('ncTitle').value=''; document.getElementById('ncDesc').value=''; renderChallenges();\n    });\n  }\n\n  var KIND={ announcement:{ic:'📢',ar:'إعلان',en:'Announcement'}, request:{ic:'💬',ar:'طلب آراء',en:'Ask for input'}, initiative:{ic:'🚀',ar:'مبادرة',en:'Initiative'} };\n  var adminKind='announcement';\n  document.querySelectorAll('#adminBox .kbtn').forEach(function(b){ b.onclick=function(){ adminKind=b.dataset.kind; document.querySelectorAll('#adminBox .kbtn').forEach(function(x){x.classList.toggle('active',x===b);}); }; });\n  function adminPost(){\n    var inp=document.getElementById('adminInput'); var v=inp.value.trim(); if(!v) return;\n    MKAuth.addPost(v,{admin:true,kind:adminKind}).then(function(){ inp.value=''; renderPosts(); });\n  }\n\n  var bcAud='all';\n  document.querySelectorAll('#bcAud .kbtn').forEach(function(b){ b.onclick=function(){ bcAud=b.dataset.aud; document.querySelectorAll('#bcAud .kbtn').forEach(function(x){x.classList.toggle('active',x===b);}); }; });\n  function sendBroadcast(){\n    var ar=document.getElementById('bcAr').value.trim();\n    var en=document.getElementById('bcEn').value.trim();\n    var msg=document.getElementById('bcMsg');\n    if(!ar && !en){ msg.textContent=t('اكتب نص الرسالة','Write a message'); return; }\n    msg.textContent=t('جارٍ الإرسال…','Sending…');\n    MKAuth.broadcast(ar,en,bcAud).then(function(ok){\n      if(ok){ document.getElementById('bcAr').value=''; document.getElementById('bcEn').value='';\n        msg.textContent=t('تم إرسال الإشعار ✓','Notice sent ✓'); setTimeout(function(){msg.textContent='';},3000); }\n      else { msg.textContent=t('تعذّر الإرسال','Could not send'); }\n    });\n  }\n\n  function renderPosts(){\n    var me=(MKAuth.user&&MKAuth.user())||{}; var myId=me.id; var admin=!!(MKAuth.isAdmin&&MKAuth.isAdmin());\n    MKAuth.listPosts().then(function(list){\n      document.getElementById('postList').innerHTML=list.map(function(p){\n        var who=encodeURIComponent(p.who||''); var puid=encodeURIComponent(p.uid||'');\n        var mine=(p.uid&&p.uid===myId)||p.mine;\n        var adminCls=p.admin?' admin':'';\n        var pin=p.pinned?'<span class=\"pin\">📌<\u002Fspan>':'';\n        var k=p.admin&&p.kind&&KIND[p.kind];\n        var kind=k?'<div><span class=\"kind-tag\">'+k.ic+' '+t(k.ar,k.en)+'<\u002Fspan><\u002Fdiv>':'';\n        var badge=p.admin?'<span class=\"admin-badge\">🛡️ '+t('المشرف','Admin')+'<\u002Fspan>':'';\n        var del=(mine||admin)?'<button class=\"post-mini del\" onclick=\"deletePost(\\''+p.id+'\\')\">🗑️ '+t('حذف','Delete')+'<\u002Fbutton>':'';\n        var mod=(!mine)?'<button class=\"post-mini\" onclick=\"reportPost(\\''+p.id+'\\')\">🚩 '+t('إبلاغ','Report')+'<\u002Fbutton>'\n          +'<button class=\"post-mini\" onclick=\"blockUser(\\''+who+'\\',\\''+puid+'\\')\">🚫 '+t('حجب','Block')+'<\u002Fbutton>':'';\n        return '<div class=\"post'+adminCls+'\" id=\"post-'+p.id+'\">'+pin\n          +'<div class=\"post-h\"><span class=\"post-av\">'+(p.avatar||'🧑')+'<\u002Fspan>'\n          +'<span class=\"post-who\">'+escapeHtml(p.who)+'<\u002Fspan>'+badge\n          +'<span class=\"post-time\">'+ago(p.at)+'<\u002Fspan><\u002Fdiv>'\n          +kind\n          +'<div class=\"post-text\">'+escapeHtml(p.text)+'<\u002Fdiv>'\n          +'<div class=\"post-foot\">'\n          +'<button class=\"post-like\" onclick=\"likePost(\\''+p.id+'\\')\">🤍 '+(p.likes||0)+'<\u002Fbutton>'\n          +'<button class=\"post-mini\" onclick=\"toggleComments(\\''+p.id+'\\')\">💬 '+t('تعليق','Comment')+'<\u002Fbutton>'\n          +del+mod\n          +'<\u002Fdiv>'\n          +'<div class=\"comments\" id=\"cm-'+p.id+'\" style=\"display:none\"><\u002Fdiv>'\n          +'<\u002Fdiv>';\n      }).join('');\n    });\n  }\n  function toggleComments(id){\n    var box=document.getElementById('cm-'+id);\n    if(box.style.display==='none'){ box.style.display='block'; loadComments(id); } else { box.style.display='none'; }\n  }\n  function loadComments(id){\n    var box=document.getElementById('cm-'+id);\n    var me=(MKAuth.user&&MKAuth.user())||{}; var myId=me.id; var admin=!!(MKAuth.isAdmin&&MKAuth.isAdmin());\n    MKAuth.listComments(id).then(function(list){\n      var items=list.map(function(c){\n        var ab=c.admin?'<span class=\"admin-badge sm\">🛡️<\u002Fspan>':'';\n        var canDel=(c.uid&&c.uid===myId)||admin;\n        var del=canDel?'<button class=\"c-del\" onclick=\"deleteComment(\\''+id+'\\',\\''+c.id+'\\')\">🗑️<\u002Fbutton>':'';\n        return '<div class=\"comment\">'+del+'<span class=\"c-av\">'+(c.avatar||'🧑')+'<\u002Fspan><span class=\"c-who\">'+escapeHtml(c.who)+'<\u002Fspan>'+ab+'<span class=\"c-time\">'+ago(c.at)+'<\u002Fspan><div class=\"c-text\">'+escapeHtml(c.text)+'<\u002Fdiv><\u002Fdiv>';\n      }).join('');\n      box.innerHTML=(items||'<div class=\"c-empty\">'+t('كن أوّل من يعلّق','Be the first to comment')+'<\u002Fdiv>')\n        +'<div class=\"comment-add\"><input id=\"ci-'+id+'\" placeholder=\"'+t('اكتب تعليقاً…','Write a comment…')+'\"><button onclick=\"sendComment(\\''+id+'\\')\">'+t('أرسل','Send')+'<\u002Fbutton><\u002Fdiv>';\n    });\n  }\n  function sendComment(id){\n    var inp=document.getElementById('ci-'+id); var v=inp.value.trim(); if(!v) return;\n    MKAuth.addComment(id,v).then(function(){ loadComments(id); });\n  }\n  function deletePost(id){\n    if(!confirm(t('حذف هذا المنشور نهائياً؟','Delete this post permanently?'))) return;\n    MKAuth.deletePost(id).then(renderPosts);\n  }\n  function deleteComment(postId,cid){\n    if(!confirm(t('حذف هذا التعليق؟','Delete this comment?'))) return;\n    MKAuth.deleteComment(postId,cid).then(function(){ loadComments(postId); });\n  }\n  function addPost(){\n    var inp=document.getElementById('postInput'); var v=inp.value.trim(); if(!v) return;\n    MKAuth.addPost(v).then(function(){ inp.value=''; renderPosts(); });\n  }\n  function likePost(id){ MKAuth.likePost(id).then(renderPosts); }\n  function reportPost(id){\n    if(!confirm(t('هل تريد الإبلاغ عن هذا المنشور كمحتوى مخالف؟','Report this post as inappropriate?'))) return;\n    MKAuth.reportPost(id,'').then(function(){\n      alert(t('شكراً لك. تم استلام بلاغك وسيُراجَع خلال ٢٤ ساعة.','Thank you. Your report was received and will be reviewed within 24 hours.'));\n    });\n  }\n  function blockUser(who,puid){\n    who=decodeURIComponent(who||''); puid=decodeURIComponent(puid||'');\n    if(!confirm(t('حجب منشورات هذا المستخدم؟ لن ترى منشوراته بعد الآن.','Block this user? You will no longer see their posts.'))) return;\n    MKAuth.blockUser(who,puid).then(function(){\n      alert(t('تم الحجب. تم إخفاء منشورات هذا المستخدم.','User blocked. Their posts are now hidden.'));\n      renderPosts();\n    });\n  }\n\n  function escapeHtml(s){ return String(s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];}); }\n  applyLang();\n<\u002Fscript>\n<script defer=\"\" src=\"199f3528-41b0-49a7-bb29-eefca76bd63a\"><\u002Fscript>\n<script src=\"4b7efe5e-59b0-4c82-9089-289f4ebdf9f1\"><\u002Fscript>\n<script src=\"8ebda8ac-a412-409a-8747-60caa0f97960\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
