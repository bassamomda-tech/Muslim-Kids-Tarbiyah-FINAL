<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة الكتاب | Book Preview</title>
<style>
  :root{ --bg1:#081E36; --bg2:#0E2E4E; --gold:#E8B530; --gold-lt:#F5CC5A; --ink:#FEF5DC; --muted:rgba(254,245,220,.7); --green:#1F8A5B; --line:rgba(232,181,48,.3); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Tajawal','Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;direction:rtl}
  html[dir="ltr"] body{direction:ltr}
  .pv-bar{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.7rem 1.1rem;background:rgba(8,24,42,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .pv-back{background:var(--gold);color:#10243d;border:none;border-radius:2rem;padding:.45rem 1.1rem;font-weight:800;font-size:.85rem;text-decoration:none;font-family:inherit;cursor:pointer}
  .pv-title{font-weight:900;font-size:1rem;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-badge{background:rgba(232,181,48,.18);color:var(--gold-lt);border:1px solid var(--line);border-radius:2rem;padding:.32rem .9rem;font-weight:800;font-size:.78rem;white-space:nowrap}
  .pv-unlock{background:linear-gradient(135deg,var(--green),#176b46);color:#fff;border:none;border-radius:2rem;padding:.5rem 1.2rem;font-weight:900;font-size:.85rem;font-family:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
  .pv-stage{flex:1;position:relative;overflow:auto;background:#0a2138}
  #bookFrame{width:100%;height:100%;border:0;display:block;background:#0a2138}
  /* paywall card shown under the sample pages */
  .pv-wall{max-width:560px;margin:1.5rem auto 3rem;background:linear-gradient(160deg,rgba(31,138,91,.18),rgba(232,181,48,.1));border:1.5px solid var(--line);border-radius:1.4rem;padding:1.6rem 1.4rem;text-align:center}
  .pv-wall .lock{font-size:2.6rem}
  .pv-wall h2{font-size:1.35rem;font-weight:900;margin:.3rem 0 .5rem;color:var(--gold-lt)}
  .pv-wall p{color:var(--muted);line-height:1.85;font-size:.95rem;margin-bottom:1.1rem}
  .pv-wall .cta{display:inline-flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,var(--green),#176b46);color:#fff;border:none;border-radius:2rem;padding:.75rem 1.6rem;font-weight:900;font-size:1rem;font-family:inherit;cursor:pointer;text-decoration:none}
  .pv-wall .sub{margin-top:.9rem;font-size:.8rem;color:var(--muted)}
  .pv-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:1rem}
  .en-only{display:none}
  html[dir="ltr"] .ar-only{display:none}
  html[dir="ltr"] .en-only{display:inline}
  @media print{ .pv-bar{display:none} }
</style>
</head>
<body>
  <div class="pv-bar">
    <a class="pv-back" id="backBtn">↩️ <span class="ar-only">المتجر</span><span class="en-only">Store</span></a>
    <div class="pv-title" id="pvTitle">…</div>
    <span class="pv-badge"><span class="ar-only">👁️ معاينة — أول <b id="nAr">٣</b> صفحات فقط</span><span class="en-only">👁️ Preview — first <b id="nEn">3</b> pages only</span></span>
    <a class="pv-unlock" id="unlockBtn">🔓 <span class="ar-only">ادعم لفتح الكتاب كاملاً</span><span class="en-only">Support to unlock full book</span></a>
  </div>
  <div class="pv-stage">
    <div class="pv-loading" id="loading"><span class="ar-only">…جارٍ تحميل المعاينة</span><span class="en-only">Loading preview…</span></div>
    <iframe id="bookFrame" title="book preview" referrerpolicy="no-referrer"></iframe>
  </div>

<script>
  (function(){
    function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }
    var lang = qp('lang') || localStorage.getItem('bunyanLang') || 'ar';
    var N = Math.max(1, parseInt(qp('n')||'3',10) || 3);
    var src = qp('src') ? decodeURIComponent(qp('src')) : '';
    var bid = qp('bid') || '';
    var title = qp('t') ? decodeURIComponent(qp('t')) : '';
    var ar = lang==='ar';

    document.documentElement.lang = lang;
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.querySelectorAll('.ar-only').forEach(function(e){ e.style.display = ar?'':'none'; });
    document.querySelectorAll('.en-only').forEach(function(e){ e.style.display = ar?'none':''; });
    var arNums={0:'٠',1:'١',2:'٢',3:'٣',4:'٤',5:'٥',6:'٦',7:'٧',8:'٨',9:'٩'};
    document.getElementById('nAr').textContent = String(N).replace(/\d/g,function(d){return arNums[d];});
    document.getElementById('nEn').textContent = N;
    document.getElementById('pvTitle').textContent = title || (ar?'معاينة الكتاب':'Book Preview');

    // store is at ../corners/shared/store.html relative to this Books/ page
    var storeBase = '../corners/shared/store.html?lang=' + lang;
    document.getElementById('backBtn').href = storeBase;
    // returning with ?add= re-adds this item to the cart and opens it
    var unlockHref = storeBase + (bid ? ('&add=' + encodeURIComponent(bid)) : '');
    document.getElementById('unlockBtn').href = unlockHref;

    var frame = document.getElementById('bookFrame');
    if(!src){ document.getElementById('loading').textContent = ar?'لا يوجد كتاب':'No book'; return; }
    frame.src = src;

    function wallHTML(){
      return '<div class="pv-wall">'
        + '<div class="lock">🔒</div>'
        + '<h2>' + (ar?'هذه معاينةٌ مجّانية':'This is a free preview') + '</h2>'
        + '<p>' + (ar
            ? ('شاهدتَ أوّل ' + N + ' صفحاتٍ من الكتاب. ادعَم الموقعَ لفتحِ الكتابِ كاملاً وطباعتِه — دعمُك صدقةٌ جاريةٌ تُبقي الموقعَ مجّانيًّا للجميع.')
            : ('You\u2019ve seen the first ' + N + ' pages. Support the site to unlock and print the full book — your support is an ongoing charity that keeps the site free for everyone.'))
        + '</p>'
        + '<a class="cta" href="' + unlockHref + '">🔓 ' + (ar?'ادعم لفتح الكتاب كاملاً':'Support to unlock full book') + '</a>'
        + '<div class="sub">' + (ar?'بعد الدعم يُفتَح الكتابُ تلقائيًّا على كلِّ أجهزتك.':'After support the book unlocks automatically on all your devices.') + '</div>'
        + '</div>';
    }

    function gate(){
      var doc = frame.contentDocument; if(!doc) return false;
      var sheets = doc.querySelectorAll('.sheet, .leaf, .page');
      if(!sheets.length) return false;
      var shown = 0;
      sheets.forEach(function(s,i){
        if(i < N){ s.style.removeProperty('display'); s.classList.remove('mkprev-hidden'); shown++; }
        else { s.style.setProperty('display','none','important'); s.classList.add('mkprev-hidden'); }
      });
      // neutralise the book's own print toolbar + block printing the hidden pages
      try{
        var st = doc.getElementById('__mkPrevStyle');
        if(!st){ st = doc.createElement('style'); st.id='__mkPrevStyle';
          st.textContent = '.toolbar{display:none !important} .mkprev-hidden{display:none !important} @media print{.mkprev-hidden{display:none !important}}';
          (doc.head||doc.documentElement).appendChild(st);
        }
        frame.contentWindow.print = function(){ try{ window.print(); }catch(e){} };
      }catch(e){}
      // append paywall once, after the last visible sheet's parent
      if(!doc.getElementById('__mkPrevWall')){
        var host = (sheets[0] && sheets[0].parentNode) || doc.body;
        var w = doc.createElement('div'); w.id='__mkPrevWall'; w.innerHTML = wallHTML();
        // copy our wall styles into the iframe doc
        var ws = doc.createElement('style');
        ws.textContent = document.querySelector('style').textContent;
        (doc.head||doc.documentElement).appendChild(ws);
        host.appendChild(w);
      }
      return shown>0;
    }

    var tries = 0, settled = 0;
    function poll(){
      tries++;
      var ok = false;
      try{ ok = gate(); }catch(e){ ok=false; }
      if(ok){ settled++; document.getElementById('loading').style.display='none'; }
      // keep re-gating briefly in case the book re-renders after load
      if(settled < 8 && tries < 80){ setTimeout(poll, 150); }
    }
    frame.addEventListener('load', function(){ tries=0; settled=0; poll(); });
    // fallback in case load fired before listener attached
    setTimeout(poll, 400);

    // block Ctrl/Cmd+P on the viewer chrome too (best-effort)
    window.addEventListener('keydown', function(e){
      if((e.ctrlKey||e.metaKey) && (e.key==='p'||e.key==='P')){ e.preventDefault(); }
    });
  })();
</script>
</body>
</html>
