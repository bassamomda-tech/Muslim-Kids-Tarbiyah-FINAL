<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>عجائب الخلق — نسخة النشر | Wonders of Creation (Publish / PDF)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../../../corners/faith-minaret/yaqeen-book.css">
<style>
  /* floating Save-as-PDF button — visible on screen, hidden in the printed PDF */
  .pub-print{position:fixed;top:16px;inset-inline-end:16px;z-index:60;background:linear-gradient(135deg,#D4A017,#c79518);color:#10243d;border:none;border-radius:2rem;padding:11px 22px;font-weight:900;font-family:'Tajawal',sans-serif;font-size:.95rem;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .pub-print:hover{filter:brightness(1.05)}
  .pub-hint{position:fixed;top:16px;inset-inline-start:16px;z-index:60;background:rgba(10,37,64,.85);color:#FEF5DC;border:1px solid rgba(212,160,23,.4);border-radius:2rem;padding:9px 18px;font-weight:700;font-size:.82rem;font-family:'Tajawal',sans-serif}
  @media print{.pub-print,.pub-hint{display:none!important}}
</style>
</head>
<body dir="rtl">

<div class="pub-hint">🖼️ اسحب صورك إلى الإطارات، ثم احفظ PDF — Drop your photos into the frames, then Save as PDF</div>
<button class="pub-print" onclick="window.print()">🖨️ احفظ PDF — Save as PDF</button>

<div id="stage"><div id="book"></div></div>

<script>window.YAQEEN_PUBLISH = true;</script>
<script src="../../../corners/faith-minaret/image-slot.js"></script>

<script src="../../../corners/faith-minaret/yaqeen-book.js"></script>
<script src="../../../corners/shared/book-art.js"></script>
</body>
