        '<ul><li><b>The picture page:</b> an illustration of the idea, a simile that brings it close, a practical task for today and a one-line key idea.</li>' +

        '<p><b>A suggested way:</b> one station a day. Read it together, ask your child what they see in the picture, agree on the task and tick it when it is done. There is no rush — the aim is for worship to become love and habit.</p>' +
