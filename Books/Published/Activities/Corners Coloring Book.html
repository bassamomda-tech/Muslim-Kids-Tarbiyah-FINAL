<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتابُ التلوين — أركان الحيّ | Coloring Book</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d4;font-family:'Tajawal','Nunito',sans-serif;color:#1c2a36}
  .toolbar{position:fixed;top:12px;inset-inline-end:12px;z-index:50}
  .toolbar button{background:linear-gradient(135deg,#C9A227,#b8901a);color:#10243d;border:none;border-radius:2rem;padding:.6rem 1.2rem;font-weight:900;font-family:inherit;font-size:.92rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .sheet{width:794px;min-height:1123px;background:#fff;margin:20px auto;padding:30px 30px 24px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column}
  .sh-title{text-align:center;font-weight:900;font-size:1.5rem;color:#0A2540;margin:0 0 2px}
  .sh-sub{text-align:center;font-weight:700;font-size:.86rem;color:#6a7785;margin-bottom:6px}
  .sh-svg{flex:1;display:flex;align-items:center;justify-content:center}
  .sh-svg svg{width:100%;height:auto;max-height:1010px}
  .pgn{text-align:center;font-size:.74rem;color:#9aa6b0;font-weight:700;margin-top:4px}
  /* cover */
  .cover{align-items:center;justify-content:center;text-align:center;gap:14px;border:6px double #C9A227;border-radius:22px;margin:8px;padding:40px}
  .cover .mascot{font-size:4.4rem}
  .cover h1{font-size:3rem;color:#0A2540;margin:0;line-height:1.15}
  .cover .csub{font-size:1.25rem;color:#6a7785}
  .cover .note{max-width:540px;line-height:1.9;color:#6a7785}
  .cover .row{font-size:2.2rem;letter-spacing:8px}
  @media print{body{background:#fff}.toolbar{display:none}.sheet{margin:0;box-shadow:none;width:auto;min-height:auto;page-break-after:always}@page{size:A4;margin:8mm}}
</style>
</head>
<body dir="rtl">
<div class="toolbar"><button onclick="window.print()">🖨️ طباعة / PDF</button></div>
<div id="book"></div>
<script src="coloring-scenes.js"></script>
<script>
(function(){
  var SC=window.COLOR_SCENES||[];
  var cover='<div class="sheet cover" style="display:flex;flex-direction:column">'+
    '<div class="mascot">🎨🖍️</div>'+
    '<h1>كتابُ التلوين<br>والأنشطة</h1>'+
    '<div class="csub">تربية الطفل المسلم · لوّن، وصِلْ، وأكمِلْ، وارسم</div>'+
    '<div class="note">عشرونَ صفحةً كبيرة: زخارفُ إسلاميةٌ هندسية، ومسجدٌ وبيوتٌ وفانوسٌ وكأسٌ ومحراب، ونجومٌ وأهِلّة — مع أنشطةٍ تُشغِّلُ خيالَك: صِلِ النقاط، وأكمِلِ النصفَ الآخر، وأتمِمِ الزخرفة، وارسمْ ما تحب. أمسِكْ ألوانَك وابدأ!</div>'+
    '<div class="row">🕌 🏮 🏆 🌙 ✦</div>'+
    '<div class="note">الاسم: ____________________</div></div>';
  var pages=SC.map(function(s,i){
    return '<div class="sheet"><div class="sh-title">'+s.ar+'</div><div class="sh-sub">'+s.en+'</div>'+
      '<div class="sh-svg"><svg viewBox="0 0 700 960" xmlns="http://www.w3.org/2000/svg">'+s.draw()+'</svg></div>'+
      '<div class="pgn">لوحة '+(i+1)+' / '+SC.length+' · كتابُ التلوين</div></div>';
  }).join('');
  document.getElementById('book').innerHTML=cover+pages;
})();
</script>
<script>
/* print-fit: scale any over-tall sheet so it fits ONE A4 page */
(function(){var B=1050;function f(){document.querySelectorAll('.sheet,.poster').forEach(function(p){p.style.zoom='';var h=p.scrollHeight||p.offsetHeight;if(h>B+70)p.style.zoom=String(B/h);});}function u(){document.querySelectorAll('.sheet,.poster').forEach(function(p){p.style.zoom='';});}window.addEventListener('beforeprint',f);window.addEventListener('afterprint',u);})();
</script>
</body>
</html>
