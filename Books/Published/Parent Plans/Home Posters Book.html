<script>
(function(){
  var lang = localStorage.getItem('bunyanLang') || 'ar';
  function tx(o){ return o ? (o[lang]||o.ar||'') : ''; }
  function AR(){ return lang==='ar'; }

  var CORNER = '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">'+
    '<path d="M6 94 L6 40 Q6 6 40 6 L94 6" stroke-opacity=".0"/>'+
    '<path d="M14 90 Q14 14 90 14" stroke-linecap="round"/>'+
    '<path d="M26 90 Q26 26 90 26" stroke-opacity=".55" stroke-linecap="round"/>'+
    '<circle cx="20" cy="20" r="5" fill="currentColor" stroke="none"/>'+
    '<path d="M40 14 l4 8 8 0 -6 6 2 9 -8 -5 -8 5 2 -9 -6 -6 8 0 z" fill="currentColor" stroke="none" opacity=".8" transform="translate(-6 -2) scale(.7)"/>'+
    '</svg>';

  var MOTIF = '<svg viewBox="0 0 200 280" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="1.2">'+
    (function(){var s='';for(var y=0;y<300;y+=40){for(var x=0;x<220;x+=40){s+='<path d="M'+x+' '+(y+10)+' q10 -10 20 0 q10 10 0 20 q-10 10 -20 0 q-10 -10 0 -20 z"/>';}}return s;})()+
    '</svg>';

  function star(){ return '✦'; }

  function head(p){
    return '<div class="p-head">'+
      '<div class="p-badge">'+star()+' '+tx(p.badge)+' '+star()+'</div>'+
      '<div class="p-ic">'+p.ic+'</div>'+
      '<h1 class="p-title">'+tx(p.title)+'</h1>'+
      '<div class="p-sub">'+tx(p.sub)+'</div>'+
      '<div class="p-rule"></div>'+
    '</div>';
  }
  function foot(p){
    return '<div class="p-foot"><div class="pf-tx">'+tx(p.foot.tx)+'</div><div class="pf-ref">— '+tx(p.foot.ref)+'</div></div>';
  }
  function bodyRules(p){
    return '<div class="p-body"><div class="rules">'+p.items.map(function(it,i){
      return '<div class="rule"><div class="r-n">'+(AR()?toAr(i+1):(i+1))+'</div><div class="r-ic">'+it.ic+'</div>'+
        '<div class="r-tx"><div class="r-main">'+tx(it.main)+'</div><div class="r-sub">'+tx(it.sub)+'</div></div></div>';
    }).join('')+'</div></div>';
  }
  function bodyGrid(p){
    return '<div class="p-body"><div class="pgrid">'+p.items.map(function(it){
      return '<div class="pcell"><div class="pc-ic">'+it.ic+'</div><div class="pc-main">'+tx(it.main)+'</div><div class="pc-sub">'+tx(it.sub)+'</div></div>';
    }).join('')+'</div></div>';
  }
  function bodyTimeline(p){
    return '<div class="p-body"><div class="timeline">'+p.items.map(function(it){
      return '<div class="tl"><div class="tl-time">'+tx(it.time)+'</div><div class="tl-ic">'+it.ic+'</div><div class="tl-tx">'+tx(it.tx)+'</div></div>';
    }).join('')+'</div></div>';
  }
  function bodyPledge(p){
    return '<div class="p-body"><div class="pledge">'+p.items.map(function(it){
      return '<div class="pl"><span class="pl-ic">'+it.ic+'</span><span>'+tx(it.tx)+'</span></div>';
    }).join('')+'</div></div>';
  }
  function toAr(n){ return String(n).replace(/[0-9]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];}); }

  function render(){
    if(typeof POSTERS==='undefined' || !POSTERS){ return; }
    var html = POSTERS.map(function(p){
      var t=p.theme;
      var vars='--pbg:'+t.bg+';--pacc:'+t.acc+';--pbadge:'+t.badge+';--ptitle:'+t.title+';--psub:'+t.sub+
        ';--pcard:'+t.card+';--pline:'+t.line+';--pfoot:'+t.foot+';--pmotif:'+t.motif+(t.ink?';--pink:'+t.ink:'')+';';
      var body = p.layout==='grid'?bodyGrid(p): p.layout==='timeline'?bodyTimeline(p): p.layout==='pledge'?bodyPledge(p): bodyRules(p);
      return '<div class="poster" style="'+vars+'">'+
        '<div class="motif" style="color:'+t.acc+'">'+MOTIF+'</div>'+
        '<div class="frame"></div>'+
        '<div class="corner c-tr" style="color:'+t.acc+'">'+CORNER+'</div>'+
        '<div class="corner c-tl" style="color:'+t.acc+'">'+CORNER+'</div>'+
        '<div class="corner c-br" style="color:'+t.acc+'">'+CORNER+'</div>'+
        '<div class="corner c-bl" style="color:'+t.acc+'">'+CORNER+'</div>'+
        head(p)+body+foot(p)+
        '<div class="p-sign">'+(AR()?'تربية الطفل المسلم · بوسترات البيت':'Muslim Kids\u2019 Tarbiyah · Home Posters')+'</div>'+
      '</div>';
    }).join('');
    document.getElementById('book').innerHTML = html;
  }

  window.setLang = function(l){
    lang=l; localStorage.setItem('bunyanLang',l);
    document.documentElement.lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr';
    var a=document.getElementById('segAr'), e=document.getElementById('segEn');
    if(a) a.classList.toggle('on',l==='ar'); if(e) e.classList.toggle('on',l==='en');
    render();
  };
  setLang(lang);
})();
</script>
<script>
/* print-fit: scale any over-tall sheet so it fits ONE A4 page */
(function(){var B=1050;function f(){document.querySelectorAll('.sheet,.poster').forEach(function(p){p.style.zoom='';var h=p.scrollHeight||p.offsetHeight;if(h>B+70)p.style.zoom=String(B/h);});}function u(){document.querySelectorAll('.sheet,.poster').forEach(function(p){p.style.zoom='';});}window.addEventListener('beforeprint',f);window.addEventListener('afterprint',u);})();
</script>
